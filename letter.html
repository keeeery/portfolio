<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>자기소개서</title>
<link rel="icon" href="images/favicon.svg" type="image/svg+xml" />
<script>/* 탭 아이콘: 브라우저 화면 모드(밝게·어둡게)가 바뀌면 그 자리에서 아이콘 파일을 갈아 끼움. 브라우저는 한 번 그린 탭 아이콘을 다시 그리지 않아 SVG 안의 규칙만으로는 바뀌지 않음 */(function(){var l=document.querySelector('link[rel="icon"]');if(!l||!window.matchMedia)return;var base=l.getAttribute('href').replace(/favicon\.svg$/,''),m=matchMedia('(prefers-color-scheme: dark)');function u(){l.href=base+'favicon-'+(m.matches?'dark':'light')+'.svg';}u();if(m.addEventListener)m.addEventListener('change',u);else if(m.addListener)m.addListener(u);})();</script>
<!-- 자기소개서 전문 페이지(직접 추가): 레포 맨 위의 자기소개서.md를 상세 기술문서(doc.html)와 같은 모양으로 그립니다.
     같은 CSS(assets/doc.css)·md 해석(assets/md-blocks.js)을 쓰고, 그리는 일은 assets/letter.js가 합니다. 포트폴리오 문서의 자기소개 아래 [자기소개서 전문 ↗]가 이 페이지로 옵니다. -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/montserrat@5.2.8/latin-700.css" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/montserrat@5.2.8/latin-800.css" />
<link rel="stylesheet" href="assets/doc.css" />
<link rel="stylesheet" href="theme/theme.css" />
<link rel="stylesheet" href="theme/theme-light.css" />
<style>:root { --measure: 40rem; }
</style><!-- 글만 있는 문서라 글줄을 템플릿 기본 40rem(640px)으로 — 기술문서는 표·그림 때문에 45rem -->
<script>try { const m = localStorage.getItem('pf-mode'); if (m ? m === 'light' : matchMedia('(prefers-color-scheme: light)').matches) document.documentElement.dataset.pfMode = 'light'; } catch (e) {}</script>
<script src="assets/page-anchor.js"></script><!-- 직접 추가: 같은 페이지 안 이동은 주소를 바꾸지 않고, 새로고침하면 보던 위치 그대로 + 로딩 그레이박스. <head>에서 외부 스크립트보다 먼저(그레이박스가 "불러오는 중…"보다 먼저 보이게) -->
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
</head>
<body>
<div id="top"></div>
<a class="skip-link" href="#main">본문으로 건너뛰기</a>
<div id="app"><p class="loading">불러오는 중…</p></div>
<noscript><div class="notice"><h1>JavaScript를 켜 주세요</h1><p>이 문서는 자기소개서.md를 읽어 브라우저에서 그립니다. JavaScript를 켠 뒤 다시 열어 주세요.</p></div></noscript>
<script src="assets/page-scrollbar.js"></script><!-- 직접 추가: 페이지 스크롤 막대를 내용 위에 겹쳐 그림(오른쪽 빈 띠 없이) -->
<script src="assets/strings.js"></script>
<script src="assets/common.js"></script>
<script src="assets/md-blocks.js"></script>
<script src="assets/letter.js"></script>
</body>
</html>
