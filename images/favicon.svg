<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- 페이지 아이콘: 셰이더볼. 투명 바탕에 원 하나, 그 안에 공 모양을 뚫고 오른쪽 아래 그림자 면만 남김(GitHub 아이콘 방식).
       화면 모드에 따라 색이 바뀜: 밝은 모드 = 짙은 원, 다크 모드 = 밝은 원(어두운 탭에서 묻히지 않게) -->
  <style>
    .ink { fill: #17181B; }
    @media (prefers-color-scheme: dark) { .ink { fill: #F2F3F5; } }
  </style>
  <defs>
    <mask id="ball"><rect width="32" height="32" fill="#fff"/><circle cx="16" cy="16" r="10.6" fill="#000"/></mask>
    <mask id="shade"><circle cx="16" cy="16" r="9" fill="#fff"/><circle cx="11.5" cy="11.5" r="8.6" fill="#000"/></mask>
  </defs>
  <circle class="ink" cx="16" cy="16" r="16" mask="url(#ball)"/>
  <circle class="ink" cx="16" cy="16" r="9" mask="url(#shade)"/>
</svg>
