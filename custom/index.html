<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>포트폴리오</title>
  <link rel="icon" href="data:,">
  <!-- /portfolio-custom 직접 생성 모드 — 다크 톤, 색은 포트폴리오 문서와 같은 테마(theme/theme.css · theme-light.css).
       배치: theme/layout.json(배치 레퍼런스). 내용은 ../data/*.json을 실행 중에 읽어 그립니다(내용을 이 파일에 복사하지 않음).
       포트폴리오 문서(index.html)와 같은 기능: 탭 제목 · 밝은/어두운 화면 버튼 · [PDF로 저장](A4) · 머리 막대 늘어남(프로젝트명 떠오름) · 기능별 발표 덱 장면 링크 · 새 탭 표시 ·
       주소로 절 바로 가기(#p-<폴더> 등) · 새로고침해도 읽던 위치 · 점검 PFPage.whenReady() → PFPage.report() -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/d2coding@1.3.2/d2coding-subset.css">
  <script src="https://cdn.tailwindcss.com/3.4.5"></script>
  <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>
  <link rel="stylesheet" href="../theme/theme.css">
  <link rel="stylesheet" href="../theme/theme-light.css">
  <script>
    // 그리기 전에 화면 모드를 정함: 포트폴리오 문서에서 고른 값(localStorage 'pf-mode') → 없으면 기기 설정
    try { var m = localStorage.getItem('pf-mode'); if (m ? m === 'light' : matchMedia('(prefers-color-scheme: light)').matches) document.documentElement.dataset.pfMode = 'light'; } catch (e) {}
  </script>
  <style>
    /* 색은 포트폴리오 문서와 같은 테마(--t-*)를 그대로. 테마가 없으면 괄호 안 기본값 */
    :root {
      --top-h: 56px; --ext-h: 40px; --ext-up: 8px; --ext-bg: 37px;                                                     /* 머리 막대 높이 */
      --bg: var(--t-bg, #0A0A0D);                                        /* 바탕 */
      --band: color-mix(in srgb, var(--ink) 4%, var(--bg));              /* 배경색이 다른 띠(layout.json background: tinted) */
      --card: var(--t-surface, #131318);                                 /* 띠 위 카드 */
      --line: var(--t-line, rgba(255,255,255,.09));
      --ink: var(--t-ink, #F5F5F7);                                      /* 제목 글 */
      --muted: var(--t-body, #C7C7CC);                                   /* 본문 글 */
      --sub: var(--t-muted, #86868B);                                    /* 작은 보조 글 */
      --accent: var(--t-accent, var(--accent-profile, #2F6FEB));         /* 테마 강조색 → 없으면 profile.md 강조색 */
      --accent-ink: var(--accent);                                       /* 글자에 쓰는 강조색 = 버튼 강조색과 같은 값(섞지 않음) */
      --divider: color-mix(in srgb, var(--ink) 70%, var(--bg));        /* 구분선(정보 표 줄 · 설명용 칩 외곽선): 밝은 회색(밝은 테마에선 짙은 회색) */
      --meta-label: var(--ink);                                         /* 정보 표 항목명(장르·기간…): 외곽선 버튼 글자색과 같게 */
      color-scheme: var(--t-scheme, dark);
    }
    html { scroll-behavior: smooth; scroll-padding-top: calc(var(--top-h) + 8px); }
    body { margin: 0; background: var(--bg); color: var(--ink); font-family: Pretendard, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      -webkit-font-smoothing: antialiased; word-break: keep-all; overflow-wrap: anywhere; transition: background-color .25s; }
    .wrap { max-width: 1040px; margin: 0 auto; padding: 0 20px; }
    @media (min-width: 760px) { .wrap { padding: 0 32px; } }
    .tinted { background: var(--band); }
    .eyebrow { font-family: var(--t-display, inherit), Pretendard, sans-serif; font-size: 12px; font-weight: 700; letter-spacing: .14em; color: var(--accent-ink); text-transform: uppercase; margin: 0; }
    .accent { color: var(--accent-ink); }
    .btn { display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 0 18px; border-radius: var(--t-pill, 999px); font-size: 14px; font-weight: 600;
      border: 1px solid var(--line); color: var(--ink); background: transparent; cursor: pointer; transition: background .15s, border-color .15s; white-space: nowrap; }
    .btn:hover { border-color: var(--accent); }
    .btn:disabled { opacity: .6; cursor: progress; }
    .btn-solid { background: var(--accent); border-color: var(--accent); color: #fff; }
    .btn-solid:hover { filter: brightness(1.1); }
    .btn-sm { min-height: 34px; padding: 0 14px; font-size: 13px; }
    .btn-icon { width: 34px; min-height: 34px; padding: 0; justify-content: center; }
    .chip { display: inline-block; font-size: 12px; font-weight: 600; padding: 3px 11px; border-radius: var(--t-pill, 999px); border: 1px solid var(--divider); color: var(--ink); background: transparent; white-space: nowrap; }   /* 설명용 칩: 외곽선 버튼 모양 · 크기만 작게 · 외곽선은 구분선 색 */
    a.chip:hover { color: var(--ink); border-color: var(--accent); }
    code { font-family: "D2Coding", ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .9em; padding: 1px 5px; border-radius: 5px; background: color-mix(in srgb, var(--ink) 9%, transparent); }
    strong { color: var(--ink); font-weight: 700; }
    a:focus-visible, .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
    .nt-icon { display: inline-block; vertical-align: -1px; margin-left: 3px; opacity: .8; }
    .sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
    .skip-link { position: absolute; left: 12px; top: -48px; z-index: 100; padding: 8px 14px; border-radius: 8px; background: var(--accent); color: #fff; }
    .skip-link:focus { top: 12px; }
    .noscroll { scrollbar-width: none; } .noscroll::-webkit-scrollbar { display: none; }
    .print-only { display: none; }
    /* 공용 규칙 — 글자 띄우기(.text-lift): 사진·흐린 그림처럼 색이 고르지 않은 바탕 위에서 글자가 잘 안 보일 때만 골라서 붙임.
       안쪽 모든 글자에 그 영역 바탕색 쪽의 아주 옅은 그림자(어두운 테마=어두운 그림자, 밝은 테마=밝은 그림자). 기본으로는 어디에도 붙지 않음 */
    .text-lift, .text-lift * { text-shadow: 0 1px 3px color-mix(in srgb, var(--bg) 32%, transparent), 0 0 1px color-mix(in srgb, var(--bg) 18%, transparent); }
    /* 절 머리: 왼쪽 [작은 영문 · 큰 제목], 오른쪽 보조 글 */
    .sec-head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px; margin-bottom: 40px; }
    .sec-head h2 { margin: 12px 0 0; font-size: clamp(30px, 4.6vw, 48px); font-weight: 700; letter-spacing: -.025em; line-height: 1.2; }
    .sec-head.big h2 { font-size: clamp(36px, 6vw, 60px); }
    .sec-r { margin: 0; font-size: 14px; font-weight: 600; color: var(--sub); }
    /* 2단·3단: 넓은 화면에서만 비율대로, 760px 미만은 한 열(그림 → 글) */
    .split { display: grid; gap: 40px; }
    .cols3, .grid2, .grid3 { display: grid; gap: 20px; }
    .cols3 { gap: 40px; }
    @media (min-width: 760px) {
      .split { grid-template-columns: 35fr 65fr; align-items: center; gap: 56px; }
      .split .media { order: 2; }
      .cols3 { grid-template-columns: 42fr 23fr 35fr; }
      .grid2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .grid3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    }
    /* 기술 스택: 아이콘 → 굵은 기술 이름 → 근거 한 줄씩(뒤에 작은 프로젝트 이름). 넓은 화면 3열 · 760px 미만 한 열 */
    .stk { display: grid; gap: 44px; margin: 0; padding: 0; list-style: none; }
    .stk-icon { display: block; color: var(--ink); }
    .stk-name { margin: 18px 0 10px; font-size: 18px; font-weight: 700; letter-spacing: -.01em; line-height: 1.35; color: var(--ink); }
    .stk-ev { margin: 0; font-size: 15px; line-height: 1.6; color: var(--muted); }
    .stk-ev + .stk-ev { margin-top: 6px; }
    .stk-pj { margin-left: 6px; font-size: 12px; font-weight: 600; color: var(--sub); white-space: nowrap; }
    @media (min-width: 760px) { .stk { grid-template-columns: repeat(3, minmax(0, 1fr)); column-gap: 48px; row-gap: 64px; } }
    /* 프로젝트 링크 캡슐: 앞 프로젝트의 캡슐이 화면에서 사라지면 화면 아래 가운데에 떠오르고(.on), 내려가다 기능 소개 아래 자리에 닿으면 거기 머묾(sticky).
       프로젝트 링크는 이 캡슐 하나로(프로젝트 소개 절에는 버튼 없음 — 인쇄용 주소 목록만) */
    .cap { position: sticky; bottom: 20px; z-index: 30; display: flex; justify-content: center; margin: 48px 0 96px; pointer-events: none; }
    @media (min-width: 760px) { .cap { margin: 56px 0 128px; } }
    /* 고정된 기능 소개 뒤: 캡슐의 제자리를 '마지막 기능까지 스크롤했을 때 떠 있던 자리'와 똑같이(트랙 끝 − 캡슐 높이 − 아래 여백 20px) → 고정이 풀리는 순간 그 자리에 붙음 */
    @media screen and (min-width: 760px) { .sec.core + .cap { margin-top: calc(-1 * (var(--cap-h, 50px) + 20px)); } }
    .cap-pill { display: flex; gap: 6px; max-width: calc(100vw - 24px); padding: 6px; overflow-x: auto; border: 1px solid var(--line); border-radius: 999px;
                background: color-mix(in srgb, var(--card) 72%, transparent); -webkit-backdrop-filter: blur(24px) saturate(1.6); backdrop-filter: blur(24px) saturate(1.6);
                box-shadow: 0 12px 40px rgba(0,0,0,.35); pointer-events: auto;
                opacity: 0; transform: translateY(36px) scale(.96); visibility: hidden;
                transition: opacity .4s ease .05s, transform .5s cubic-bezier(.5,0,.75,0), visibility 0s linear .55s, box-shadow .3s ease;   /* 사라질 때: 아래로 가라앉음 */ }
    .cap.on .cap-pill { opacity: 1; transform: none; visibility: visible; transition: opacity .45s ease, transform .6s cubic-bezier(.2,.7,.2,1), visibility 0s, box-shadow .3s ease; }
    .cap.docked .cap-pill { box-shadow: none; }
    @media (max-width: 480px) { .cap-pill { gap: 0; padding: 4px; } .cap-pill .btn { padding: 0 9px; font-size: 12.5px; } .cap-pill .nt-icon { display: none; } }
    .cap-pill .btn { min-height: 36px; padding: 0 16px; font-size: 13px; white-space: nowrap; flex-shrink: 0; }
    .cap-pill .btn:not(.btn-solid) { border-color: transparent; background: transparent; }
    .cap-pill .btn:not(.btn-solid):hover { background: color-mix(in srgb, var(--ink) 8%, transparent); }
    @media (prefers-reduced-motion: reduce) { .cap-pill, .cap.on .cap-pill { transition: none !important; } }
    /* 기능 소개(목록 + 고정된 큰 그림): 넓은 화면은 트랙(.fe, 기능 수 × 40vh + 한 화면) 안에서 [목록 40 | 그림 60]이 머리 막대 아래에 붙어 있음.
       현재 기능만 펼치고(.on) 나머지는 번호·제목만 흐리게. 760px 미만·인쇄는 기능마다 그림 → 글, 모두 펼침 */
    .fe-list { display: grid; gap: 56px; margin: 0; padding: 0; list-style: none; }
    .fe-inline { margin: 0 0 20px; }
    .fe-img { border: 1px solid var(--line); }                       /* 링크 캡슐과 같은 외곽선(기능 이미지) */
    /* 대표 이미지 — 흐린 배경 위 카드: 같은 그림을 절 전체에 꽉 차게(cover) 키워 아주 강하게 흐린 배경(.proj-backdrop)으로 깔고,
       원본은 그 위에 선명한 카드로(둥근 모서리 · 그림자). 배경 그림의 중심은 카드 중심에 맞추고(스크립트), 흐림 끝이 어두워지지 않게 절보다 넉넉히 크게.
       이 절은 화면 모드와 상관없이 어두운 테마 색(스크립트가 어두운 모드 값을 읽어 절에 고정) */
    .sec.proj { position: relative; overflow: clip; }
    .proj-backdrop { position: absolute; inset: 0; z-index: 0; pointer-events: none; }
    .proj-backdrop img { position: absolute; left: 50%; top: 50%; width: 125%; height: auto; max-width: none; max-height: none; transform: translate(-50%, -50%); filter: blur(80px) saturate(1.25) brightness(.8); }   /* 위치·크기는 스크립트가 카드 중심에 맞춤 */
    .sec.proj > .wrap { position: relative; z-index: 1; }
    .cover-fade > .shot { border-radius: 16px; box-shadow: 0 30px 80px -10px rgba(0,0,0,.55); }   /* 외곽선 없이 그림자만 */
    @media screen and (min-width: 760px) { .sec.proj .split { grid-template-columns: 30fr 70fr; gap: 40px; } }
    .fe-head { display: block; width: 100%; padding: 0; border: 0; background: none; color: inherit; font: inherit; text-align: left; cursor: default; }
    .fe-no { display: block; }
    .fe-title { display: block; margin-top: 8px; font-size: clamp(20px, 2.2vw, 24px); font-weight: 700; letter-spacing: -.02em; line-height: 1.35; color: var(--ink); }
    .fe-pane { display: none; }
    .fe-what { min-height: calc(3em * 1.625); }                       /* 기능 제목+설명 = '제목 1줄 + 설명 3줄' 높이를 늘 확보(제목이 2줄이면 설명 자리는 2줄). 정확한 높이는 스크립트가 제목 줄 수를 재서 맞춤 → [발표 덱에서 보기]가 같은 높이에 */
    @media screen and (min-width: 760px) {
      .fe { height: calc(var(--fe-n) * 40vh + 100vh - var(--top-h) - var(--ext-bg)); }
      .fe-pin { position: sticky; top: calc(var(--top-h) + var(--ext-bg)); height: calc(100vh - var(--top-h) - var(--ext-bg)); display: flex; align-items: center; }
      .fe-grid { display: grid; grid-template-columns: 40fr 60fr; gap: 56px; align-items: center; width: 100%; }
      /* 목록의 각 항목은 스크립트가 잰 '접힘/펼침 높이'로 계산한 자리(top)에 놓이고, 그 자리만 같은 곡선으로 옮겨 감 →
         전환 중 다른 항목들이 레이아웃 계산의 미세한 차이로 움찔거리지 않음. 목록 높이는 펼친 경우 중 가장 큰 높이로 고정 */
      .fe-list { gap: 0; position: relative; }
      .fe-list.fe-placed > .fe-item { position: absolute; left: 0; right: 0; top: var(--top, 0); transition: top .5s cubic-bezier(.2,.7,.2,1); }
      .fe-inline { display: none; }
      .fe-item { padding: 10px 0; }
      .fe-head { cursor: pointer; opacity: .38; transition: opacity .4s ease; }
      .fe-item.on .fe-head { cursor: default; opacity: 1; }
      .fe-head:hover { opacity: .7; }
      .fe-title { font-size: 17px; margin-top: 6px; height: var(--th-off, auto); overflow: hidden; transition: height .5s cubic-bezier(.2,.7,.2,1), font-size .5s cubic-bezier(.2,.7,.2,1); }   /* 글자 크기는 서서히 바뀌되, 레이아웃은 제목 칸 높이(스크립트가 잰 접힘/펼침 높이)로만 움직여 중간 줄바꿈이 있어도 튀지 않음 */
      .fe-item.on .fe-title { height: var(--th-on, auto); }
      .fe-item.on .fe-title { font-size: clamp(20px, 2vw, 24px); }
      .fe-no { font-size: 11px; }
      /* 본문·버튼: 자리가 늘어나는 동안 함께 페이드 인(처음 방식). 늘어나는 아래 끝은 딱 잘린 선이 아니라 부드럽게 흐려져(.fe-detail-in 마스크) 패널이 걷히는 것처럼 보이지 않음 */
      .fe-detail { display: grid; grid-template-rows: 0fr; opacity: 0; will-change: opacity; transition: grid-template-rows .5s cubic-bezier(.2,.7,.2,1), opacity .35s ease; }   /* 페이드가 끝나도 그리기 층이 바뀌지 않게(끝나는 순간 글자 다시 그리며 움찔하는 것 방지) */
      .fe-item.on .fe-detail { grid-template-rows: 1fr; opacity: 1; transition: grid-template-rows .5s cubic-bezier(.2,.7,.2,1), opacity .45s ease .12s; }
      .fe-detail-in { min-height: 0; overflow: hidden; padding-bottom: 0; transition: padding-bottom .5s cubic-bezier(.2,.7,.2,1);
                      -webkit-mask-image: linear-gradient(to bottom, #000 calc(100% - 10px), transparent); mask-image: linear-gradient(to bottom, #000 calc(100% - 10px), transparent); }
      .fe-item.on .fe-detail-in { padding-bottom: 10px; }               /* 펼친 항목만 아래 10px 빈 여백 → 다 펼쳐지면 흐림이 글·버튼에 닿지 않음 */
      .fe-item:not(.on) .fe-detail a { visibility: hidden; }
      .fe-pane { display: flex; align-items: center; gap: 18px; }
      /* 그림 레일: 현재 기능 그림은 가운데, 이전 그림은 위·다음 그림은 아래에 흐리게 일부만(위아래 끝은 서서히 사라짐). 기능이 바뀌면 레일이 위아래로 밀림 */
      .fe-stage { position: relative; flex: 1; min-width: 0; height: calc(100vh - var(--top-h) - var(--ext-bg) - 40px); overflow: hidden;
                  -webkit-mask-image: linear-gradient(transparent, #000 16%, #000 84%, transparent); mask-image: linear-gradient(transparent, #000 16%, #000 84%, transparent); }
      /* 진행 캡슐(세로): 현재 기능은 길쭉한 막대 안이 스크롤한 만큼 위에서부터 차오르고, 나머지는 점 */
      .fe-dots { display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 18px 11px; border-radius: 999px; background: color-mix(in srgb, var(--ink) 10%, var(--bg)); }
      .fe-dot { display: block; width: 8px; height: 8px; padding: 0; border: 0; border-radius: 999px; background: color-mix(in srgb, var(--ink) 38%, transparent); cursor: pointer; overflow: hidden; transition: height .45s cubic-bezier(.2,.7,.2,1), background-color .3s ease; }
      .fe-dot:hover { background: color-mix(in srgb, var(--ink) 60%, transparent); }
      .fe-dot.on { height: 44px; cursor: default; background: color-mix(in srgb, var(--ink) 38%, transparent); }
      .fe-dot i { display: block; width: 100%; height: 100%; border-radius: inherit; background: var(--ink); transform: translateY(-100%); }
      .fe-dot.on i { transform: translateY(calc((max(var(--fill, 0), .18) - 1) * 100%)); }   /* 늘이지 않고 위에서 밀어 내려 끝이 늘 둥글게 */
      .fe-shot { --d: 0; position: absolute; left: 0; right: 0; top: 50%; opacity: 0; pointer-events: none;
                 transform: translateY(calc(-50% + var(--d) * (100% + 56px))) scale(.94);   /* 56px = 예전 간격 28px + 캡션 자리(캡션이 이미지 영역에서 빠졌으므로) */
                 transition: transform .65s cubic-bezier(.2,.7,.2,1), opacity .5s ease; }
      .fe-shot.near { opacity: .28; }
      .fe-shot.on { opacity: 1; transform: translateY(-50%); }
      .fe-shot figcaption { position: absolute; left: 0; right: 0; top: 100%; margin-top: 12px; text-align: right; transition: opacity .3s ease; }   /* 캡션은 중앙 계산에서 빼고 이미지 아래에 매달기 → 이미지 자체가 진행 캡슐·목록과 같은 중심선 */
      .fe-shot:not(.on) figcaption { opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) { .fe-head, .fe-title, .fe-detail, .fe-shot, .fe-dot { transition: none !important; } }
    .fe-measure, .fe-measure *, .fe-snap, .fe-snap * { transition: none !important; }   /* 목록 높이를 잴 때 · 여러 칸 건너뛸 때 중간 항목을 즉시 접을 때 애니메이션 끔 */
    /* 그림 칸 4:3. 그림 비율이 4:3과 15% 넘게 다르면(.fit) 잘라 내지 않고 전체를 보여 줌 — 포트폴리오 문서와 같은 규칙 */
    .shot { position: relative; aspect-ratio: 4 / 3; background: #000; overflow: hidden; }
    .shot img { display: block; width: 100%; height: 100%; object-fit: cover; }
    .shot.fit img { object-fit: contain; padding: 8px; }
    .reveal { opacity: 0; transform: translateY(24px); transition: opacity .7s ease, transform .7s ease; }
    .reveal.in { opacity: 1; transform: none; }
    @media (prefers-reduced-motion: reduce) { .reveal { opacity: 1; transform: none; transition: none; } html { scroll-behavior: auto; } }
    .msg { max-width: 640px; margin: 0 auto; padding: 120px 20px; text-align: center; color: var(--muted); line-height: 1.7; }
    .msg pre { display: inline-block; margin: 12px 0; padding: 8px 14px; border-radius: 8px; background: var(--card); color: var(--ink); }

    /* 머리 막대 늘어남(화면만, 기술 스택 · 프로젝트마다): 묶음(.pg)의 큰 제목이 머리 막대 뒤로 완전히 사라지면 머리 막대 바탕(.nh-bg)이 37px 아래로(프로젝트 줄 아래 여백 16px) 늘어나고,
       그 안에 [PROJECT 00 / 00] → [프로젝트명 · 기능 소개]가 시간차를 두고 아래에서 위로 떠오름. 묶음이 끝나면 다시 줄어듦 */
    .nh-bg { position: absolute; left: 0; right: 0; top: 0; height: var(--top-h); border-bottom: 1px solid var(--line);
             background: color-mix(in srgb, var(--bg) 80%, transparent); -webkit-backdrop-filter: blur(24px) saturate(1.6); backdrop-filter: blur(24px) saturate(1.6);
             transition: height .45s cubic-bezier(.2,.7,.2,1) .05s; }
    .site-head.ext .nh-bg { height: calc(var(--top-h) + var(--ext-bg)); transition-delay: 0s; }
    .nh-ext { position: absolute; left: 0; right: 0; top: calc(var(--top-h) - var(--ext-up)); height: var(--ext-h); overflow: hidden; pointer-events: none; }
    .nh-ext-w { display: grid; height: 100%; }
    .nh-bar { grid-area: 1 / 1; display: flex; align-items: center; gap: 14px; min-width: 0; }
    .nh-bar > * { opacity: 0; transform: translateY(1px); transition: opacity .18s ease, transform .18s ease; }
    .nh-bar.on > * { opacity: 1; transform: none; transition: opacity .45s ease, transform .6s cubic-bezier(.2,.7,.2,1); }
    .nh-bar.on > .nh-eb { transition-delay: .12s; }                      /* PROJECT 00 / 00 먼저 */
    .nh-bar.on > .nh-title { transition-delay: .26s; }                   /* 프로젝트명은 조금 뒤에 */
    .nh-eb { flex-shrink: 0; white-space: nowrap; }
    .nh-title { min-width: 0; margin: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 15px; font-weight: 700; letter-spacing: -.01em; color: var(--ink); }
    .nh-sub { color: inherit; font-weight: inherit; opacity: 0; transition: opacity .3s ease; }
    .site-head.in-core .nh-sub { opacity: 1; }
    .pg > .sec.core { scroll-margin-top: calc(var(--top-h) + var(--ext-bg)); }
    @media screen { .pg > .sec.core .sec-head { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; } }
    @media (prefers-reduced-motion: reduce) { .nh-bg, .nh-bar > *, .nh-sub { transition: none !important; } }

    /* A4 인쇄(PDF로 저장): 화면 모드와 상관없이 흰 종이. 버튼·머리 막대·움직임은 빼고, 링크는 칠 수 있는 주소로 */
    @media print {
      @page { size: A4; margin: 14mm 14mm 16mm; }
      :root, .sec.proj { --bg: #fff !important; --band: #F7F8FC !important; --card: #fff !important; --line: #E3E5EE !important; --ink: #20233A !important;
              --muted: #3B3F57 !important; --sub: #5C6178 !important; --accent-ink: var(--accent) !important;
              --divider: #C9CBD6 !important; --meta-label: #20233A !important; color-scheme: light; }
      .sec.proj { color: var(--ink); }
      html { scroll-behavior: auto; font-size: 10pt; }
      body { background: #fff !important; }
      .no-print, .skip-link, .nt-icon, .nt-sr { display: none !important; }
      .text-lift, .text-lift * { text-shadow: none !important; }
      .print-only { display: block !important; }
      .reveal { opacity: 1 !important; transform: none !important; transition: none !important; }
      .wrap { max-width: none; padding: 0; }
      section, footer { padding: 0 !important; margin-top: 16pt; background: none !important; border: 0 !important; min-height: 0 !important; }
      #cover { padding: 30mm 0 6mm !important; margin: 0; }
      #cover h1 { font-size: 40pt !important; }
      .sec.proj, .sec.core, #glance { break-before: page; margin-top: 0; }
      .sec-head { margin-bottom: 10pt; break-after: avoid; }
      .sec-head h2, .sec-head.big h2 { font-size: 18pt; margin-top: 4pt; }
      .sec.core .sec-head { position: static !important; width: auto !important; height: auto !important; margin: 0 0 10pt !important; overflow: visible !important; clip: auto !important; white-space: normal !important; }
      .split { grid-template-columns: 5fr 6fr; gap: 16pt; align-items: start; }
      .split .media { order: 0; }
      .grid2 { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10pt; }
      .grid3 { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10pt; }
      .cols3 { grid-template-columns: 4fr 3fr 4fr; gap: 16pt; }
      .cap { display: none !important; }
      .proj-backdrop { display: none !important; }
      .cover-fade > .shot { box-shadow: none !important; }
      .fe-pane { display: none !important; }
      .fe-inline { display: block !important; }
      .fe-item { break-inside: avoid; }
      .fe { height: auto !important; }
      .fe-pin { position: static !important; height: auto !important; }
      .fe-list { gap: 14pt; }
      .stk { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14pt 20pt; }
      .stk-item { break-inside: avoid; }
      .stk-icon { width: 24px; height: 24px; }
      .stk-name { margin: 6pt 0 4pt; }
      .grid2 > *, .grid3 > *, .card-print { break-inside: avoid; border: 1px solid var(--line) !important; }
      .rounded-3xl { border-radius: 10px !important; }
      .p-7 { padding: 10pt !important; }
      .mt-14, .mt-20, .md\:mt-20 { margin-top: 12pt !important; }
      .purls { display: grid !important; grid-template-columns: max-content 1fr; gap: 3pt 12pt; margin-top: 12pt; font-size: 9pt; }
      .purls > div { display: contents; }
      .purls dt { color: var(--sub); }
      .purls dd { margin: 0; }
      a { text-decoration: none; color: inherit; }
      .shot { background: #f2f3f7; }
    }
  </style>
</head>
<body>
  <a class="skip-link" href="#main">본문으로 건너뛰기</a>
  <div id="root"><p class="msg">불러오는 중…</p></div>
  <noscript><p class="msg">이 포트폴리오는 data/의 내용을 읽어 브라우저에서 그립니다. JavaScript를 켠 뒤 다시 열어 주세요.</p></noscript>

  <script type="text/babel" data-presets="react">
    const { useEffect, useState, useRef, Fragment } = React;
    const html = document.documentElement;

    // ── 점검: PFPage.whenReady() → PFPage.report() (포트폴리오 문서와 같은 모양) ──
    const info = { errors: [], sections: [], projects: 0, others: 0 };
    let resolveReady; const ready = new Promise((r) => { resolveReady = r; });
    html.dataset.pfReady = 'no';
    window.PFPage = { whenReady: () => ready, report };
    function report() {
      const imgs = [...document.images];
      return { page: 'portfolio-custom', ready: html.dataset.pfReady, sections: info.sections, projects: info.projects, others: info.others,
        images: { total: imgs.length, broken: imgs.filter((i) => i.complete && i.naturalWidth === 0).map((i) => i.getAttribute('src')), pending: imgs.filter((i) => !i.complete).map((i) => i.getAttribute('src')) },
        deckLinks: [...document.querySelectorAll('a[data-deck-scene]')].map((a) => a.getAttribute('href')),
        overflowX: Math.max(0, html.scrollWidth - html.clientWidth), errors: info.errors };
    }

    // ── 문구 표(theme/strings.tsv): "내 문구" 칸 → 비면 기본 문구. {a.b}는 다른 줄, {n}은 넣는 값 ──
    const FALLBACK = {
      'name.portfolio': '포트폴리오', 'name.deck': '발표 덱', 'name.doc': '상세 기술문서', 'name.doc-short': '상세 문서', 'name.video': '시연 영상', 'name.role': '내 역할', 'name.role-short': '역할',
      'name.intent': '개발 의도', 'name.team': '팀 프로젝트', 'name.solo': '개인 프로젝트',
      'en.portfolio': 'PORTFOLIO', 'en.about': 'ABOUT ME', 'en.skills': 'SKILLS', 'en.project': 'PROJECT', 'en.feature': 'FEATURE', 'en.others': 'OTHER WORK',
      'en.glance': 'AT A GLANCE', 'en.contact': 'CONTACT', 'en.link': 'LINK',
      'page.updated': '업데이트 {date}', 'page.intro': '자기소개', 'page.stack': '기술 스택', 'page.stack-note': '근거 프로젝트와 함께', 'page.project-no': '{en.project} {no} / {total}',
      'page.features': '기능 소개', 'page.see-in-deck': '{name.deck}에서 보기', 'page.see-in-doc': '기술문서에서 보기', 'page.browser-note': '이 문서는 넓은 화면(PC), Chrome 브라우저 환경에 최적화되어 있습니다.', 'page.last-updated': '마지막 업데이트 {date}', 'page.deck-all': '{name.deck} 전체', 'page.others': '기타 프로젝트', 'page.glance': '프로젝트 요약',
      'page.nav-intro': '소개', 'page.nav-stack': '{page.stack}', 'page.nav-projects': '프로젝트', 'page.nav-others': '기타', 'page.nav-glance': '한눈에 보기', 'page.nav-contact': '연락처',
      'page.print-email': '이메일', 'page.print-web': '웹 {name.portfolio}',
      'ui.pdf': 'PDF로 저장', 'ui.preparing': '준비 중…', 'ui.skip': '본문으로 건너뛰기',
    };
    function parseStrings(tsv) {
      const map = {};
      tsv.replace(/^﻿/, '').split(/\r?\n/).forEach((line, i) => {
        if (!i || !line || line.startsWith('#')) return;
        const c = line.split('\t');
        if (c.length < 3) return;
        map[c[0].trim()] = (c[3] || '').trim() || c[2];
      });
      return map;
    }
    let STR = { ...FALLBACK };
    function t(key, vars = {}, depth = 0) {
      const raw = STR[key] ?? FALLBACK[key] ?? key;
      return raw.replace(/\{([\w.-]+)\}/g, (m, k) => k.includes('.') ? (depth < 5 ? t(k, {}, depth + 1) : m) : (vars[k] ?? m));
    }

    // ── 글 조각: **굵게**, `코드`만 해석(나머지는 글 그대로) ──
    function Inline({ text }) {
      if (!text) return null;
      return String(text).split(/(\*\*[^*]+\*\*|`[^`]+`)/g).filter(Boolean).map((s, i) => s.startsWith('**') ? <strong key={i}>{s.slice(2, -2)}</strong>
        : s.startsWith('`') ? <code key={i}>{s.slice(1, -1)}</code> : <Fragment key={i}>{s}</Fragment>);
    }
    const isUrl = (u) => typeof u === 'string' && /^https?:\/\//i.test(u);
    const shortUrl = (u) => String(u || '').replace(/^https?:\/\/(www\.)?/i, '').replace(/\/$/, '');
    const visibleUrl = (rel) => { let u = new URL(rel, location.href); u = `${u.host}${u.pathname}${u.search}`; try { u = decodeURI(u); } catch { /* 그대로 */ } return u; };
    const pad2 = (n) => String(n).padStart(2, '0');
    const encodePath = (p) => String(p).replace(/^\.\//, '').split('/').map(encodeURIComponent).join('/');
    const img = (p, src) => `../src/${encodeURIComponent(p.id)}/${encodePath(src)}`;
    const teamLabel = (team) => team?.type === 'team' ? t('name.team') : t('name.solo');   // 인원수는 프로젝트 정보 표(meta)에 있어 빼고 팀/개인만
    // 발표 덱의 그 기능 장면(포트폴리오 문서와 같은 규칙: highlights[].section → deck.slides의 sectionPath)
    const normTitle = (s) => String(s || '').replace(/[`*_~]/g, '').replace(/\s+/g, ' ').trim();
    const keyOk = (k) => /^[a-z][a-z0-9-]{1,31}$/.test(k || '') && !/^s-\d+$/.test(k);
    function deckSceneFor(p, section) {
      const want = normTitle(section);
      if (!want || !p.deck?.slides?.length) return '';
      const last = (x) => normTitle((x.sectionPath || []).slice(-1)[0]);
      const find = (list) => list.find((x) => last(x) === want) || list.find((x) => (x.sectionPath || []).some((s) => normTitle(s) === want));
      const sl = find(p.deck.slides);
      if (sl) return keyOk(sl.key) ? `d-${sl.key}` : '';
      const hid = find(p.deck.base || []);
      return hid && keyOk(hid.chapter) && p.deck.slides.some((x) => x.chapter === hid.chapter) ? `ch-${hid.chapter}` : '';
    }
    const deckHref = (p, sid = '') => `../project.html?p=${encodeURIComponent(p.id)}${sid ? `#s=${sid}` : ''}`;
    const docHref = (p) => `../doc.html?p=${encodeURIComponent(p.id)}`;
    // 기능마다 [기술문서에서 보기]: 상세 기술문서의 그 기능을 설명한 절로(#sec=<절 제목> — doc.html이 제목을 찾아 그 자리로 이동·강조).
    //   기본은 기능 소개가 가리키는 절(highlights[].section). 그 절보다 더 맞는 절이 있는 기능만 아래 표에서 바꿈(기술 문서를 보고 고름)
    const DOC_SECTION = {
      '3-Folk-Sack': { 3: '4.2 핵심 API — 탈출·매몰 판정과 피해 전달' },   // 낙하 지형 충돌·탈출·매몰 — '4.1 개요와 구조'보다 판정·피해 처리를 직접 설명하는 절
    };
    const docSecHref = (p, i, h) => { const sec = DOC_SECTION[p.id]?.[i] || h.section; return sec ? `${docHref(p)}#sec=${encodeURIComponent(sec)}` : docHref(p); };

    // 링크 규칙(포트폴리오 문서와 같음): 다른 페이지·외부 = 새 탭 + ↗ + 읽기 도구용 "(새 탭)". 같은 페이지 안 이동·메일 = 같은 탭
    const NewTabIcon = () => <><svg className="nt-icon" aria-hidden="true" focusable="false" viewBox="0 0 12 12" width="11" height="11"><path d="M4.5 2.5h5v5M9.5 2.5 3 9" fill="none" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round"/></svg><span className="sr-only nt-sr">(새 탭)</span></>;
    const Ext = ({ href, className, children, ...rest }) => <a href={href} className={className} target="_blank" rel="noopener" {...rest}>{children}<NewTabIcon /></a>;

    // 인쇄(PDF)에서 버튼 대신 보이는 주소 목록. rows: [이름, 링크]
    function PrintUrls({ rows }) {
      const list = rows.filter(Boolean);
      if (!list.length) return null;
      return <dl className="print-only purls">{list.map(([k, href]) => <div key={k + href}><dt>{k}</dt><dd><a href={href}>{href.startsWith('mailto:') ? href.slice(7) : isUrl(href) ? shortUrl(href) : visibleUrl(href)}</a></dd></div>)}</dl>;
    }
    const projectUrlRows = (p) => [[t('name.deck'), deckHref(p)], [t('name.doc'), docHref(p)], isUrl(p.links?.github) && ['GitHub', p.links.github],
      isUrl(p.links?.video) && [t('name.video'), p.links.video], ...(p.links?.extra || []).filter((l) => isUrl(l.url)).map((l) => [l.label, l.url])];

    function ProjectLinks({ p, solid }) {
      const L = p.links || {};
      return (
        <div className="no-print flex flex-wrap gap-2">
          <Ext className={'btn' + (solid ? ' btn-solid' : '')} href={deckHref(p)}>{t('name.deck')}</Ext>
          <Ext className="btn" href={docHref(p)}>{t('name.doc')}</Ext>
          {isUrl(L.github) && <Ext className="btn" href={L.github}>GitHub</Ext>}
          {isUrl(L.video) && <Ext className="btn" href={L.video}>{t('name.video')}</Ext>}
          {(L.extra || []).filter((l) => isUrl(l.url)).map((l) => <Ext key={l.url} className="btn" href={l.url}>{l.label}</Ext>)}
        </div>
      );
    }

    // 그림 칸 4:3 — 비율이 15% 넘게 다르면 .fit(잘라 내지 않음)
    function Shot({ src, alt, w, h, eager }) {
      const off = (a, b) => a > 0 && b > 0 && Math.abs(a / b / (4 / 3) - 1) > 0.15;
      const [fit, setFit] = useState(off(w, h));
      return (
        <div className={'shot' + (fit ? ' fit' : '')}>
          <img src={src} alt={alt} loading={eager ? 'eager' : 'lazy'} decoding="async" width={w || undefined} height={h || undefined}
            onLoad={(e) => { if (!w || !h) setFit(off(e.currentTarget.naturalWidth, e.currentTarget.naturalHeight)); }} />
        </div>
      );
    }

    // ── 화면 모드 버튼(밝은 테마 파일이 실제로 바탕색을 바꿀 때만) ──
    const SUN = <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>;
    const MOON = <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>;
    const getMode = () => (html.dataset.pfMode === 'light' ? 'light' : 'dark');
    const tVar = (n) => getComputedStyle(html).getPropertyValue(n).trim().toUpperCase();
    function hasLightMode() {
      const cur = html.dataset.pfMode;
      html.dataset.pfMode = 'light'; const a = tVar('--t-bg');
      html.dataset.pfMode = 'dark'; const b = tVar('--t-bg');
      if (cur) html.dataset.pfMode = cur; else delete html.dataset.pfMode;
      return /^#[0-9A-F]{6}$/.test(a) && a !== b;
    }
    function ModeButton() {
      const [mode, setModeState] = useState(getMode());
      const [ok] = useState(hasLightMode);
      useEffect(() => {
        const sys = matchMedia('(prefers-color-scheme: light)');
        const onSys = (e) => { let saved = null; try { saved = localStorage.getItem('pf-mode'); } catch {} if (!saved) apply(e.matches ? 'light' : 'dark', false); };
        sys.addEventListener?.('change', onSys);
        return () => sys.removeEventListener?.('change', onSys);
      }, []);
      function apply(m, save = true) {
        if (m === 'light') html.dataset.pfMode = 'light'; else delete html.dataset.pfMode;
        if (save) try { localStorage.setItem('pf-mode', m); } catch {}
        setModeState(m);
        window.dispatchEvent(new CustomEvent('pf-mode', { detail: m }));
      }
      if (!ok) return null;
      const label = mode === 'light' ? '어두운 화면으로' : '밝은 화면으로';
      return <button type="button" className="btn btn-icon no-print" aria-label={label} title={label} onClick={() => apply(mode === 'light' ? 'dark' : 'light')}>{mode === 'light' ? MOON : SUN}</button>;
    }

    // ── [PDF로 저장]: 아래쪽 그림까지 받은 뒤 인쇄(늦게 받는 그림은 PDF에서 빠짐) ──
    const eager = () => document.querySelectorAll('img[loading="lazy"]').forEach((i) => { i.loading = 'eager'; });
    const loaded = (i) => (i.complete ? null : new Promise((r) => { i.addEventListener('load', r, { once: true }); i.addEventListener('error', r, { once: true }); }));
    async function loadAll(ms) { eager(); await Promise.race([Promise.all([...document.images].map(loaded)), new Promise((r) => setTimeout(r, ms))]); }
    const showAll = () => document.querySelectorAll('.reveal').forEach((e) => e.classList.add('in'));
    addEventListener('beforeprint', () => { eager(); showAll(); });
    function PdfButton() {
      const [busy, setBusy] = useState(false);
      return <button type="button" className="btn btn-solid btn-sm no-print" disabled={busy}
        onClick={async () => { setBusy(true); showAll(); await loadAll(15000); setBusy(false); setTimeout(() => window.print(), 50); }}>{busy ? t('ui.preparing') : t('ui.pdf')}</button>;
    }

    // ── 스크롤하면 띠가 하나씩 떠오름 ──
    function bindReveal() {
      const els = document.querySelectorAll('.reveal');
      if (!('IntersectionObserver' in window) || matchMedia('print').matches) { showAll(); return; }
      const io = new IntersectionObserver((es) => es.forEach((e) => { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } }), { rootMargin: '0px 0px -8% 0px' });
      els.forEach((e) => io.observe(e));
    }

    // ── 머리 막대 늘어남 ──
    //   묶음(.pg)의 큰 제목(h2)이 머리 막대 뒤로 완전히 사라지고 묶음이 아직 남아 있으면 머리 막대에 .ext → 바탕이 늘어나고 그 묶음의 줄(.nh-bar.on)이 떠오름.
    //   기능 소개가 머리 막대 아래에 붙어 고정되기 시작하면(휴대폰은 기능 소개 위 끝이 막대에 닿으면) 제목 오른쪽에 " · 기능 소개"(.in-core)
    function bindHeads() {
      const head = document.querySelector('.site-head');
      if (!head) return;
      const bars = [...head.querySelectorAll('.nh-bar')];
      const groups = [...document.querySelectorAll('.pg[data-bar]')].map((g) => ({ g, i: +g.dataset.bar, h2: g.querySelector('.sec-head h2'), core: g.querySelector('.fe') || g.querySelector('.sec.core') }))
        .filter((x) => x.h2 && bars[x.i]);
      if (!groups.length) return;
      let cur = -1, curCore = false;
      const update = () => {
        if (matchMedia('print').matches) return;
        const topH = head.offsetHeight, extB = topH + (parseFloat(getComputedStyle(head).getPropertyValue("--ext-bg")) || 37);
        let act = -1, inCore = false;
        for (const x of groups) {
          if (x.h2.getBoundingClientRect().bottom <= topH && x.g.getBoundingClientRect().bottom > extB) {
            act = x.i;
            const ct = x.core ? x.core.getBoundingClientRect().top : Infinity;
            inCore = ct <= extB + 1;                                        // 기능 소개가 머리 막대 아래에 붙어 고정되기 시작할 때
            break;
          }
        }
        if (act !== cur) { bars.forEach((b, i) => b.classList.toggle('on', i === act)); head.classList.toggle('ext', act >= 0); cur = act; }
        if (inCore !== curCore) { head.classList.toggle('in-core', inCore); curCore = inCore; }
      };
      update();
      addEventListener('scroll', update, { passive: true });
      addEventListener('resize', update);
      document.fonts?.ready.then(update);
    }
    function SecHead({ en, title, right, big }) {
      return (
        <div className={'sec-head' + (big ? ' big' : '')}>

          {right && <p className="sec-r">{right}</p>}

    }

    // ── 주소로 절 바로 가기(예전 포트폴리오 덱 주소 #s=… 도 같은 절로) · 새로고침하면 읽던 위치로 ──
    const POS = `pf-portfolio-y:${location.pathname}`;
    try { history.scrollRestoration = 'manual'; } catch {}
    addEventListener('pagehide', () => { try { sessionStorage.setItem(POS, String(Math.round(scrollY))); } catch {} });
    function hashTarget(projects) {
      let h = location.hash.slice(1);
      try { h = decodeURIComponent(h); } catch {}
      if (!h) return '';
      const nth = (n) => info.sections[Math.max(1, Math.min(info.sections.length, n)) - 1] || '';
      if (/^-?\d+$/.test(h)) return nth(+h);
      const m = /^s=(.+)$/.exec(h);
      if (m) h = m[1].replace(/^(stack|glance)-\d+$/, '$1');
      const sn = /^s-(\d+)$/.exec(h);
      if (sn) return nth(+sn[1]);
      return { skills: 'stack', projects: projects[0] ? `p-${projects[0].id}` : '', summary: 'glance' }[h] ?? h;
    }
    function goHash(projects) {
      const want = hashTarget(projects), el = want && document.getElementById(want);
      if (!el) return '';

    // ① 머리 막대(layout: nav sticky) + 화면 모드 · PDF

    // ③ 자기소개(layout: stack · 가운데)
    function Intro({ prof }) {
      if (!prof.intro) return null;

    // ④ 기술 스택(3열 · 아이콘 + 기술 이름 + 근거 줄 · tinted) — 머리 막대 늘어남
    // ── 프로젝트 소개는 화면 모드와 상관없이 정해진 테마 색 ──
    //   기본은 어두운 테마. INTRO_THEME에 적은 프로젝트(폴더 이름)는 그 테마로. 그 모드의 색 값을 읽어 절에 고정(화면 모드를 바꿔도 이 절은 그대로).
    //   인쇄는 CSS가 흰 종이 색으로 덮음
    const INTRO_THEME = {};                                            // 예: { '1-SichuanSung': 'light' } — 그 프로젝트 소개만 밝은 테마로
    const INTRO_LIFT = ['1-SichuanSung'];                              // 공용 규칙 .text-lift(글자 띄우기)를 붙일 프로젝트 소개 — 대표 이미지가 밝아 글자가 묻히는 곳만
    function pinIntroDark() {
      const keys = ['--bg', '--band', '--card', '--line', '--ink', '--muted', '--sub', '--accent', '--accent-ink', '--divider', '--meta-label'];
      const read = (mode) => {
        const cur = html.dataset.pfMode;
        if (mode === 'light') html.dataset.pfMode = 'light'; else delete html.dataset.pfMode;
        const cs = getComputedStyle(html), v = keys.map((k) => [k, cs.getPropertyValue(k).trim()]);
        if (cur) html.dataset.pfMode = cur; else delete html.dataset.pfMode;
        return v;
      };
      const vals = { dark: read('dark'), light: read('light') };
      document.querySelectorAll('.sec.proj').forEach((sec) => {
        const mode = INTRO_THEME[sec.id.replace(/^p-/, '')] === 'light' ? 'light' : 'dark';
        vals[mode].forEach(([k, v]) => v && sec.style.setProperty(k, v));
        sec.style.colorScheme = mode; sec.style.color = 'var(--ink)';
        sec.dataset.introTheme = mode;
        sec.classList.toggle('text-lift', INTRO_LIFT.includes(sec.id.replace(/^p-/, '')));
      });
    }

    // ── 흐린 배경의 중심을 대표 이미지 카드 중심에 맞춤 ──
    //   카드 중심을 기준으로, 그 점에서 절의 가장 먼 끝보다 260px 더 덮을 만큼 그림을 키워 놓음(흐림 가장자리가 절 안에 보이지 않게) → 카드 둘레에 그 그림 가장자리 색이 번짐
    function bindBackdrop() {
      const items = [...document.querySelectorAll('.sec.proj')].map((sec) => ({ sec, bg: sec.querySelector('.proj-backdrop img'), card: sec.querySelector('.cover-fade .shot') })).filter((x) => x.bg && x.card);
      if (!items.length) return;
      const place = ({ sec, bg, card }) => {
        const sr = sec.getBoundingClientRect(), cr = card.getBoundingClientRect();
        if (!sr.width || !cr.width) return;
        const rv = card.closest('.reveal'), ty = rv ? new DOMMatrix(getComputedStyle(rv).transform).m42 : 0;   // 떠오르기 전 밀린 만큼 빼고
        const cx = cr.left + cr.width / 2 - sr.left, cy = cr.top - ty + cr.height / 2 - sr.top;
        const ar = (bg.naturalWidth && bg.naturalHeight) ? bg.naturalWidth / bg.naturalHeight : 4 / 3;
        let w = 2 * (Math.max(cx, sr.width - cx) + 260), h = 2 * (Math.max(cy, sr.height - cy) + 260);   // 흐림(80px)이 그림 끝에서 투명해지는 폭보다 넉넉히 → 절 끝까지 꽉 채움
        if (w / h < ar) w = h * ar; h = w / ar;
        Object.assign(bg.style, { left: `${cx}px`, top: `${cy}px`, width: `${w}px`, height: `${h}px` });
      };
      const all = () => items.forEach(place);
      all();
      items.forEach((x) => { x.bg.addEventListener('load', () => place(x), { once: true }); x.card.closest('.reveal')?.addEventListener('transitionend', () => place(x)); });
      let t = 0; addEventListener('resize', () => { clearTimeout(t); t = setTimeout(all, 120); });
      addEventListener('load', all); document.fonts?.ready.then(all); setTimeout(all, 900); setTimeout(all, 2500);
    }

    // ── 프로젝트 링크 캡슐 ──
    function LinkCapsule({ p }) {
      const L = p.links || {};
      return (
        <div className="cap no-print">
          <nav className="cap-pill noscroll" aria-label={`${p.title} 링크`}>
            <Ext className="btn btn-solid" href={deckHref(p)}>{t('name.deck')}</Ext>
            <Ext className="btn" href={docHref(p)}>{t('name.doc')}</Ext>
            {isUrl(L.github) && <Ext className="btn" href={L.github}>GitHub</Ext>}
            {isUrl(L.video) && <Ext className="btn" href={L.video}>{t('name.video')}</Ext>}
            {(L.extra || []).filter((l) => isUrl(l.url)).map((l) => <Ext key={l.url} className="btn" href={l.url}>{l.label}</Ext>)}
          </nav>
        </div>
      );
    }
    //   앞 프로젝트의 캡슐이 화면에서 사라지면 .on(떠오름), 위로 스크롤해 앞 캡슐이 다시 보이면 가라앉으며 사라짐(첫 프로젝트는 같은 지점으로 계산).
    //   캡슐이 제자리(기능 소개 아래)에 닿으면 .docked(그림자 없앰)
    function bindCaps() {
      const items = [...document.querySelectorAll('.pg')].map((g) => ({ g, cap: g.querySelector('.cap'), intro: g.querySelector('.sec.proj'), on: false })).filter((x) => x.cap);
      if (!items.length) return;
      const measure = () => items.forEach(({ cap }) => cap.style.setProperty('--cap-h', `${cap.offsetHeight}px`));   // 고정 기능 소개 끝에 맞출 캡슐 높이
      measure(); addEventListener('resize', measure);
      const update = () => {
        if (matchMedia('print').matches) return;
        items.forEach((x, j) => {
          const { g, cap, intro } = x;
          const r = g.getBoundingClientRect();
          // 앞 프로젝트의 캡슐이 화면 위로 완전히 사라지면 나타남. 첫 프로젝트(앞 캡슐 없음)는 같은 지점 = 소개 절 위 끝이 '캡슐 아래 여백'만큼 내려온 때
          const prev = items[j - 1]?.cap;
          const gate = prev ? prev.getBoundingClientRect().bottom <= 0 : (intro || g).getBoundingClientRect().top <= (parseFloat(getComputedStyle(cap).marginBottom) || 0);
          x.on = r.bottom > 0 && gate;
          cap.classList.toggle('on', x.on);
          const cb = cap.getBoundingClientRect().bottom, stuckB = innerHeight - (parseFloat(getComputedStyle(cap).bottom) || 0);
          cap.classList.toggle('docked', cb < stuckB - 1);
        });
      };
      update();
      addEventListener('scroll', update, { passive: true });
      addEventListener('resize', update);
    }
    // 기술 아이콘: 흰색 단색, 둥근 끝 선(페이지의 둥근 버튼·카드와 같은 결). 기술 이름의 낱말로 고르고, 맞는 것이 없으면 기본 모양.
    //   Unity는 공식 로고 모양 그대로(Simple Icons의 경로, 상표는 Unity Technologies 것 — 기술 표시용, 다른 아이콘에 굵기를 맞추지 않음). 나머지는 1.75 굵기 둥근 선, URP·Shader Graph는 머티리얼 미리보기 구체
    const SKILL_ICONS = [
      [/unity|유니티/i, <path d="m12.9288 4.2939 3.7997 2.1929c.1366.077.1415.2905 0 .3675l-4.515 2.6076a.4192.4192 0 0 1-.4246 0L7.274 6.8543c-.139-.0745-.1415-.293 0-.3675l3.7972-2.193V0L1.3758 5.5977V16.793l3.7177-2.1456v-4.3858c-.0025-.1565.1813-.2682.318-.1838l4.5148 2.6076a.4252.4252 0 0 1 .2136.3676v5.2127c.0025.1565-.1813.2682-.3179.1838l-3.7996-2.1929-3.7178 2.1457L12 24l9.6954-5.5977-3.7178-2.1457-3.7996 2.1929c-.1341.082-.3229-.0248-.3179-.1838V13.053c0-.1565.087-.2956.2136-.3676l4.5149-2.6076c.134-.082.3228.0224.3179.1838v4.3858l3.7177 2.1456V5.5977L12.9288 0Z" fill="currentColor" stroke="none" transform="translate(2.4 2.4) scale(.8)" />],
      [/c#|csharp|c\+\+|java|python|코드|code/i, <><path d="M7.8 7l-5 5 5 5M16.2 7l5 5-5 5" /><path d="M13.2 6l-2.4 12" /></>],
      [/데이터|data|scriptableobject|dto|db/i, <><ellipse cx="12" cy="6" rx="7.5" ry="2.8" /><path d="M4.5 6v12c0 1.55 3.36 2.8 7.5 2.8s7.5-1.25 7.5-2.8V6" /><path d="M4.5 12c0 1.55 3.36 2.8 7.5 2.8s7.5-1.25 7.5-2.8" /></>],
      [/패턴|pattern|설계|architecture/i, <><rect x="3.5" y="3.5" width="7" height="7" rx="1.5" /><rect x="13.5" y="3.5" width="7" height="7" rx="1.5" /><rect x="3.5" y="13.5" width="7" height="7" rx="1.5" /><path d="M17 13.5v7M13.5 17h7" /></>],
      [/멀티|network|서버|server|동기화|socket/i, <><path d="M4 8h16M16 4l4 4-4 4" /><path d="M20 16H4M8 12l-4 4 4 4" /></>],
      [/렌더|render|shader|urp|그래픽|graphic|material|머티리얼/i, <><circle cx="12" cy="12" r="8.5" /><path d="M8 11a4 4 0 0 1 3-3" /></>],
    ];
    function SkillIcon({ name }) {
      const hit = SKILL_ICONS.find(([re]) => re.test(name));
      return (
        <svg className="stk-icon" viewBox="0 0 24 24" width="40" height="40" fill="none" stroke="currentColor" strokeWidth="1.75" strokeLinecap="round" strokeLinejoin="round" shapeRendering="geometricPrecision" aria-hidden="true">
          {hit ? hit[1] : <><circle cx="12" cy="12" r="8.5" /><path d="M8.5 12.5l2.3 2.3 4.7-5" /></>}
        </svg>

    }
    function Stack({ skills, byId }) {
      if (!skills.length) return null;

        <div className="pg">
          <section id="stack" className="sec tinted py-24 md:py-32">

    }



    // 프로젝트 정보 표: 장르·기간·인원·환경 + 마지막 줄에 구현 범위(name.role — 문구 표의 "내 문구")
    function MetaTable({ p, className = '' }) {
      const rows = [...(p.meta || []).map((m) => [m.label, m.value]), p.team?.role && [t('name.role'), p.team.role]].filter(Boolean);

    function Features({ p, no }) {

    // ── 기능 제목+설명 높이 고정: 펼친 상태 제목 글꼴로 제목 줄 수를 재서, 설명 최소 높이 = 고정 영역(제목 1줄+설명 3줄, 2줄+2줄 중 큰 쪽) − 실제 제목 높이 ──
    function bindFeatureHeights() {
      const items = [...document.querySelectorAll('.fe-item')].map((it) => ({ title: it.querySelector('.fe-title'), what: it.querySelector('.fe-what') })).filter((x) => x.title && x.what);
      if (!items.length) return;
      const fit = () => items.forEach(({ title, what }) => {
        const wide = matchMedia('screen and (min-width: 760px)').matches;
        const fs = wide ? Math.min(24, Math.max(20, innerWidth * 0.02)) : Math.min(24, Math.max(20, innerWidth * 0.022));   // 펼친 상태 제목 크기(CSS clamp와 같게)
        const w = title.parentElement.getBoundingClientRect().width;
        const measure = (size) => {                                       // 그 글자 크기일 때 제목 높이·줄 높이
          const probe = title.cloneNode(true);
          Object.assign(probe.style, { position: 'absolute', visibility: 'hidden', left: '-9999px', top: '0', width: `${w}px`, fontSize: `${size}px`, height: 'auto', transition: 'none', display: 'block' });
          document.body.appendChild(probe);
          const r = { h: probe.getBoundingClientRect().height, lh: parseFloat(getComputedStyle(probe).lineHeight) || size * 1.35 }; probe.remove(); return r;
        };
        const on = measure(fs), tlh = on.lh, th = Math.ceil(on.h);    // 제목 칸 높이(--th-on)와 같은 올림 값으로 계산 → 항목마다 펼친 높이가 1px도 다르지 않게
        if (wide) { title.style.setProperty('--th-on', `${Math.ceil(on.h)}px`); title.style.setProperty('--th-off', `${Math.ceil(measure(17).h)}px`); }
        else { title.style.removeProperty('--th-on'); title.style.removeProperty('--th-off'); }
        const dlh = parseFloat(getComputedStyle(what).lineHeight) || 24.375;
        const area = Math.max(tlh + 3 * dlh, 2 * tlh + 2 * dlh);         // '제목 1줄+설명 3줄'과 '2줄+2줄' 중 큰 쪽 → 어느 경우든 같은 높이
        what.style.minHeight = `${Math.max(dlh, area - th)}px`;
      });
      // 목록 높이 고정: 기능을 하나씩 펼친 상태(애니메이션 없이)로 재서 가장 큰 높이를 목록 최소 높이로 → 펼침이 바뀌는 동안·여러 칸을 건너뛰어도 목록 전체 높이가 그대로
      const lists = [...document.querySelectorAll('.fe-list')];
      // 항목마다 접힘·펼침 높이를 재 두고(애니메이션 없이), 펼친 항목(k)에 따라 각 항목의 자리 = 앞 항목들 높이의 합
      const place = (list, k) => {
        const h = list._h; if (!h) return;
        let y = 0;
        [...list.children].forEach((it, i) => { it.style.setProperty('--top', `${Math.round(y)}px`); y += i === k ? h.open[i] : h.closed[i]; });   // 자리는 정수 px로(소수 px면 애니메이션이 끝나는 순간 글자가 픽셀 격자로 1px 스냅)
      };
      const reserve = () => {
        const wide = matchMedia('screen and (min-width: 760px)').matches;
        lists.forEach((list) => {
          list.classList.remove('fe-placed'); list.style.height = ''; list._h = null;
          [...list.children].forEach((it) => it.style.removeProperty('--top'));
          if (!wide) return;
          const its = [...list.querySelectorAll('.fe-item')], was = its.map((x) => x.classList.contains('on'));
          list.classList.add('fe-measure');
          const open = [], closed = [];
          its.forEach((it, i) => {
            its.forEach((x) => x.classList.toggle('on', x === it));
            open[i] = it.getBoundingClientRect().height;
            closed[(i + 1) % its.length] = its[(i + 1) % its.length].getBoundingClientRect().height;
          });
          its.forEach((x, i) => x.classList.toggle('on', was[i]));
          list._h = { open, closed };
          const max = Math.max(...its.map((_, k) => open[k] + closed.reduce((a, c, i) => a + (i === k ? 0 : c), 0)));
          list.style.height = `${Math.ceil(max)}px`;
          list.classList.add('fe-placed');
          place(list, Math.max(0, was.indexOf(true)));
          list.offsetHeight; list.classList.remove('fe-measure');
        });
      };
      window.__fePlace = place;                                          // bindFeatures가 항목을 바꿀 때 부름
      const both = () => { fit(); reserve(); };
      both();
      let t = 0; addEventListener('resize', () => { clearTimeout(t); t = setTimeout(both, 120); });
      document.fonts?.ready.then(both); setTimeout(both, 1200);
    }
    //   진척도: 기능 소개 트랙(.fe)이 머리 막대 아래에 닿은 뒤 스크롤한 거리 ÷ 기능 하나의 몫(트랙 높이 − 고정 높이) / 기능 수
    function bindFeatures() {
      const blocks = [...document.querySelectorAll('.fe')].map((fe) => ({ fe, pin: fe.querySelector('.fe-pin'), items: [...fe.querySelectorAll('.fe-item')], shots: [...fe.querySelectorAll('.fe-shot')], dots: [...fe.querySelectorAll('.fe-dot')], cur: 0 }));
      if (!blocks.length) return;
      const wide = () => matchMedia('screen and (min-width: 760px)').matches;
      const geo = (b) => {
        const top = b.fe.getBoundingClientRect().top + scrollY, pinTop = parseFloat(getComputedStyle(b.pin).top) || 0;
        const span = Math.max(1, b.fe.offsetHeight - b.pin.offsetHeight);
        return { start: top - pinTop, step: span / b.items.length };
      };
      const set = (b, k) => {
        if (k === b.cur) return;
        // 여러 칸을 빠르게 건너뛸 때: 마지막으로 다 펼쳐져 있던 항목(stable)만 접히는 애니메이션, 그 사이 잠깐 펼쳐지던 항목은 즉시 접음
        //   → 접히는 높이와 펼쳐지는 높이가 늘 한 쌍이라 목록에 빈 공간이 생기지 않음
        const now = performance.now();
        if (now - (b.lastSwitch || 0) > 550) b.stable = b.cur;
        b.lastSwitch = now;
        b.cur = k;
        b.items.forEach((it, i) => {
          if (i !== k && i !== b.stable && it.classList.contains('on')) { it.classList.add('fe-snap'); it.classList.remove('on'); it.offsetHeight; setTimeout(() => it.classList.remove('fe-snap'), 30); }
          else it.classList.toggle('on', i === k);
        });
        b.shots.forEach((s) => {
          const d = +s.dataset.fe - k;
          s.style.setProperty('--d', String(d));
          s.classList.toggle('on', d === 0);
          s.classList.toggle('near', Math.abs(d) === 1);
        });
        b.dots.forEach((d, i) => d.classList.toggle('on', i === k));
        const list = b.fe.querySelector('.fe-list'); if (list && window.__fePlace) window.__fePlace(list, k);
      };
      // 건너뛰는 중간 항목은 아예 열지 않음: 스크롤 위치가 가리키는 항목이 0.18초 그대로일 때만 바꿈(빠르게 지나간 항목은 열리지 않음).
      //   점·흐린 항목을 눌러 이동할 때는 바로 목표 항목을 열고, 스크롤이 그 항목에 닿을 때까지 지나가는 항목은 무시
      const WAIT = 180;
      const update = () => {
        if (matchMedia('print').matches || !wide()) return;
        const now = performance.now();
        blocks.forEach((b) => {
          const { start, step } = geo(b);
          const n = b.items.length, pr = (scrollY - start) / step;           // 진척도(기능 단위). 정수 부분 = 가리키는 기능, 나머지 = 그 기능 안에서 채운 정도
          const k = Math.max(0, Math.min(n - 1, Math.floor(pr)));
          if (b.lock && now < b.lock.until && k !== b.lock.k) { /* 눌러서 이동 중 — 지나가는 항목 무시 */ }
          else {
            b.lock = null;
            if (k === b.cur) b.pending = null;
            else if (b.pending !== k) { b.pending = k; b.pendingAt = now; clearTimeout(b.timer); b.timer = setTimeout(update, WAIT + 10); }
            else if (now - b.pendingAt >= WAIT) { set(b, k); b.pending = null; }
            else { clearTimeout(b.timer); b.timer = setTimeout(update, WAIT - (now - b.pendingAt) + 10); }
          }
          b.dots[b.cur]?.style.setProperty('--fill', String(Math.max(0, Math.min(1, pr - b.cur))));
        });
      };
      blocks.forEach((b) => b.fe.addEventListener('click', (e) => {
        const go = e.target.closest('[data-fe-go]');
        if (!go || !wide()) return;
        const k = +go.dataset.feGo, { start, step } = geo(b);
        b.lock = { k, until: performance.now() + 1500 }; b.pending = null;
        set(b, k);
        scrollTo({ top: Math.ceil(start + step * k) + 1, behavior: 'smooth' });   // 그 항목 스크롤 구간의 맨 위(1px 안쪽)로
      }));
      update();
      addEventListener('scroll', update, { passive: true });
      addEventListener('resize', update);
    }

    // ⑦ 기타 프로젝트(layout.json에 없는 절 — 디자인 요청대로, 소개 카드 하나)

    // ⑨ 연락처(layout: columns 3단 42:23:35 · tinted)
    function Contact({ prof, all, updated }) {

              <p className="eyebrow">{t('en.contact')}</p>

                  const ls = [isUrl(p.links?.github) && ['GitHub', p.links.github], isUrl(p.links?.video) && [t('name.video'), p.links.video],

          </div>
        </footer>
      );
    }

    function App() {
      const [state, setState] = useState({ status: 'loading' });
      useEffect(() => {
        (async () => {
          if (location.protocol === 'file:') { info.errors.push('file:// — 로컬 서버로 열어야 합니다'); setState({ status: 'file' }); return; }
          try {
            try { const r = await fetch('../theme/strings.tsv', { cache: 'no-cache' }); if (r.ok) STR = { ...FALLBACK, ...parseStrings(await r.text()) }; } catch { /* 기본 문구 */ }
            const res = await fetch('../data/portfolio.json', { cache: 'no-cache' });
            if (!res.ok) throw new Error(`data/portfolio.json: ${res.status}`);
            const pf = await res.json();
            const load = (id) => fetch(`../data/projects/${encodeURIComponent(id)}.json`, { cache: 'no-cache' }).then((r) => r.ok ? r.json() : null).catch(() => null);
            const [projects, others] = await Promise.all([Promise.all((pf.projects || []).map(load)), Promise.all((pf.others || []).map(load))]).then((a) => a.map((x) => x.filter(Boolean)));
            if (/^#[0-9a-fA-F]{6}$/.test(pf.settings?.accent || '')) html.style.setProperty('--accent-profile', pf.settings.accent);
            const name = pf.profile?.name;
            document.title = `${name ? name + ' · ' : ''}${t('name.portfolio')}`;
            document.querySelector('.skip-link').textContent = t('ui.skip');
            setState({ status: 'ok', pf, projects, others });
          } catch (e) {
            info.errors.push(String(e && e.message || e));
            setState({ status: 'error', msg: String(e && e.message || e) });
          }
        })();
      }, []);

      // 그린 뒤: 떠오름 · 머리 막대 늘어남 · 주소의 절로 이동(또는 새로고침 전 위치) · 그림 준비 → ready
      useEffect(() => {
        if (state.status !== 'ok') { if (state.status !== 'loading') { html.dataset.pfReady = 'yes'; resolveReady(report()); } return; }
        info.sections = [...document.querySelectorAll('main section[id], footer[id]')].map((s) => s.id);
        info.projects = state.projects.length; info.others = state.others.length;
        bindReveal();
        bindHeads();
        bindCaps();
        bindFeatures();
        bindFeatureHeights();
        pinIntroDark();
        bindBackdrop();
        let userMoved = false;
        ['wheel', 'touchstart', 'keydown', 'pointerdown'].forEach((ev) => addEventListener(ev, () => { userMoved = true; }, { once: true, passive: true }));
        let arrived = goHash(state.projects), restoreY = null;
        if (!arrived && performance.getEntriesByType?.('navigation')[0]?.type === 'reload') {
          try { restoreY = +sessionStorage.getItem(POS) || null; } catch {}
          if (restoreY) scrollTo({ top: restoreY, behavior: 'instant' });
        }
        const onHash = () => goHash(state.projects);
        addEventListener('hashchange', onHash);
        (async () => {
          const desk = matchMedia('(pointer: fine)').matches && !(navigator.connection && navigator.connection.saveData);
          if (desk) eager();                                             // 데스크톱이면 그림을 미리 받아 Ctrl+P도 빠짐없이
          await Promise.race([Promise.all([...document.querySelectorAll('img:not([loading="lazy"])')].map(loaded)), new Promise((r) => setTimeout(r, 20000))]);
          if (document.fonts) await Promise.race([document.fonts.ready, new Promise((r) => setTimeout(r, 3000))]);
          if (!userMoved) {                                              // 글꼴·그림이 늦게 와 밀린 만큼 다시 맞춤
            const el = arrived && document.getElementById(arrived);
            if (el) el.scrollIntoView({ behavior: 'instant', block: 'start' });
            else if (restoreY) scrollTo({ top: restoreY, behavior: 'instant' });
          }
          html.dataset.pfReady = 'yes';
          resolveReady(report());
        })();
        return () => removeEventListener('hashchange', onHash);
      }, [state.status]);

      if (state.status === 'loading') return <p className="msg">불러오는 중…</p>;
      if (state.status === 'file') return <div className="msg"><p>이 페이지는 data/를 불러와 그리기 때문에 파일을 더블클릭해서는 열리지 않습니다. 레포 폴더에서 아래 명령을 실행한 뒤 http://localhost:4600/custom/ 으로 여세요.</p><pre>python3 -m http.server 4600</pre></div>;
      if (state.status === 'error') return <div className="msg"><p>아직 포트폴리오 데이터가 없거나 읽지 못했습니다. Claude Code에서 아래 명령을 실행하세요.</p><pre>/portfolio-build</pre><p>{state.msg}</p></div>;
      const { pf, projects, others } = state;
      const prof = pf.profile || {};
      const all = [...projects, ...others];
      const byId = Object.fromEntries(all.map((p) => [p.id, p]));
      const total = pad2(projects.length);
      const bars = [...projects.map((p, j) => ({ eyebrow: t('page.project-no', { no: pad2(j + 1), total }), title: p.title, sub: (p.highlights || []).length ? t('page.features') : '' }))];
      return (
        <>
          <Nav prof={prof} projects={projects} others={others} hasSkills={(pf.skills || []).length > 0} bars={bars} />
          <main id="main">
            <Cover pf={pf} prof={prof} />
            <Intro prof={prof} />
            <Stack skills={pf.skills || []} byId={byId} />
            {projects.map((p, j) => {
              const no = t('page.project-no', { no: pad2(j + 1), total });
              const hasFe = (p.highlights || []).length > 0;
              return (
                <div key={p.id} className="pg" data-bar={j}>
                  <ProjectIntro p={p} no={no} />
                  <Features p={p} no={no} />
                  <LinkCapsule p={p} />
                </div>
              );
            })}
            <Others others={others} />
            <Glance projects={projects} />
          </main>
          <Contact prof={prof} all={all} updated={pf.generatedAt} />
        </>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
