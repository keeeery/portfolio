<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">   <!-- 브라우저 막대 색(안드로이드 크롬·예전 iOS). 화면 모드를 바꾸면 syncBarColor()가 바탕색으로 맞춤 -->
  <title>포트폴리오</title>
  <link rel="icon" href="images/favicon.svg" type="image/svg+xml" />
  <script>/* 탭 아이콘: 브라우저 화면 모드(밝게·어둡게)가 바뀌면 그 자리에서 아이콘 파일을 갈아 끼움. 브라우저는 한 번 그린 탭 아이콘을 다시 그리지 않아 SVG 안의 규칙만으로는 바뀌지 않음 */(function(){var l=document.querySelector('link[rel="icon"]');if(!l||!window.matchMedia)return;var base=l.getAttribute('href').replace(/favicon\.svg$/,''),m=matchMedia('(prefers-color-scheme: dark)');function u(){l.href=base+'favicon-'+(m.matches?'dark':'light')+'.svg';}u();if(m.addEventListener)m.addEventListener('change',u);else if(m.addListener)m.addListener(u);})();</script>
  <!-- 포트폴리오 페이지(기본 페이지) — /portfolio-custom 직접 생성 모드로 만든 새 레이아웃을 기본 주소로 옮긴 것. 예전 고정 렌더러 배치는 classic.html.
       다크 톤, 색은 theme/theme.css · theme-light.css. 배치: theme/layout.json(배치 레퍼런스). 내용은 data/*.json을 실행 중에 읽어 그립니다(내용을 이 파일에 복사하지 않음).
       기능: 탭 제목 · 밝은/어두운 화면 버튼 · [PDF로 저장](A4) · 머리 막대 늘어남(프로젝트명 떠오름) · 기능별 슬라이드 장면 링크 · 링크 표시(외부만 새 탭) ·
       주소로 절 바로 가기(#p-<폴더> 등) · 새로고침해도 읽던 위치 · 점검 PFPage.whenReady() → PFPage.report() · ?pf-audit=1이면 #pf-audit에 report()의 base64 JSON
       주의: /portfolio-update는 템플릿의 index.html로 이 파일을 덮어씁니다(업데이트 전에 백업하거나 업데이트 뒤 git으로 되돌리기) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/d2coding@1.3.2/d2coding-subset.css">
  <script src="https://cdn.tailwindcss.com/3.4.5"></script>
  <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>
  <script src="assets/page-scrollbar.js"></script><!-- 직접 추가: 페이지 스크롤 막대를 내용 위에 겹쳐 그림(오른쪽 빈 띠 없이) -->
  <script src="assets/page-anchor.js"></script><!-- 직접 추가: 같은 페이지 안 이동은 주소를 바꾸지 않고, 새로고침하면 보던 위치 그대로 -->
  <script src="assets/strings.js"></script><!-- 문구 표 점검(report().strings)용. 화면 문구는 아래 FALLBACK + theme/strings.tsv -->
  <link rel="stylesheet" href="theme/theme.css">
  <link rel="stylesheet" href="theme/theme-light.css">
  <script>
    // 그리기 전에 화면 모드를 정함: 포트폴리오 페이지에서 고른 값(localStorage 'pf-mode') → 없으면 기기 설정
    try { var m = localStorage.getItem('pf-mode'); if (m ? m === 'light' : matchMedia('(prefers-color-scheme: light)').matches) document.documentElement.dataset.pfMode = 'light'; } catch (e) {}
  </script>
  <style>
    @media screen { html { scrollbar-color: color-mix(in srgb, var(--ink) 25%, transparent) transparent; } }   /* 직접 수정: 페이지 스크롤 막대 — 바탕(홈)은 투명, 막대는 연한 색으로 늘 보임 · 굵기는 브라우저 기본(상세 문서와 같음) */
    /* 색은 포트폴리오 페이지와 같은 테마(--t-*)를 그대로. 테마가 없으면 괄호 안 기본값 */
    :root {
      --top-h: calc(56px + var(--safe-t)); --safe-t: env(safe-area-inset-top, 0px); --safe-b: env(safe-area-inset-bottom, 0px); --ext-h: 40px; --ext-up: 8px; --ext-bg: 37px;                                                     /* 머리 막대 높이 */
      --bg: var(--t-bg, #0A0A0D);                                        /* 바탕 */
      --band: color-mix(in srgb, var(--ink) 4%, var(--bg));              /* 배경색이 다른 띠(layout.json background: tinted) */
      --card: var(--t-surface, #131318);                                 /* 띠 위 카드 */
      --line: var(--t-line, rgba(255,255,255,.09));
      --ink: var(--t-ink, #F5F5F7);                                      /* 제목 글 */
      --muted: color-mix(in srgb, var(--t-body, #C7C7CC) 85%, var(--ink)); /* 본문 글: 테마 본문색을 제목 글 쪽으로 15% — 어두운 테마에선 조금 밝게, 밝은 테마에선 조금 진하게 */
      --sub: var(--t-muted, #86868B);                                    /* 작은 보조 글 */
      --accent: var(--t-accent, var(--accent-profile, #2F6FEB));         /* 테마 강조색 → 없으면 profile.md 강조색 */
      --accent-ink: var(--accent);                                       /* 글자에 쓰는 강조색 = 버튼 강조색과 같은 값(섞지 않음) */
      --divider: color-mix(in srgb, var(--ink) 70%, var(--bg));        /* 구분선(정보 표 줄 · 설명용 칩 외곽선): 밝은 회색(밝은 테마에선 짙은 회색) */
      --meta-label: var(--ink);                                         /* 정보 표 항목명(장르·기간…): 외곽선 버튼 글자색과 같게 */
      color-scheme: var(--t-scheme, dark);
    }
    html { background: var(--bg); scroll-behavior: smooth; scroll-padding-top: var(--top-h); }   /* 절로 이동하면 절 위 끝이 머리 막대 아래 끝에 딱 붙게(틈 없이) */
    body { margin: 0; background: var(--bg); color: var(--ink); font-family: Pretendard, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      -webkit-font-smoothing: antialiased; word-break: keep-all; overflow-wrap: anywhere; }   /* 바탕색은 애니메이션 없이 바로 바뀜 — 아이폰 Safari가 바뀌는 중간 색으로 위·아래 칸을 칠하지 않게 */
    .wrap { max-width: 1040px; margin: 0 auto; padding: 0 20px; }
    @media (min-width: 760px) { .wrap { padding: 0 32px; } }
    .tinted { background: var(--band); }
    .eyebrow { font-family: var(--t-display, inherit), Pretendard, sans-serif; font-size: 12px; font-weight: 700; letter-spacing: .14em; color: var(--accent-ink); text-transform: uppercase; margin: 0; }
    .accent { color: var(--accent-ink); }
    .btn { display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 0 18px; border-radius: var(--t-pill, 999px); font-size: 14px; font-weight: 600;
      border: 1px solid var(--line); color: var(--ink); background: transparent; cursor: pointer; transition: background .15s, border-color .15s, box-shadow .15s; white-space: nowrap; }
    /* 마우스 올림: 자기소개서·프로젝트 문서 페이지(doc.css)의 버튼과 같게 — 테두리는 옅은 강조색, 바탕은 강조색을 아주 옅게 / 주 버튼은 바깥에 강조색 고리 */
    .btn:hover { border-color: color-mix(in srgb, var(--accent) 45%, var(--bg)); background: color-mix(in srgb, var(--accent) 16%, var(--bg)); }
    .btn:disabled { opacity: .6; cursor: progress; }
    .btn-solid { background: var(--accent); border-color: var(--accent); color: #fff; }
    .btn-solid:hover { background: var(--accent); border-color: var(--accent); box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 28%, transparent); }
    .btn-sm { min-height: 34px; padding: 0 14px; font-size: 13px; }
    /* [PDF로 저장]: 모든 화면에서 다운로드 아이콘(글자는 화면 낭독기·title로). 누르면 바로 아래에 작은 창 — [새 탭에서 열기] · [파일로 받기] */
    .pdf-wrap { position: relative; }
    .pdf-btn { width: 34px; padding: 0; justify-content: center; }
    .pdf-ico { display: block; }
    .pdf-btn .pdf-txt { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
    .pdf-btn:disabled .pdf-ico { animation: pdf-wait 1s ease-in-out infinite alternate; }   /* 준비 중(미리 만든 PDF가 없어 인쇄할 때): 아이콘이 천천히 깜빡임 */
    @keyframes pdf-wait { to { opacity: .35; } }
    /* 선택 창(다운로드 버튼 자리에서 왼쪽으로) = 캡슐 바와 같은 모양(공용 규칙 .cap-pill): 반투명 카드색, 외곽선 1px, 완전히 둥근 모서리, [파일로 받기]만 강조색, 나머지는 바탕 없는 글자 버튼. 글자 → 아이콘 순(다른 링크 버튼의 ↗와 같은 자리).
       머리 막대(흐림) 안에 두면 뒤를 흐리지 못하므로(흐림 안의 흐림) 페이지 맨 바깥(body)에 띄우고, [파일로 받기]가 다운로드 버튼과 같은 자리에 오게 놓음(--pm-top·--pm-right).
       열릴 때는 그 자리에서 왼쪽으로 끊김 없이 펼쳐짐(.38초) — 순서대로: ① 다운로드 버튼과 같은 파란 동그라미(.pm-morph, 다운로드 아이콘 포함)가 그 자리에서 왼쪽으로 [파일로 받기] 폭만큼 늘어나 버튼이 되고(바탕은 [파일로 받기]를 사방 8px씩 감싸는 크기까지만), ② 다 늘어나면 멈추지 않고 이어서 바탕이 왼쪽으로 더 펼쳐지며 [새 탭에서 열기]가 드러남.
       아이콘(화살표 + 아래 선)은 움직이지 않음 — [파일로 받기]의 아이콘을 다운로드 버튼 아이콘과 같은 자리(버튼 오른쪽 끝에서 8px, 세로 가운데) · 크기(18px) · 굵기로 고정. 반투명 + 흐림 바탕(.pm-full)은 버튼을 감싼 동그라미에서 왼쪽으로 펼쳐지고
       (잘라 보이기 — 흐림 요소 하나라 이음매 없음, 왼쪽 끝 외곽선은 .pm-ring이 따라감), [새 탭에서 열기] 글자는 펼쳐지는 끝에서 그라데이션으로 나타나 창 밖으로 나가지 않음.
       닫힐 때(.out)는 거꾸로(.32초) — [새 탭에서 열기]가 먼저 접히고, [파일로 받기]가 다운로드 버튼으로 줄어든 뒤, 버튼을 감싸고 남은 반투명 원(외곽선 포함)이 서서히 사라짐.
       창 폭(--mw) · 높이(--mh) · [파일로 받기] 폭(--mb) · 다운로드 버튼과의 차이(--mx · --my)는 스크립트가 창을 그리기 전에 잼 */
    .pdf-menu { position: fixed; top: var(--pm-top, 3px); right: var(--pm-right, 16px); z-index: 70; display: flex; padding: 6px 7px 6px 6px; border: 1px solid transparent; border-radius: 999px; }   /* 오른쪽만 1px 더 — 창 높이(50px)의 둥근 끝이 다운로드 버튼(34px)을 사방 8px씩 고르게 감싸게 */
    .pdf-menu.out { pointer-events: none; }
    .pm-shade, .pm-full { position: absolute; inset: -1px; border-radius: 999px; pointer-events: none; }
    .pm-shade { box-shadow: 0 12px 40px rgba(0,0,0,.35); }
    .pm-full { box-sizing: border-box; border: 1px solid var(--line); background: color-mix(in srgb, var(--card) 72%, transparent);
               -webkit-backdrop-filter: blur(24px) saturate(1.6); backdrop-filter: blur(24px) saturate(1.6); }
    /* 펼침은 '바탕이 펼쳐진 폭' 하나(--pm-v, 창 오른쪽 끝 기준)가 끊김 없는 곡선 하나로 움직이고, 나머지는 모두 그것을 따라감 → 중간에 멈칫하지 않음:
       바탕(잘라 보이기) = 오른쪽에서 --pm-v만큼 · 왼쪽 끝 외곽선 = 그 끝 · 버튼 줄 가림 = 그 끝 안쪽 ·
       [파일로 받기](.pm-morph) 폭 = --pm-v − 16px(바탕 끝에서 8px 안쪽을 따라감)이되 제 폭(--mb)에 닿으면 멈춤 → 바탕은 그대로 이어서 [새 탭에서 열기]까지.
       움직이지 않을 때 --pm-v는 아주 멀리(9999px) — 잘림 · 가림 없음 */
    @property --pm-v { syntax: '<length>'; inherits: true; initial-value: 9999px; }
    @property --pm-in { syntax: '<length>'; inherits: false; initial-value: 0px; }
    .pm-full { clip-path: inset(0 0 0 max(0px, calc(100% - var(--pm-v))) round 999px); }
    .pm-ring { position: absolute; top: -1px; bottom: -1px; left: -1px; width: calc(var(--mh, 50px) / 2); box-sizing: border-box; border: 1px solid var(--line); border-right: 0;
               border-radius: 999px 0 0 999px; opacity: 0; pointer-events: none; translate: max(0px, calc(var(--mw, 260px) - var(--pm-v))) 0; }   /* 펼쳐지는 왼쪽 끝 외곽선(움직이는 동안만) */
    .pm-morph { position: absolute; right: 7px; top: 6px; height: 36px; width: min(var(--mb, 110px), calc(var(--pm-v) - 16px)); box-sizing: border-box; border-radius: 999px; background: var(--accent); color: #fff;
                opacity: 0; pointer-events: none; }                       /* [파일로 받기] 자리(오른쪽 끝 맞춤 — 늘어나면 왼쪽으로) */
    .pm-morph svg { position: absolute; right: 8px; top: calc(50% - 9px); }   /* 다운로드 버튼(34px) 안의 아이콘(18px)과 같은 자리(버튼 높이 34 → 36px을 따라 세로 가운데) */
    .pm-row { position: relative; display: flex; gap: 6px;                /* 8px = 창 오른쪽 끝 → 버튼 줄 오른쪽 끝(외곽선 1px + 안쪽 여백 7px). 끝(둥근 끝 안쪽 --pm-in)을 넘는 글자는 안 보이고 그 앞 30px은 흐려짐 */
              -webkit-mask-image: linear-gradient(to left, #000 calc(var(--pm-v) - 8px - var(--pm-in) - 30px), transparent calc(var(--pm-v) - 8px - var(--pm-in)));
                      mask-image: linear-gradient(to left, #000 calc(var(--pm-v) - 8px - var(--pm-in) - 30px), transparent calc(var(--pm-v) - 8px - var(--pm-in))); }
    .pdf-menu:not(.out) { animation: pm-v-in .38s both; }
    .pdf-menu:not(.out) .pm-morph { animation: pm-morph-in .38s both; }
    .pdf-menu:not(.out) .pm-full { animation: pm-full-in .38s both; }
    .pdf-menu:not(.out) .pm-ring { animation: pm-ring-in .38s both; }
    .pdf-menu:not(.out) .pm-shade { animation: pm-shade-in .38s both; }
    .pdf-menu:not(.out) .pm-row { animation: pm-row-in .38s both, pm-in-in .38s both; }
    .pdf-menu.out { animation: pm-v-out .32s both; }
    .pdf-menu.out .pm-morph { animation: pm-morph-out .32s both; }
    .pdf-menu.out .pm-full { animation: pm-full-out .32s both; }
    .pdf-menu.out .pm-ring { animation: pm-ring-out .32s both; }
    .pdf-menu.out .pm-shade { animation: pm-shade-out .32s both; }
    .pdf-menu.out .pm-row { animation: pm-row-out .32s both, pm-in-out .32s both; }
    /* 열림(.38초): 0.03~0.35초 한 곡선으로 펼침(프로젝트 캡슐이 펼쳐질 때와 같은 곡선 — 처음에 빠르게 튀어나가 길게 감속) — [파일로 받기]가 먼저 다 늘어나고 바탕이 이어서 [새 탭에서 열기]까지 */
    @keyframes pm-v-in { 0%, 8% { --pm-v: var(--mh, 50px); animation-timing-function: cubic-bezier(.25,.9,.3,1); } 92%, 100% { --pm-v: var(--mw, 260px); } }
    @keyframes pm-morph-in { 0% { opacity: 1; translate: var(--mx, 0px) var(--my, 1px); height: 34px; animation-timing-function: cubic-bezier(.3,.9,.3,1); } 20%, 100% { opacity: 1; translate: 0 0; height: 36px; } }
    @keyframes pm-full-in { 0% { opacity: 0; } 8%, 100% { opacity: 1; } }
    @keyframes pm-ring-in { 0% { opacity: 0; } 8%, 86% { opacity: 1; } 94%, 100% { opacity: 0; } }
    @keyframes pm-shade-in { 0%, 55% { opacity: 0; } 100% { opacity: 1; } }
    @keyframes pm-row-in { 0%, 22% { opacity: 0; animation-timing-function: ease-out; } 48%, 100% { opacity: 1; } }   /* 글자 가림이 바탕 끝을 따라가므로 [새 탭에서 열기]는 바탕이 닿을 때 드러남 */
    @keyframes pm-in-in { 0%, 86% { --pm-in: 10px; } 100% { --pm-in: -40px; } }   /* 다 펼쳐질 무렵 가림을 버튼 줄 끝 너머로 */
    /* 닫힘(.32초): 0.02~0.21초 한 곡선으로 접힘(프로젝트 캡슐이 접힐 때와 같은 곡선) — [새 탭에서 열기]가 먼저 접히고 이어서 [파일로 받기]가 다운로드 버튼 크기로 → 0.21~0.32초 버튼을 감싼 반투명 원(외곽선 포함)이 서서히 사라짐 */
    @keyframes pm-v-out { 0%, 6% { --pm-v: var(--mw, 260px); animation-timing-function: cubic-bezier(.5,0,.3,1); } 66%, 100% { --pm-v: var(--mh, 50px); } }
    @keyframes pm-morph-out { 0%, 56% { opacity: 1; translate: 0 0; height: 36px; animation-timing-function: ease-in-out; } 68%, 100% { opacity: 1; translate: var(--mx, 0px) var(--my, 1px); height: 34px; } }
    @keyframes pm-full-out { 0%, 66% { opacity: 1; animation-timing-function: ease-out; } 100% { opacity: 0; } }
    @keyframes pm-ring-out { 0% { opacity: 0; } 6%, 66% { opacity: 1; animation-timing-function: ease-out; } 100% { opacity: 0; } }
    @keyframes pm-shade-out { 0% { opacity: 1; } 30%, 100% { opacity: 0; } }
    @keyframes pm-row-out { 0%, 26% { opacity: 1; } 42%, 100% { opacity: 0; } }   /* [새 탭에서 열기]는 가림으로 먼저 사라지고, [파일로 받기] 글자는 버튼이 줄어들기 직전에 */
    @keyframes pm-in-out { 0% { --pm-in: -40px; } 6%, 100% { --pm-in: 10px; } }
    .pdf-menu .btn { min-height: 36px; padding: 0 16px; font-size: 13px; }
    .pdf-menu .btn-solid { padding-right: 7px; }                         /* [파일로 받기]: 아이콘(18px)이 다운로드 버튼 아이콘과 같은 자리 — 버튼 오른쪽 끝에서 8px(외곽선 1px + 7px) */
    .pdf-menu .btn-solid .pm-save { display: block; margin-left: 2px; }   /* 글과 아이콘 사이는 다른 버튼과 같게(.btn 간격 + .nt-icon 여백) */
    .pdf-menu .btn:not(.btn-solid) { border-color: transparent; background: transparent; }
    /* 마우스 올림은 캡슐 바(.cap-pill)와 같게(예전 그대로): 글자 버튼은 테두리 없이 옅은 회색 바탕, [파일로 받기]는 고리 없이 살짝 밝게 */
    .pdf-menu .btn:not(.btn-solid):hover, .pdf-menu .btn:not(.btn-solid):focus-visible { background: color-mix(in srgb, var(--ink) 8%, transparent); }
    .pdf-menu .btn-solid:hover { box-shadow: none; filter: brightness(1.1); }
    .pdf-menu svg { flex-shrink: 0; }
    @media (prefers-reduced-motion: reduce) { .pdf-menu, .pdf-menu *, .pdf-btn { animation: none !important; transition: none; } }
    .btn-icon { width: 34px; min-height: 34px; padding: 0; justify-content: center; }
    .chip { display: inline-block; font-size: 12px; font-weight: 600; padding: 4px 11px; border-radius: var(--t-pill, 999px); border: 0; color: var(--ink); background: color-mix(in srgb, var(--ink) 10%, transparent); white-space: nowrap; -webkit-print-color-adjust: exact; print-color-adjust: exact; }   /* 설명용 칩(프로젝트 태그): 테두리 없이 옅은 바탕(글자색 10%) · 슬라이드 태그와 같은 모양 */
    a.chip:hover { color: var(--ink); border-color: var(--accent); }
    code { font-family: "D2Coding", ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .9em; padding: 1px 5px; border-radius: 5px; background: color-mix(in srgb, var(--ink) 9%, transparent); }
    strong { color: var(--ink); font-weight: 700; }
    a:focus-visible, .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
    .nt-icon { display: inline-block; vertical-align: -1px; margin-left: 3px; opacity: .8; }
    /* 이메일 주소 복사 버튼: 글자 링크의 ↗ 아이콘과 같은 자리(글자 바로 오른쪽)에 작은 아이콘. 누를 자리는 넓게(안쪽 여백 + 같은 만큼 바깥 여백을 빼서 아이콘 위치는 그대로) */
    .copy-btn { display: inline-flex; align-items: center; vertical-align: middle; padding: 8px; margin: -8px -8px -8px -4px; border: 0; background: none;
                color: inherit; opacity: .8; cursor: pointer; border-radius: 8px; transition: opacity .2s ease, color .2s ease; }
    .copy-btn:hover { opacity: 1; color: var(--ink); }
    .copy-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
    .copy-btn.done { color: var(--accent); opacity: 1; }
    /* 공용 규칙 — 글자 링크(.tlink): 글자 링크는 모두 본문색(강조색은 버튼형 주 버튼 하나에만 — 캡슐 바 첫 버튼 [시연 영상]), 글자 아래 4px 띄운 1px 옅은 밑줄(글자색 35%)로 누를 수 있음을 표시.
       마우스를 올리면 밑줄이 글자색 그대로 진해지고, 본문색 링크는 글자도 제목 글 색으로. 인쇄(PDF)에서도 밑줄·링크 화살표(↗)는 화면과 같게 */
    .tlink { text-decoration-line: underline; text-decoration-thickness: 1px; text-underline-offset: 4px;
             text-decoration-color: color-mix(in srgb, currentColor 35%, transparent); transition: color .2s ease, text-decoration-color .2s ease; }
    .tlink:hover { text-decoration-color: currentColor; }
    .tlink:not(.accent):hover { color: var(--ink); }
    .sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
    .skip-link { position: absolute; left: 12px; top: -48px; z-index: 100; padding: 8px 14px; border-radius: 8px; background: var(--accent); color: #fff; }
    .skip-link:focus { top: 12px; }
    .noscroll { scrollbar-width: none; } .noscroll::-webkit-scrollbar { display: none; }
    .print-only { display: none; }
    /* 공용 규칙 — 글자 띄우기(.text-lift): 사진·흐린 그림처럼 색이 고르지 않은 바탕 위에서 글자가 잘 안 보일 때만 골라서 붙임.
       안쪽 모든 글자에 그 영역 바탕색 쪽의 아주 옅은 그림자(어두운 테마=어두운 그림자, 밝은 테마=밝은 그림자). 기본으로는 어디에도 붙지 않음 */
    .text-lift, .text-lift * { text-shadow: 0 1px 12px color-mix(in srgb, var(--bg) 28%, transparent), 0 0 4px color-mix(in srgb, var(--bg) 10%, transparent); }
    /* 공용 규칙 — 그림 링크(.img-link + 안의 .img-more): 그림 자체가 다른 곳으로 가는 링크면, 마우스를 올리거나 키보드로 갔을 때
       그림 위에 검은 반투명 판(55%) + [자세히 보기 + 아이콘]. 아이콘은 링크 규칙대로(포트폴리오 안 = ↗, 밖 = 상자). 그림을 키우는 효과는 쓰지 않음.
       마우스 올림이 없는 휴대폰은 판 없이 누르면 바로 이동. 지금 쓰는 곳: 첫 화면 대표 화면 줄(.cv-shot) · 프로젝트 요약 작은 이미지(.gl-thumb) */
    .img-link { position: relative; display: block; overflow: hidden; }
    .img-more { position: absolute; inset: 0; z-index: 1; display: flex; align-items: center; justify-content: center; gap: 6px; background: rgba(0,0,0,.55);
                color: #fff; font-size: 15px; font-weight: 600; letter-spacing: -.01em; opacity: 0; transition: opacity .25s ease; pointer-events: none; }
    .img-more .nt-icon { margin-left: 0; opacity: 1; }
    .img-link:hover .img-more, .img-link:focus-visible .img-more { opacity: 1; }
    @media (prefers-reduced-motion: reduce) { .img-more { transition: none; } }
    @media print { .img-more { display: none; } }
    /* 절 머리: 왼쪽 [작은 영문 · 큰 제목], 오른쪽 보조 글 */
    .sec-head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px; margin-bottom: 40px; }
    .sec-head h2 { margin: 12px 0 0; font-size: clamp(30px, 4.6vw, 48px); font-weight: 700; letter-spacing: -.025em; line-height: 1.2; }
    .sec-head.big h2 { font-size: clamp(36px, 6vw, 60px); }
    .sec-r { margin: 0; font-size: 14px; font-weight: 600; color: var(--sub); }
    /* 2단·3단: 넓은 화면에서만 비율대로, 760px 미만은 한 열(그림 → 글) */
    .split { display: grid; gap: 40px; }
    .cols3, .grid2, .grid3 { display: grid; gap: 20px; }
    .cols3 { gap: 40px; }
    @media (min-width: 760px) {
      .split { grid-template-columns: 35fr 65fr; align-items: center; gap: 56px; }
      .split .media { order: 2; }
      .cols3 { grid-template-columns: 42fr 23fr 35fr; }
      .grid2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .grid3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    }
    /* 기술 스택: 아이콘 → 굵은 기술 이름 → 근거 한 줄씩(뒤에 작은 프로젝트 이름). 넓은 화면 3열 · 760px 미만 한 열 */
    .stk { display: grid; gap: 44px; margin: 0; padding: 0; list-style: none; }
    .stk-icon { display: block; color: var(--ink); }
    .stk-name { margin: 18px 0 10px; font-size: 18px; font-weight: 700; letter-spacing: -.01em; line-height: 1.35; color: var(--ink); }
    .stk-ev { margin: 0; font-size: 15px; line-height: 1.6; color: var(--muted); }
    .stk-ev + .stk-ev { margin-top: 6px; }
    .stk-pj { margin-left: 6px; font-size: 12px; font-weight: 600; color: var(--sub); white-space: nowrap; }
    @media (min-width: 760px) { .stk { grid-template-columns: repeat(3, minmax(0, 1fr)); column-gap: 48px; row-gap: 64px; } }
    /* 기술 스택 아래 "써 본 도구"(profile.md): 구분선 → 묶음마다 작은 이름 + 아이콘 위·이름 아래 항목들, 모두 가운데 정렬. 위 카드(아이콘 40px·이름 18px)보다 작게 */
    .stk-more { display: grid; gap: 32px; margin: 56px 0 0; padding-top: 40px; border-top: 1px solid var(--divider); text-align: center; }
    .stk-label { margin: 0 0 16px; font-size: 12px; font-weight: 600; letter-spacing: .02em; color: var(--sub); }
    .stk-tools { display: flex; flex-wrap: wrap; justify-content: center; gap: 20px 28px; margin: 0; padding: 0; list-style: none; }
    .stk-tool { display: flex; flex-direction: column; align-items: center; gap: 8px; min-width: 64px; font-size: 13px; font-weight: 600; line-height: 1.3; color: var(--ink); }
    .stk-ticon { display: block; color: var(--ink); }
    .stk-line { display: grid; gap: 32px; }                            /* 한 줄에 묶음 여럿(profile.md에서 ` | `) — 휴대폰은 묶음마다 한 줄, 넓은 화면은 나란히 가운데 */
    @media (min-width: 760px) { .stk-more { margin-top: 72px; } .stk-tools { column-gap: 0; } .stk-tool { flex: 0 0 88px; min-width: 0; } .stk-line { display: flex; justify-content: center; column-gap: 64px; } }   /* 넓은 화면: 칸 폭 88px 고정 → 라벨 길이와 상관없이 아이콘 중심 사이가 늘 88px(휴대폰은 아래 칸 나눔 그대로) */
    /* 휴대폰: 칸 폭 70px 고정(iPhone Safari 393px 폭에서 5칸일 때의 간격) → 화면 폭과 상관없이 아이콘 중심 사이가 늘 70px. 한 줄에 안 들어가면 다음 줄로, 줄은 가운데 */
    @media (max-width: 759px) { .stk-tools { column-gap: 0; } .stk-tool { flex: 0 0 70px; min-width: 0; } }
    @media print { .stk-more { break-inside: avoid; } }
    /* 프로젝트 링크 캡슐: 앞 프로젝트의 캡슐이 화면에서 사라지면 화면 아래 가운데에 떠오르고(.on), 내려가다 기능 소개 아래 자리에 닿으면 거기 머묾(sticky).
       프로젝트 링크는 이 캡슐 하나로(프로젝트 소개 절에는 버튼 없음 — 인쇄용 주소 목록만) */
    .cap { position: sticky; bottom: calc(20px + var(--safe-b)); z-index: 30; display: flex; justify-content: center; width: fit-content; max-width: 100%; margin: 48px auto 96px; pointer-events: none; }   /* 폭은 캡슐만큼 — 화면 폭 전체인 고정 요소는 아이폰 Safari가 아래 도구 막대 칸을 바탕색으로 칠함 */
    @media (min-width: 760px) { .cap { margin: 56px auto 128px; } }
    /* 고정된 기능 소개 뒤: 캡슐의 제자리를 '마지막 기능까지 스크롤했을 때 떠 있던 자리'와 똑같이(트랙 끝 − 캡슐 높이 − 아래 여백 20px) → 고정이 풀리는 순간 그 자리에 붙음 */
    @media screen and (min-width: 760px) { .sec.core + .cap { margin-top: calc(-1 * (var(--cap-h, 50px) + 20px)); } }
    /* 공용 규칙 — 캡슐 바(.cap-pill 프로젝트 링크 · .hero-pill 맨 위 머리 링크): 반투명 카드색 + 흐림, 외곽선 1px, 완전히 둥근 모서리. 첫 버튼만 강조색(.btn-solid), 나머지는 바탕 없는 글자 버튼 */
    .cap-pill, .hero-pill { display: flex; gap: 6px; max-width: calc(100vw - 24px); padding: 6px; overflow-x: auto; border: 1px solid var(--line); border-radius: 999px;
                background: color-mix(in srgb, var(--card) 72%, transparent); -webkit-backdrop-filter: blur(24px) saturate(1.6); backdrop-filter: blur(24px) saturate(1.6); }
    .cap-pill :is(.btn), .hero-pill .btn { white-space: nowrap; flex-shrink: 0; }
    .cap-pill .btn:not(.btn-solid), .hero-pill .btn:not(.btn-solid) { border-color: transparent; background: transparent; }
    /* 캡슐 바 안의 마우스 올림은 일반 버튼과 따로(예전 그대로): 글자 버튼은 테두리 없이 옅은 회색 바탕, 강조색 버튼은 고리 없이 살짝 밝게 */
    .cap-pill .btn:not(.btn-solid):hover, .hero-pill .btn:not(.btn-solid):hover { background: color-mix(in srgb, var(--ink) 8%, transparent); }
    .cap-pill .btn-solid:hover, .hero-pill .btn-solid:hover { box-shadow: none; filter: brightness(1.1); }
    /* 맨 위 머리의 캡슐 바: 제자리에 고정(움직임 없음) — 레퍼런스 크기에 맞춰 높이 64px(버튼 44px + 안쪽 여백 9px + 외곽선), 글자 15px */
    .hero-pill { display: inline-flex; gap: 9px; padding: 9px; }   /* 직접 수정: 칸 사이 = 안쪽 여백(호버 범위 기준으로 테두리 안쪽 → 버튼 · 버튼 → 버튼이 같게) */
    .hero-pill .btn { min-height: 44px; padding: 0 22px; font-size: 15px; }
    @media (max-width: 480px) { .hero-pill { gap: 6px; padding: 6px; } .hero-pill .btn { min-height: 42px; padding: 0 15px; font-size: 14.5px; } }
    /* 떠 있는 캡슐(넓은 화면): 나타날 때(.on) ① 캡슐 높이의 동그라미가 화면 아래에서 솟아올라 제자리에 닿고(오르는 동안 세로로 살짝 늘어났다 제 모양으로)
       ② 동그라미 안에 강조색 점이 작게 생겨 버튼 높이로 커진 뒤 ③ 파란 버튼 쪽에서 버튼이 없는 오른쪽으로 펼쳐지며(동그라미 · 점 · 왼쪽 끝은 함께 왼쪽 제자리로 옮겨 가 캡슐은 가운데에 맞춰짐) 점은 같은 방향으로 첫 버튼 폭만큼 늘어나 버튼이 되고, 버튼 줄은 흐림이 걷히며 나타남.
       사라질 때(.out)는 거꾸로 — 버튼 줄이 흐려지며 동그라미로 접힌 뒤 화면 아래로 가라앉음.
       부드럽게: 움직이는 것은 모두 transform · opacity(브라우저가 GPU에서 따로 그림 — 스크롤 처리로 바쁜 중에도 프레임이 밀리지 않음).
       캡슐 몸통(.cap-body): 처음부터 끝까지 멈춰 있을 때와 같은 한 덩어리(.cb-full — 반투명 카드색 72% + 뒤 흐림) 하나를 보여 주고, 보이는 모양만 몸통 자신의 잘라 보이기(clip-path)로
       왼쪽 끝 동그라미 → 오른쪽으로 넓어진 알약(이음매 · 바꿔치기 없음). 캡슐 전체는 (펼친 폭 − 높이) / 2만큼 오른쪽에서 시작해, 펼쳐지는 만큼 같은 곡선으로 왼쪽 제자리로 옮겨 감
       → 동그라미는 화면에서 캡슐 가운데에 솟고, 바는 파란 버튼 쪽에서 오른쪽으로 펼쳐지며 내용도 함께 따라옴. 잘라 보이기는 메인 스레드에서 그리지만 글자 배치는 그대로라 떨리지 않음. 펼치기는 꼭대기에서 내려오기 시작할 때 함께 시작.
       (틀을 겹쳐 위치 이동으로 가리면 안쪽 틀의 둥근 가림이 뒤 흐림에 먹지 않고, 흐림 몸통을 둘로 나누면 가운데에서 흐림이 끊김 — Chrome에서 시험해 확인)
       잘린 둥근 끝의 외곽선은 반원 외곽선 둘(.cb-ring — 왼쪽은 제자리, 오른쪽은 넓어지는 끝을 따라감)이 그리고, 다 펼쳐지는 끝무렵 몸통의 외곽선과 서서히 바뀜.
       펼친 폭(--cap-w) · 높이(--cap-h)는 스크립트가 잼 */
    .cap-pill { position: relative; pointer-events: auto; overflow: visible; background: transparent; border-color: transparent; -webkit-backdrop-filter: none; backdrop-filter: none;
                transform: translateY(calc(100% + 64px)); visibility: hidden; }   /* 화면 아래 끝 밖(캡슐 높이 + 아래 여백 20px + 그림자)까지 내려가 있음 */
    .cap.on .cap-pill { transform: none; visibility: visible; }
    .cap-pill { transform-origin: calc(var(--cap-h, 50px) / 2) 0%; }   /* 늘어남의 기준 = 왼쪽 끝 동그라미의 위 끝 — 앞서 가는 위 끝은 제자리에 곧장 닿고, 길게 늘어난 아래쪽이 뒤따라 줄어듦(위 끝이 제자리를 지나치지 않음) */
    .cap.out .cap-pill { visibility: visible; }
    .cap-body { position: absolute; inset: -1px; pointer-events: none; }   /* 캡슐 외곽선까지(외곽선 1px은 자리만 남기고 투명) */
    .cb-full { position: absolute; inset: 0; }
    .cb-full { box-sizing: border-box; border: 1px solid var(--line); border-radius: 999px;
               background: color-mix(in srgb, var(--card) 72%, transparent); -webkit-backdrop-filter: blur(24px) saturate(1.6); backdrop-filter: blur(24px) saturate(1.6); }
    .cb-ring { position: absolute; top: 0; bottom: 0; width: calc(var(--cap-h, 50px) / 2); box-sizing: border-box; border: 1px solid var(--line); opacity: 0; }   /* 둥근 끝 외곽선(움직이는 동안만) */

    @media (max-width: 480px) { .cap-pill .btn { padding: 0 14px; } }   /* 직접 수정: 칸 사이 4px를 둔 만큼 좁은 화면에서 버튼 안쪽 여백을 줄여 360px 폭에서도 넘치지 않게(위 480px 규칙의 9px은 이 줄 위 규칙에 덮여 쓰이지 않음) */

    }
    /* 휴대폰(760px 미만): 그림을 한 줄로 이어 놓고 지금 그림(78% 폭)을 가운데에, 좌우에 앞뒤 그림이 조금씩 보이게 — 3.5초마다 다음 그림이 가운데로 옴(--cv-i = 지금 그림 번호, CoverScreens가 바꿈).
       마지막 다음에는 왼쪽으로 쭉 되돌아가 첫 그림으로(.rewind — 거리가 길어 조금 더 천천히). 줄은 본문 좌우 여백(20px)까지 화면 폭 전체로 펼침.
       뒤 번짐은 지금 그림 한 장만(그림이 바뀌면 함께 서서히 바뀜). 아래 점(.cv-dots)은 지금 위치 · 눌러서 바로 이동 */
    @media (max-width: 759px) {
      .cv-row { --cv-w: 78%; --cv-g: 12px; display: flex; gap: var(--cv-g); margin: 0 -20px;
                transform: translateX(calc((100% - var(--cv-w)) / 2 - var(--cv-i, 0) * (var(--cv-w) + var(--cv-g)))); transition: transform .7s cubic-bezier(.65,0,.35,1); }
      .cv-row.rewind { transition-duration: 1.1s; }
      .cv-row > li { flex: 0 0 var(--cv-w); min-width: 0; }
      .cv-shot { border-radius: 10px; }
      /* 뒤 번짐: Safari는 흐림을 상자 밖으로 번지게 그리지 않고 상자 테두리에서 잘라 그림(그림이 서서히 바뀌는 동안 특히) → 끊긴 선.
         그래서 상자를 위아래로 110px씩 키워 위아래 끝은 서서히 투명하게(mask), 좌우는 화면 끝까지(본문 좌우 여백 20px — 화면 끝은 원래 잘리는 자리라 선이 안 보임).
         그림은 원래 자리(화면 줄보다 상하좌우 10px 바깥) */
      .cv-glow { display: block; inset: -110px -20px; -webkit-mask-image: linear-gradient(transparent, #000 32%, #000 68%, transparent); mask-image: linear-gradient(transparent, #000 32%, #000 68%, transparent); }
      .cv-glow img { position: absolute; left: 10px; top: 100px; width: calc(100% - 20px); height: calc(100% - 200px); opacity: 0; transition: opacity .7s ease; }
      .cv-glow img.on { opacity: 1; }
      /* 아래 점(레퍼런스 크기 · 비율): 점 8px · 지금 그림은 48px 막대(점의 6배) · 간격 16px(점의 2배).
         넘어갈 때: 하얗게 다 찬 막대의 채움이 사라지며 막대는 점으로 줄고, 동시에 다음 점이 막대로 늘어남(.5초) → 다 늘어난 뒤 왼쪽부터 다시 차오름.
         막대(i)는 그대로 두고 폭만 바꿔 줄고 늘어남이 이어지게, 채움(b)은 넘어갈 때마다 키프레임 이름을 번갈아(a·b) 바꿔 처음부터 다시 */
      .cv-dots { position: relative; display: flex; justify-content: center; gap: 16px; margin-top: 14px; }
      .cv-dots button { position: relative; height: 24px; padding: 0; border: 0; background: transparent; cursor: pointer; display: grid; place-items: center; }
      .cv-dots button::after { content: ""; position: absolute; inset: 0 -8px; }   /* 누르는 자리: 보이는 점보다 좌우 8px씩 넓게(간격 16px을 나눠 가짐) */
      .cv-dots i { display: block; width: 8px; height: 8px; border-radius: 999px; overflow: hidden; background: color-mix(in srgb, var(--ink) 30%, transparent); transition: width .5s cubic-bezier(.4,0,.2,1); }
      .cv-dots b { display: block; width: 48px; height: 100%; border-radius: inherit; background: var(--ink); opacity: 0; transition: opacity .2s ease; }   /* 폭은 막대 폭(48px) 고정 — 100%로 두면 iPhone Safari가 애니메이션을 만드는 순간(점이 아직 8px)의 폭으로 -100%를 재서 8px만 움직임(처음부터 거의 꽉 차 보임). 점일 때는 넘친 부분을 i가 잘라 냄 */
      .cv-dots button.on i { width: 48px; }
      .cv-dots button.on b { opacity: 1; transition: none; animation: var(--cv-fill, cv-fill-a) calc(var(--cv-every, 3.5s) - .5s) linear .5s both; }
      @keyframes cv-fill-a { from { transform: translateX(-100%); } to { transform: none; } }
      @keyframes cv-fill-b { from { transform: translateX(-100%); } to { transform: none; } }
      .cv-dots button:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; border-radius: 999px; }
    }
    @media (prefers-reduced-motion: reduce) { .cv-shot, .cv-row, .cv-glow img, .cv-dots i, .cv-dots b { transition: none !important; } .cv-dots button.on b { animation: none; transform: none; } }   /* 자동으로 넘기지 않으므로 지금 점은 꽉 찬 막대 */
    /* 첫 화면 등장(처음 열 때 한 번, 기다리지 않음): 이름 · 한 줄 정체성 등 글은 움직임 없이 처음부터 보임(바로 읽히게).
       대표 화면 줄은 다른 띠처럼 아래에서 떠오르고(.reveal), 캡슐 바는 0.3초 뒤 프로젝트 링크 캡슐과 같은 움직임으로 펼쳐짐(아래 .hero-pill).
       페이지에 붙는 순간 한 번 재생 — 위로 다시 돌아와도 재생하지 않음. 인쇄·움직임 줄이기에서는 없음 */
    @keyframes ci-up { from { opacity: 0; transform: translateY(16px); } }
    /* 첫 화면 캡슐 바: 프로젝트 링크 캡슐(.cap)과 같은 구조(몸통 .cb-full · 둥근 끝 외곽선 .cb-ring · 강조색 점 .cap-dot · 버튼 줄 .cap-row)와 같은 키프레임으로 등장
       — 동그라미로 솟아올라 → 점이 생겨 첫 버튼 폭으로 늘어나며 → 오른쪽으로 펼쳐지고 버튼 줄은 흐림이 걷히며 나타남.
       떠 있는 캡슐처럼 화면 아래 끝 밖에서 올라옴 — 출발 높이(--cap-rise = 제자리에서 화면 아래 끝까지 + 캡슐 높이)도 Cover가 잼. 높이 · 펼친 폭 · 첫 버튼 폭(--cap-h · --cap-w · --b1)은 Cover가 재서 넣음
       (그리기 전에 한 번, 글꼴을 받은 뒤 · 화면 크기가 바뀔 때 다시 — 펼치는 도중에 글꼴이 바뀌어도 키프레임이 새 폭을 따라감).
       점 크기(--cap-dot) · 버튼 줄 왼쪽 끝(--cap-pad = 외곽선 1px + 안쪽 여백)은 이 캡슐의 안쪽 여백(--hp-pad)에 맞춤 */
    .hero-pill { --hp-pad: 9px; --cap-dot: calc(var(--cap-h, 64px) - 2px - 2 * var(--hp-pad)); --cap-pad: calc(1px + var(--hp-pad));
                 position: relative; overflow: visible; background: transparent; border-color: transparent; -webkit-backdrop-filter: none; backdrop-filter: none;
                 transform-origin: calc(var(--cap-h, 64px) / 2) 0%; }
    @media (max-width: 480px) { .hero-pill { --hp-pad: 6px; } }
    .hero-pill .cap-dot { left: var(--hp-pad); top: var(--hp-pad); }
    #cover .hero-pill { --d: .3s; animation: cap-y .9s var(--d) both, cap-x .9s var(--d) both, cap-s .9s var(--d) both; }
    #cover .hero-pill .cb-full { animation: cap-reveal .9s var(--d) both; }
    #cover .hero-pill .cb-ring-r { animation: cap-grow-r .9s var(--d) both, cap-ring-in .9s var(--d) both; }
    #cover .hero-pill .cb-ring-l { animation: cap-ring-in .9s var(--d) both; }
    #cover .hero-pill .cap-dot { animation: cap-dot-in .9s var(--d) both, cap-row-edge .9s var(--d) both; }
    #cover .hero-pill .cap-row { animation: cap-row-in .9s var(--d) both, cap-row-edge .9s var(--d) both; }
    @media (max-width: 759px) { #cover .hero-pill { animation: ci-up .8s cubic-bezier(.2,.8,.2,1) var(--d) backwards; } }   /* 휴대폰: 프로젝트 캡슐처럼 펼치기 없음(몸통·점·외곽선 움직임은 위 공용 규칙이 끔) → 아래에서 떠오르기만 */
    @media (prefers-reduced-motion: reduce) { #cover .hero-pill, #cover .hero-pill * { animation: none !important; } }
    #cover .hero-pill.no-intro, #cover .hero-pill.no-intro * { animation: none !important; }
    /* 직접 추가: 첫 화면 아래 끝이 ABOUT ME 머리말을 넘어 보이면(.no-rise — heroRise) 솟아오르기(cap-y·cap-s)를 건너뛰고 펼치기(28%)부터.
       기다림(--d) 동안은 숨겨 두었다가(cap-hold) 그 끝에 28% 자리에서 시작 — 모든 조각의 지연을 0.252초(0.9초 × 28%) 앞당겨 같은 박자로 */
    @keyframes cap-hold { from, to { opacity: 0; } }
    @media (min-width: 760px) {                                          /* 넓은 화면만(휴대폰은 원래 펼치기가 없음 — 그대로) */
      #cover .hero-pill.no-rise { --d2: calc(var(--d) - .252s); animation: cap-hold var(--d) linear backwards, cap-x .9s var(--d2) both; }
      #cover .hero-pill.no-rise .cb-full { animation: cap-reveal .9s var(--d2) both; }
      #cover .hero-pill.no-rise .cb-ring-r { animation: cap-grow-r .9s var(--d2) both, cap-ring-in .9s var(--d2) both; }
      #cover .hero-pill.no-rise .cb-ring-l { animation: cap-ring-in .9s var(--d2) both; }
      #cover .hero-pill.no-rise .cap-dot { animation: cap-dot-in .9s var(--d2) both, cap-row-edge .9s var(--d2) both; }
      #cover .hero-pill.no-rise .cap-row { animation: cap-row-in .9s var(--d2) both, cap-row-edge .9s var(--d2) both; }
    }

    /* 머리 막대 늘어남(화면만, 기술 스택 · 프로젝트마다): 묶음(.pg)의 큰 제목이 머리 막대 뒤로 완전히 사라지면 머리 막대 자신이 37px 아래로(프로젝트 줄 아래 여백 16px) 늘어나고,
       그 안에 [PROJECT 00 / 00] → [프로젝트명 · 기능 소개]가 시간차를 두고 아래에서 위로 떠오름. 묶음이 끝나면 다시 줄어듦 */
    /* 휴대폰(viewport-fit=cover): 상태 표시줄 높이(safe-area)만큼 머리 막대를 안쪽으로 — 아이폰 Safari 탭에서는 0(상태 표시줄 칸은 Safari가 칠함), 홈 화면 웹 앱 등에서만 값이 생김 */
    /* 하나의 막대: 머리 막대(흐림 + 바탕색 한 겹)가 아래 여백(padding-bottom)으로 늘어나고, 같은 만큼의 음수 아래 바깥 여백으로 페이지 흐름은 그대로 둠
       → 메뉴 줄과 프로젝트명 줄 사이에 이음매가 없음. 아이폰 Safari는 화면 위에 붙은 이 막대의 바탕색으로 상태 표시줄 칸을 칠함 */
    .site-head { padding-top: var(--safe-t); padding-bottom: 0; margin-bottom: 0; box-shadow: 0 1px 0 var(--line);
                 background-color: color-mix(in srgb, var(--bg) 80%, transparent);
                 -webkit-backdrop-filter: blur(24px) saturate(1.6); backdrop-filter: blur(24px) saturate(1.6);   /* 바탕색은 애니메이션 없이 바로 바뀜 — Safari가 바뀌는 중간 색을 상태 표시줄 칸에 칠하지 않게 */
                 transform: translateY(calc(-100% - 2px));
                 transition: transform .28s cubic-bezier(.5,0,.75,0), padding-bottom .45s cubic-bezier(.2,.7,.2,1) .05s, margin-bottom .45s cubic-bezier(.2,.7,.2,1) .05s; }
    /* 첫 화면(맨 위 머리)에서는 머리 막대를 숨겨 두고, 소개 절 위 끝이 머리 막대 아래 끝(화면 위 56px)에 닿으면 위에서 미끄러져 내려옴(.show).
       다시 위로 올라가면 위로 올라가 숨음. 키보드로 머리 막대 안 링크에 가면 숨어 있어도 내려옴(:focus-visible — 마우스로 [이름]을 눌러 맨 위로 가면 링크에 포커스가 남아도 숨음). 화면 모드 · PDF 버튼은 머리 막대 밖(.top-tools)에 따로 떠 있어 늘 같은 자리에 보임 */
    .site-head.show, .site-head:has(:focus-visible) { transform: none; transition: transform .5s cubic-bezier(.2,.7,.2,1), padding-bottom .45s cubic-bezier(.2,.7,.2,1) .05s, margin-bottom .45s cubic-bezier(.2,.7,.2,1) .05s; }
    .site-head.instant, .site-head.instant *, .site-head.instant *::before, .site-head.instant *::after { transition: none !important; }   /* 처음 그릴 때(새로고침해 읽던 위치로 돌아온 때 포함)는 움직임 없이 바로 그 상태로 — 늘어난 막대 안의 줄(프로젝트명·바로 가기)까지 */
    .site-head.ext, .site-head.pm-open { padding-bottom: var(--ext-bg); margin-bottom: calc(-1 * var(--ext-bg)); transition-delay: 0s; }
    .top-tools { position: fixed; top: 0; left: 0; right: 0; z-index: 60; padding-top: var(--safe-t); pointer-events: none; }
    .top-tools-w { display: flex; height: 56px; align-items: center; justify-content: flex-end; }
    .top-tools-w > div { display: flex; align-items: center; gap: 8px; pointer-events: auto; }
    .top-tools .btn-icon { background-color: var(--bg); }              /* 화면 모드 버튼: 불투명한 바탕색(숨은 머리 막대 아래로 스크롤하는 내용에 묻히지 않게) */
    .top-tools .btn-icon:hover { background-color: color-mix(in srgb, var(--accent) 16%, var(--bg)); }   /* 마우스 올림은 다른 버튼과 같게(위 불투명 바탕보다 우선) */
    .nh-tools-space { flex-shrink: 0; width: var(--tools-w, 76px); }     /* 머리 막대 메뉴가 떠 있는 버튼 아래로 들어가지 않게 버튼 폭만큼 비워 둠(폭은 스크립트가 잼) */
    @media (min-width: 768px) { .nh-tools-space { margin-left: 8px; } }   /* 직접 수정: 마지막 메뉴(연락처) ↔ 버튼 = 머리 막대 간격 16 + 8 = 24px — 메뉴끼리 간격(md:gap-6 = 24px)과 같게. 좁은 화면은 메뉴 간격도 16px라 그대로 */
    /* 휴대폰: 띠를 불투명한 바탕색으로 — 아이폰 Safari는 화면 위에 띠가 붙어 있으면 상태 표시줄 칸을 띠의 바탕색 '단색'으로 칠함(페이지가 그 칸에 그릴 수 없음).
       띠가 반투명이면 아래로 지나가는 그림이 비쳐 시계 칸과 경계가 생기므로, 휴대폰에서는 비치지 않게 해 시계 칸과 띠를 한 색으로 잇는다(PC는 반투명 흐림 그대로) */
    @media (max-width: 759px) { .site-head { background-color: var(--bg); -webkit-backdrop-filter: none; backdrop-filter: none; } }
    /* 휴대폰: 숨은 막대는 투명하게, 숨을 때는 미끄러지지 않고 바로 사라짐 — 관성으로 맨 위까지 올라가면
       ① 숨는 움직임(.28초)이 끝나기 전에 맨 위에 닿고 ② 맨 위에서 튕기는 동안 페이지가 아래로 끌려 내려오며 화면 바로 위에 숨겨 둔 막대도 함께 드러나
       막대가 잠깐 보였음. 나타날 때(.show)는 그대로 미끄러져 내려옴 */
    @media (max-width: 759px) { .site-head:not(.show):not(:has(:focus-visible)) { opacity: 0; transition: none; } }
    .nh-ext { position: absolute; left: 0; right: 0; top: calc(var(--top-h) - var(--ext-up)); height: var(--ext-h); overflow: hidden; pointer-events: none; }
    .nh-ext-w { display: grid; height: 100%; }
    .nh-bar { grid-area: 1 / 1; display: flex; align-items: center; gap: 14px; min-width: 0; }
    .nh-bar > * { opacity: 0; transform: translateY(1px); transition: opacity .18s ease, transform .18s ease; }
    .nh-bar.on > * { opacity: 1; transform: none; transition: opacity .45s ease, transform .6s cubic-bezier(.2,.7,.2,1); }
    .nh-bar.on > .nh-eb { transition-delay: .12s; }                      /* PROJECT 00 / 00 먼저 */
    .nh-bar.on > .nh-title { transition-delay: .26s; }                   /* 프로젝트명은 조금 뒤에 */
    .nh-eb { flex-shrink: 0; white-space: nowrap; }
    .nh-title { min-width: 0; margin: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 15px; font-weight: 700; letter-spacing: -.01em; color: var(--ink); }
    .nh-sub { color: inherit; font-weight: inherit; opacity: 0; transition: opacity .3s ease; }
    .site-head.in-core .nh-sub { opacity: 1; }
    .pg > .sec.core, #others { scroll-margin-top: var(--ext-bg); }   /* 프로젝트 묶음에서는 머리 막대가 늘어나 있으므로 늘어난 막대 아래 끝에(머리 막대 높이는 html의 scroll-padding-top이 더함) */
    /* 프로젝트 소개: 위 여백(5mm 줄임)을 늘어난 머리 막대 높이(머리 막대 + 늘어난 띠)만큼 더 두고, 이 절로 이동하면 절 위 끝이 화면 위 끝에 오게
       (html의 scroll-padding-top만큼 거꾸로 빼서 0) → 늘어난 막대 뒤로 절의 바탕·흐린 그림이 이어지고, 글은 전과 같은 자리에 보임 */
    @media screen {
      .pg > .sec.proj { padding-top: calc(6rem + var(--top-h) + var(--ext-bg) - 28px - 5mm); scroll-margin-top: calc(-1 * var(--top-h)); }
      @media (min-width: 768px) { .pg > .sec.proj { padding-top: calc(8rem + var(--top-h) + var(--ext-bg) - 28px - 5mm); } }
    }
    @media screen { .pg > .sec.core .sec-head { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; } }
    /* 프로젝트 바로 가기(.nh-pm): 늘어난 머리 막대 오른쪽에 메뉴와 같은 모양으로 [프로젝트들 · 기타 프로젝트]. 오른쪽 끝은 위 메뉴의 오른쪽 끝(--pm-r)에 맞춤.

    /* A4 인쇄(PDF로 저장): 화면 모드와 상관없이 흰 종이. 버튼·머리 막대·움직임은 빼고, 링크는 칠 수 있는 주소로.

      /* 절: 띠 바탕색 없이 흰 종이, 큰 절은 새 쪽에서 시작(쪽 맨 위라 위 여백은 뺌) */
