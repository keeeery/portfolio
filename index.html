<body>
  <a class="skip-link" href="#main">본문으로 건너뛰기</a>
  <div id="root"><p class="msg">불러오는 중…</p></div>
  <noscript><p class="msg">이 포트폴리오는 data/의 내용을 읽어 브라우저에서 그립니다. JavaScript를 켠 뒤 다시 열어 주세요.</p></noscript>

  <script type="text/babel" data-presets="react">
    const { useEffect, useLayoutEffect, useState, useRef, Fragment } = React;
    const html = document.documentElement;

    // ── 점검: PFPage.whenReady() → PFPage.report() (포트폴리오 페이지와 같은 모양) ──
    const info = { errors: [], sections: [], projects: 0, others: 0 };
    let resolveReady; const ready = new Promise((r) => { resolveReady = r; });
    html.dataset.pfReady = 'no';
    window.PFPage = { whenReady: () => ready, report };
    // ?pf-audit=1(headless 점검): #pf-audit에 report()의 base64 JSON — 슬라이드·예전 포트폴리오 페이지와 같은 형식
    function writeAudit() {
      let pre = document.getElementById('pf-audit');
      if (!pre) { pre = document.createElement('pre'); pre.id = 'pf-audit'; pre.hidden = true; document.body.appendChild(pre); }
      const bytes = new TextEncoder().encode(JSON.stringify(report()));
      let bin = '';
      for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode(...bytes.subarray(i, i + 0x8000));
      pre.textContent = btoa(bin);
    }
    ready.then(() => { if (new URLSearchParams(location.search).get('pf-audit') === '1') writeAudit(); });
    function report() {
      const imgs = [...document.images];
      return { page: 'portfolio', ready: html.dataset.pfReady, sections: info.sections, projects: info.projects, others: info.others, linkCards: info.linkCards,
        images: { total: imgs.length, broken: imgs.filter((i) => i.complete && i.naturalWidth === 0).map((i) => i.getAttribute('src')), pending: imgs.filter((i) => !i.complete).map((i) => i.getAttribute('src')) },
        deckLinks: [...document.querySelectorAll('a[data-deck-scene]')].map((a) => a.getAttribute('href')),
        overflowX: Math.max(0, html.scrollWidth - html.clientWidth), errors: info.errors,
        strings: window.PFStr ? PFStr.report() : { loaded: false, issues: [] } };
    }

    // ── 문구 표(theme/strings.tsv): "내 문구" 칸 → 비면 기본 문구. {a.b}는 다른 줄, {n}은 넣는 값 ──
    const FALLBACK = {
      'name.portfolio': '포트폴리오', 'name.deck': '슬라이드', 'name.doc': '프로젝트 상세 문서', 'name.doc-short': '상세 문서', 'name.video': '시연 영상', 'name.video-game': '플레이 영상', 'name.role': '내 역할', 'name.role-short': '역할',
      'name.intent': '개발 의도', 'name.team': '팀 프로젝트', 'name.solo': '개인 프로젝트',
      'en.portfolio': 'PORTFOLIO', 'en.about': 'ABOUT ME', 'en.skills': 'SKILLS', 'en.project': 'PROJECT', 'en.feature': 'FEATURE', 'en.others': 'OTHER WORK',
      'en.glance': 'AT A GLANCE', 'en.contact': 'CONTACT', 'en.link': 'LINK',
      'page.updated': '업데이트 {date}', 'page.intro': '자기소개', 'page.stack': '기술 스택', 'page.stack-note': '근거 프로젝트와 함께', 'page.project-no': '{en.project} {no} / {total}',
      'page.features': '기능 소개', 'page.see-in-deck': '{name.deck}에서 보기', 'page.see-in-doc': '{name.doc-short}에서 보기', 'page.browser-note': '이 문서는 넓은 화면(PC), Chrome 브라우저 환경에 최적화되어 있습니다.', 'page.last-updated': '마지막 업데이트 {date}', 'page.deck-all': '{name.deck} 전체', 'page.others': '기타 프로젝트', 'page.link-card-open': '바로가기', 'page.glance': '프로젝트 요약',
      'page.nav-intro': '소개', 'page.nav-stack': '{page.stack}', 'page.nav-projects': '프로젝트', 'page.nav-others': '기타', 'page.nav-glance': '한눈에 보기', 'page.nav-contact': '연락처',
      'page.print-email': '이메일', 'page.print-web': '웹 {name.portfolio}',
      'ui.pdf': 'PDF로 저장', 'ui.preparing': '준비 중…', 'ui.skip': '본문으로 건너뛰기',
    };
    function parseStrings(tsv) {
      const map = {};
      tsv.replace(/^﻿/, '').split(/\r?\n/).forEach((line, i) => {
        if (!i || !line || line.startsWith('#')) return;
        const c = line.split('\t');
        if (c.length < 3) return;
        map[c[0].trim()] = (c[3] || '').trim() || c[2];
      });
      return map;
    }
    let STR = { ...FALLBACK };
    function t(key, vars = {}, depth = 0) {
      const raw = STR[key] ?? FALLBACK[key] ?? key;
      return raw.replace(/\{([\w.-]+)\}/g, (m, k) => k.includes('.') ? (depth < 5 ? t(k, {}, depth + 1) : m) : (vars[k] ?? m));
    }

    // ── 글 조각: **굵게**, `코드`만 해석(나머지는 글 그대로) ──
    function Inline({ text }) {
      if (!text) return null;
      return String(text).split(/(\*\*[^*]+\*\*|`[^`]+`)/g).filter(Boolean).map((s, i) => s.startsWith('**') ? <strong key={i}>{s.slice(2, -2)}</strong>
        : s.startsWith('`') ? <code key={i}>{s.slice(1, -1)}</code> : <Fragment key={i}>{s}</Fragment>);
    }
    const isUrl = (u) => typeof u === 'string' && /^https?:\/\//i.test(u);
    const shortUrl = (u) => String(u || '').replace(/^https?:\/\/(www\.)?/i, '').replace(/\/$/, '');
    // 프로젝트 저장소 링크: 저장소가 하나면 'GitHub', 둘 이상이면 모두 'GitHub(역할)' → [이름, 주소]
    // 주 저장소 = links.github(+ links.githubRole), 나머지 저장소 = links.extra 중 role이 있는 항목. role이 없는 extra는 그 밖의 링크(otherLinks)
    const repoLinks = (p) => {
      const L = p?.links || {};
      const rs = [isUrl(L.github) && { role: L.githubRole, url: L.github }, ...(L.extra || []).filter((l) => l.role && isUrl(l.url))].filter(Boolean);
      return rs.map((r) => [rs.length > 1 && r.role ? `GitHub(${r.role})` : 'GitHub', r.url]);
    };
    const otherLinks = (p) => (p?.links?.extra || []).filter((l) => !l.role && isUrl(l.url)).map((l) => [l.label, l.url]);
    // 직접 고침(2026-11-26): 영상 링크 이름 — 게임은 「플레이 영상」, 장르가 앱·애플리케이션(게임이 아닌 것)이면 「시연 영상」 (assets/common.js videoName과 같은 규칙)
    const videoName = (genre) => t(!/게임/.test(genre || '') && /앱|애플리케이션|어플|\bapp(lication)?\b/i.test(genre || '') ? 'name.video' : 'name.video-game');
    const projectVideoName = (p) => videoName((p?.meta || []).find((m) => m.label === '장르')?.value);
    // 미리 만드는 PDF(tools/make-pdf.py): ?pdf-base=<배포 주소>로 열면 PDF에 적히는 주소·링크가 localhost 대신 배포 주소 기준
    const PDF_BASE = (() => { const b = new URLSearchParams(location.search).get('pdf-base'); return isUrl(b) ? b.replace(/\/?$/, '/') : ''; })();
    const PAGE_URL = PDF_BASE || location.pathname;                     // 인쇄에 적는 '이 페이지' 주소
    const visibleUrl = (rel) => { let u = new URL(rel, PDF_BASE || location.href); u = `${u.host}${u.pathname}${u.search}`; try { u = decodeURI(u); } catch { /* 그대로 */ } return u; };
    //   페이지 안의 상대 링크(슬라이드·상세 문서 등)를 배포 주소로 바꿈 — PDF 속 링크가 localhost로 가지 않게(#절 링크는 PDF 안 이동이라 그대로)
    const absolutizeLinks = () => PDF_BASE && document.querySelectorAll('a[href]').forEach((a) => {
      const h = a.getAttribute('href');
      if (h && !h.startsWith('#') && !/^[a-z][a-z0-9+.-]*:/i.test(h)) a.setAttribute('href', new URL(h, PDF_BASE).href);
    });
    const pad2 = (n) => String(n).padStart(2, '0');
    const encodePath = (p) => String(p).replace(/^\.\//, '').split('/').map(encodeURIComponent).join('/');
    const img = (p, src) => `src/${encodeURIComponent(p.id)}/${encodePath(src)}`;
    const teamLabel = (team) => team?.type === 'team' ? t('name.team') : t('name.solo');   // 인원수는 프로젝트 정보 표(meta)에 있어 빼고 팀/개인만
    // 슬라이드의 그 기능 장면(포트폴리오 페이지와 같은 규칙: highlights[].section → deck.slides의 sectionPath)
    const normTitle = (s) => String(s || '').replace(/[`*_~]/g, '').replace(/\s+/g, ' ').trim();
    const keyOk = (k) => /^[a-z][a-z0-9-]{1,31}$/.test(k || '') && !/^s-\d+$/.test(k);
    function deckSceneFor(p, section) {
      const want = normTitle(section);
      if (!want || !p.deck?.slides?.length) return '';
      const last = (x) => normTitle((x.sectionPath || []).slice(-1)[0]);
      const find = (list) => list.find((x) => last(x) === want) || list.find((x) => (x.sectionPath || []).some((s) => normTitle(s) === want));
      const sl = find(p.deck.slides);
      if (sl) return keyOk(sl.key) ? `d-${sl.key}` : '';
      const hid = find(p.deck.base || []);
      return hid && keyOk(hid.chapter) && p.deck.slides.some((x) => x.chapter === hid.chapter) ? `ch-${hid.chapter}` : '';
    }
    const deckHref = (p, sid = '') => `project.html?p=${encodeURIComponent(p.id)}${sid ? `#s=${sid}` : ''}`;
    const docHref = (p) => `doc.html?p=${encodeURIComponent(p.id)}`;
    // 기능마다 [상세 문서에서 보기]: 프로젝트 상세 문서의 그 기능을 설명한 절로(#sec=<절 제목> — doc.html이 제목을 찾아 그 자리로 이동·강조).
    //   기본은 기능 소개가 가리키는 절(highlights[].section). 그 절보다 더 맞는 절이 있는 기능만 아래 표에서 바꿈(프로젝트 문서를 보고 고름)
    const DOC_SECTION = {
      '2-Folk-Sack': { 3: '4.2 탈출·깔림 결정과 피해 전달' },   // 낙하 지형 충돌·탈출·매몰 — '4.1 낙하 청크 접촉과 매몰 상태'보다 판정·피해 처리를 직접 설명하는 절
    };
    const docSecHref = (p, i, h) => { const sec = DOC_SECTION[p.id]?.[i] || h.section; return sec ? `${docHref(p)}#sec=${encodeURIComponent(sec)}` : docHref(p); };

    // 링크 규칙(포트폴리오 페이지와 같음): 외부(http(s)) = 새 탭 + 읽기 도구용 "(새 탭, 외부 사이트)". 포트폴리오 안의 다른 페이지 = 같은 탭 + ↗. 같은 페이지 안 이동·메일 = 같은 탭
    // 이메일 주소를 클립보드에 복사하는 작은 아이콘 버튼(복사되면 1.5초 동안 체크 표시)
    function CopyButton({ text }) {
      const [done, setDone] = React.useState(false);
      const copy = async () => {
        try { await navigator.clipboard.writeText(text); }
        catch { const ta = document.createElement('textarea'); ta.value = text; ta.setAttribute('readonly', ''); ta.style.cssText = 'position:fixed;opacity:0';
                document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); } catch {} ta.remove(); }
        setDone(true); setTimeout(() => setDone(false), 1500);
      };
      const label = done ? '복사했습니다' : '이메일 주소 복사';
      return (
        <button type="button" className={'copy-btn no-print' + (done ? ' done' : '')} onClick={copy} aria-label={label} title={label}>
          <Icon name={done ? 'check' : 'copy'} size={14} sw={1.26} className="" />   {/* 이메일 글자(18px)가 커서 14px, 선은 다른 아이콘과 같은 굵기로 보이게 1.6×11/14 */}
          <span className="sr-only" aria-live="polite">{done ? '복사했습니다' : ''}</span>
        </button>
      );
    }
    /* 글 옆 아이콘은 원래 ↗ 아이콘에 맞춤: 12×12 칸, 선 굵기 1.6, 11px. 눈에 보이는 크기를 맞춤 —
       ↗는 대각선 하나라 커 보이므로 그림 영역 6.5칸(가로 3~9.5), 상자·내려받기·복사·복사됨(체크)은 7.5칸(2.75~10.25)
       inner ↗ = 포트폴리오 안의 다른 페이지(슬라이드·프로젝트 문서) · ext 상자+화살표 = 포트폴리오 밖(GitHub·영상, 새 탭) · save = 내려받기 */
    const ICON_PATHS = {
      inner: <path d="M4.5 2.5h5v5M9.5 2.5 3 9" />,
      ext: <><path d="M5 2.25H3.75a1 1 0 0 0-1 1v5.5a1 1 0 0 0 1 1h5.5a1 1 0 0 0 1-1V7.5" /><path d="M7.25 2.25h3v3M10.25 2.25 6.25 6.25" /></>,
      save: <path d="M6 2.25v5.25M3.4 5 6 7.6 8.6 5M2.25 9.75h7.5" />,   // 가로 2.25~9.75 = 12칸의 가운데(예전 2.75~10.25는 0.5칸 오른쪽으로 치우쳐 동그란 버튼에서 어긋나 보였음)
      copy: <><rect x="5.25" y="5.25" width="5" height="5" rx="1" /><path d="M7.75 4v-.25a1 1 0 0 0-1-1h-3a1 1 0 0 0-1 1v3a1 1 0 0 0 1 1H4" /></>,
      check: <path d="M3.25 6.75 5.5 9l4.25-5" />,
    };
    const ICON_SIZE = 11;                                                  // 버튼·링크 글 옆 아이콘 크기(px) 하나로
    const Icon = ({ name, size = ICON_SIZE, sw = 1.6, className = 'nt-icon' }) =>
      <svg className={className} aria-hidden="true" focusable="false" viewBox="0 0 12 12" width={size} height={size} fill="none" stroke="currentColor" strokeWidth={sw} strokeLinecap="round" strokeLinejoin="round">{ICON_PATHS[name]}</svg>;
    const NewTabIcon = ({ external }) => <><Icon name={external ? 'ext' : 'inner'} />{external && <span className="sr-only nt-sr">(새 탭, 외부 사이트)</span>}</>;
    // 포트폴리오 밖(http(s) 주소)과 PDF만 새 탭. 포트폴리오 안의 이동(슬라이드·프로젝트 문서)은 같은 탭 — 새 탭이 계속 쌓이지 않게(새 탭은 읽는 사람이 휠 클릭으로)
    const Ext = ({ href, className, children, ...rest }) => { const external = /^https?:\/\//i.test(href || '') || /\.pdf(?:[?#]|$)/i.test(href || '');   // 외부 주소·PDF = 새 탭
      return <a href={href} className={className} {...(external ? { target: '_blank', rel: 'noopener' } : {})} {...rest}>{children}<NewTabIcon external={external} /></a>; };

    // 인쇄(PDF)에서 버튼 대신 보이는 주소 목록. rows: [이름, 링크]
    function PrintUrls({ rows }) {
      const list = rows.filter(Boolean);
      if (!list.length) return null;
      return <dl className="print-only purls">{list.map(([k, href]) => <div key={k + href}><dt>{k}</dt><dd><a href={href}>{href.startsWith('mailto:') ? href.slice(7) : isUrl(href) ? shortUrl(href) : visibleUrl(href)}</a></dd></div>)}</dl>;
    }
    // 순서는 캡슐 바와 같게: 시연 영상 → 상세 문서 → 슬라이드 → GitHub(저장소) → 그 밖의 링크
    const projectUrlRows = (p) => [isUrl(p.links?.video) && [projectVideoName(p), p.links.video], [t('name.doc'), docHref(p)], [t('name.deck'), deckHref(p)],
      ...repoLinks(p), ...otherLinks(p)];

    function ProjectLinks({ p, solid }) {
      const L = p.links || {};
      return (
        <div className="no-print flex flex-wrap gap-2">
          <Ext className={'btn' + (solid ? ' btn-solid' : '')} href={deckHref(p)}>{t('name.deck')}</Ext>
          <Ext className="btn" href={docHref(p)}>{t('name.doc')}</Ext>
          {repoLinks(p).map(([k, u]) => <Ext key={u} className="btn" href={u}>{k}</Ext>)}
          {isUrl(L.video) && <Ext className="btn" href={L.video}>{projectVideoName(p)}</Ext>}
          {otherLinks(p).map(([k, u]) => <Ext key={u} className="btn" href={u}>{k}</Ext>)}
        </div>
      );
    }

    // 그림 칸 4:3 — 비율이 15% 넘게 다르면 .fit(잘라 내지 않음)
    function Shot({ src, alt, w, h, eager }) {
      const off = (a, b) => a > 0 && b > 0 && Math.abs(a / b / (4 / 3) - 1) > 0.15;
      const [fit, setFit] = useState(off(w, h));
      return (
        <div className={'shot' + (fit ? ' fit' : '')}>
          <img src={src} alt={alt} loading={eager ? 'eager' : 'lazy'} decoding="async" width={w || undefined} height={h || undefined}
            onLoad={(e) => { if (!w || !h) setFit(off(e.currentTarget.naturalWidth, e.currentTarget.naturalHeight)); }} />
        </div>
      );
    }

    // ── 화면 모드 버튼(밝은 테마 파일이 실제로 바탕색을 바꿀 때만) ──
    const SUN = <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>;
    const MOON = <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>;
    const getMode = () => (html.dataset.pfMode === 'light' ? 'light' : 'dark');
    // 아이폰 Safari는 위(상태 표시줄)·아래 칸 색을 '그림이 바뀔 때'가 아니라 스크롤·배치가 바뀔 때 다시 읽음 →
    //   모드를 바꾼 다음 그림에서 ① 화면 위에 붙은 머리 막대의 배치를 아주 조금(0.01px) 바꿨다 되돌리고 ② 1px 내렸다 바로 되돌려 다시 읽게 함(화면은 움직이지 않음).
    //   Safari가 첫 번에 놓쳐도 되게 조금 뒤(.35초)에 한 번 더
    // 아이폰 Safari는 화면 위에 붙은 머리 막대가 처음 나타날 때 그 색을 읽어 상태 표시줄 칸에 덧칠하고, 페이지를 연 동안 다시 읽지 않음
    //   (iOS 26.5 시뮬레이터: 색 · 배치 · 스크롤 · 숨겼다 보이기 · 요소 바꿔 끼우기 · theme-color 바꾸기 모두 소용없음 — 새로 고침만 다시 읽음).
    //   그래서 아이폰에서 머리 막대가 한 번이라도 나타난 뒤 모드를 바꾸면 페이지를 새로 고침(읽던 위치는 pagehide에 저장 → 다시 그린 뒤 되돌림).
    //   머리 막대가 아직 안 나타났으면(첫 화면) Safari가 기억한 색이 없어 나중에 나타날 때 새 색을 읽으므로 새로 고치지 않음
    let headSeen = false;
    const IOS_BARS = /iP(hone|od|ad)/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    function nudgeBars() {
      const once = () => requestAnimationFrame(() => requestAnimationFrame(() => {
        const head = document.querySelector('.site-head');
        if (head) head.style.minHeight = (head.offsetHeight + 0.01) + 'px';
        const y = scrollY, d = y > 0 ? -1 : 1;
        scrollTo({ top: y + d, behavior: 'instant' });
        requestAnimationFrame(() => { scrollTo({ top: y, behavior: 'instant' }); if (head) head.style.minHeight = ''; });
      }));
      once(); setTimeout(once, 350);
    }
    // 브라우저 막대 색(meta theme-color)을 지금 모드의 바탕색으로
    function syncBarColor() {
      const meta = document.querySelector('meta[name="theme-color"]'); if (!meta) return;
      const c = getComputedStyle(html).getPropertyValue('--bg').trim(); if (c) meta.setAttribute('content', c);   // 바탕 전환 애니메이션 중간값이 아니라 목표 색
    }
    const tVar = (n) => getComputedStyle(html).getPropertyValue(n).trim().toUpperCase();
    function hasLightMode() {
      const cur = html.dataset.pfMode;
      html.dataset.pfMode = 'light'; const a = tVar('--t-bg');
      html.dataset.pfMode = 'dark'; const b = tVar('--t-bg');
      if (cur) html.dataset.pfMode = cur; else delete html.dataset.pfMode;
      return /^#[0-9A-F]{6}$/.test(a) && a !== b;
    }
    function ModeButton() {
      const [mode, setModeState] = useState(getMode());
      const [ok] = useState(hasLightMode);
      useEffect(() => {
        const sys = matchMedia('(prefers-color-scheme: light)');
        const onSys = (e) => { let saved = null; try { saved = localStorage.getItem('pf-mode'); } catch {} if (!saved) apply(e.matches ? 'light' : 'dark', false); };
        sys.addEventListener?.('change', onSys);
        return () => sys.removeEventListener?.('change', onSys);
      }, []);
      function apply(m, save = true) {
        if (m === 'light') html.dataset.pfMode = 'light'; else delete html.dataset.pfMode;
        if (save) try { localStorage.setItem('pf-mode', m); } catch {}
        if (save && IOS_BARS && headSeen) { location.reload(); return; }   // 위 nudgeBars 설명 참고 — 상태 표시줄 칸 색을 새로 읽게
        setModeState(m);
        syncBarColor();
        nudgeBars();
        window.dispatchEvent(new CustomEvent('pf-mode', { detail: m }));
      }
      if (!ok) return null;
      const label = mode === 'light' ? '다크 모드로 전환' : '라이트 모드로 전환';
      return <button type="button" className="btn btn-icon no-print" aria-label={label} title={label} onClick={() => apply(mode === 'light' ? 'dark' : 'light')}>{mode === 'light' ? MOON : SUN}</button>;
    }

    // ── [PDF로 저장]: 아래쪽 그림까지 받은 뒤 인쇄(늦게 받는 그림은 PDF에서 빠짐) ──
    const eager = () => document.querySelectorAll('img[loading="lazy"]').forEach((i) => { i.loading = 'eager'; });
    const loaded = (i) => (i.complete ? null : new Promise((r) => { i.addEventListener('load', r, { once: true }); i.addEventListener('error', r, { once: true }); }));
    async function loadAll(ms) { eager(); await Promise.race([Promise.all([...document.images].map(loaded)), new Promise((r) => setTimeout(r, ms))]); }
    const showAll = () => document.querySelectorAll('.reveal').forEach((e) => e.classList.add('in'));
    addEventListener('beforeprint', () => { eager(); showAll(); });
    //   미리 만든 PDF(레포 맨 위 '<이름>-포트폴리오.pdf' — tools/make-pdf.py로 만듦)가 있으면 그 파일을 열거나 같은 이름으로 내려받고, 없으면(예: 아직 안 만듦) 예전처럼 인쇄 창으로.
    //   파일 이름 규칙은 tools/make-pdf.py의 pdf_name()과 같아야 함(문구 표와 상관없이 '포트폴리오' 고정)
    const pdfName = (name) => { const n = String(name || '').trim().replace(/[\\/:*?"<>|]/g, ''); return `${n ? `${n}-` : ''}포트폴리오.pdf`.normalize('NFC'); };
    const pdfExists = (file) => location.protocol === 'file:' ? Promise.resolve(false)
      : fetch(encodeURIComponent(file), { method: 'HEAD', cache: 'no-cache' }).then((r) => r.ok && !/text\/html/i.test(r.headers.get('content-type') || '')).catch(() => false);
    const DL_ICON = <Icon name="save" size={18} sw={0.98} className="pdf-ico" />;   // 머리 막대 버튼: 같은 내려받기 그림을 18px로, 선은 ↗와 같은 굵기로 보이게 1.6×11/18
    const OPEN_ICON = <Icon name="ext" />;
    //   미리 만든 PDF가 있으면 아이콘을 눌렀을 때 작은 창(새 탭에서 열기 · 파일로 받기). 바깥을 누르거나 Esc로 닫힘. 없으면 예전처럼 인쇄 창으로
    function PdfButton({ name }) {
      const [busy, setBusy] = useState(false);
      const [file, setFile] = useState(false);
      const [open, setOpen] = useState(false);
      const box = useRef(null), menu = useRef(null);
      const [pos, setPos] = useState(null);                              // 선택 창 자리([파일로 받기]가 다운로드 버튼 자리에 — 창 오른쪽 끝 = 버튼 오른쪽 끝 + 8px, 세로 가운데 맞춤)
      const [shown, setShown] = useState(false);                         // 닫힐 때 [파일로 받기]가 다운로드 버튼 자리로 돌아가는 동안(.28초)은 남겨 둠
      useEffect(() => {
        if (open) { setShown(true); return; }
        if (matchMedia('(prefers-reduced-motion: reduce)').matches) { setShown(false); return; }
        const id = setTimeout(() => setShown(false), 340); return () => clearTimeout(id);   // 닫힘 .32초 + 여유
      }, [open]);
      const fileName = pdfName(name), href = encodeURIComponent(fileName);   // 레포의 파일 이름 = 내려받는 파일 이름 (예: 주현진-포트폴리오.pdf)
      useEffect(() => { let live = true; pdfExists(fileName).then((ok) => live && setFile(ok)); return () => { live = false; }; }, [fileName]);
      useEffect(() => {
        if (!open) return;
        const place = () => { const r = box.current?.getBoundingClientRect(); if (r) setPos({ '--pm-top': `${r.top + r.height / 2 - 25}px`, '--pm-right': `${document.documentElement.clientWidth - r.right - 8}px` }); };
        place();
        const away = (e) => { if (!box.current?.contains(e.target) && !menu.current?.contains(e.target)) setOpen(false); };
        const esc = (e) => { if (e.key === 'Escape') { setOpen(false); box.current?.querySelector('.pdf-btn')?.focus(); } };
        document.addEventListener('pointerdown', away); document.addEventListener('keydown', esc);
        addEventListener('resize', place); addEventListener('scroll', place, { passive: true });
        return () => { document.removeEventListener('pointerdown', away); document.removeEventListener('keydown', esc); removeEventListener('resize', place); removeEventListener('scroll', place); };
      }, [open]);
      useEffect(() => { if (open && pos) menu.current?.querySelector('a')?.focus({ preventScroll: true }); }, [open, !!pos]);
      // 다운로드 버튼 → [파일로 받기]: 출발 자리(오른쪽 위 끝 차이 --mx · --my) · [파일로 받기] 폭(--mb) · 창 폭(--mw) · 높이(--mh)를 창이 그려지기 전에 잼(창 자체는 움직이지 않아 화면 위치 그대로)
      useLayoutEffect(() => {
        const m = menu.current, b = box.current?.querySelector('.pdf-btn'); if (!m || !b || !open) return;
        const s = m.querySelector('.btn-solid'); if (!s) return;
        const br = b.getBoundingClientRect(), sr = s.getBoundingClientRect();
        m.style.setProperty('--mx', `${br.right - sr.right}px`); m.style.setProperty('--my', `${br.top - sr.top}px`); m.style.setProperty('--mb', `${sr.width}px`);
        m.style.setProperty('--mw', `${m.offsetWidth}px`); m.style.setProperty('--mh', `${m.offsetHeight}px`);
      }, [open, shown, pos]);
      const label = busy ? t('ui.preparing') : t('ui.pdf');
      if (file) return (
        <div className="pdf-wrap no-print" ref={box}>
          <button type="button" className="btn btn-solid btn-sm pdf-btn" title={label} aria-haspopup="menu" aria-expanded={open} onClick={() => setOpen((o) => !o)}>
            {DL_ICON}<span className="pdf-txt">{label}</span></button>
          {shown && pos && ReactDOM.createPortal(
            <div className={'pdf-menu no-print' + (open ? '' : ' out')} role="menu" aria-label={label} ref={menu} style={pos} aria-hidden={!open || undefined}>
              <span className="pm-shade" aria-hidden="true" />
              <span className="pm-full" aria-hidden="true" />
              <span className="pm-ring" aria-hidden="true" />
              <span className="pm-morph" aria-hidden="true">{DL_ICON}</span>
              <div className="pm-row" role="none">
                <a role="menuitem" className="btn" href={href} target="_blank" rel="noopener" onClick={() => setOpen(false)}>새 탭에서 열기{OPEN_ICON}<span className="sr-only">(새 탭)</span></a>
                <a role="menuitem" className="btn btn-solid" href={href} download={fileName} onClick={() => setOpen(false)}>파일로 받기<Icon name="save" size={18} sw={0.98} className="pm-save" /></a>
              </div>
            </div>, document.body
          )}
        </div>
      );
      return <button type="button" className="btn btn-solid btn-sm pdf-btn no-print" disabled={busy} title={label}
        onClick={async () => { setBusy(true); showAll(); await loadAll(15000); setBusy(false); setTimeout(() => window.print(), 50); }}>
        {DL_ICON}<span className="pdf-txt">{label}</span></button>;
    }

    // ── 스크롤하면 띠가 하나씩 떠오름 ──
    function bindReveal() {
      const els = document.querySelectorAll('.reveal');
      if (!('IntersectionObserver' in window) || matchMedia('print').matches) { showAll(); return; }
      const io = new IntersectionObserver((es) => es.forEach((e) => { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } }), { rootMargin: '0px 0px -8% 0px' });
      els.forEach((e) => io.observe(e));
    }

    // ── 머리 막대 늘어남 ──
    //   프로젝트 묶음(.pg)의 위 끝이 늘어난 머리 막대의 아래 끝에 닿으면 묶음이 끝날 때까지 머리 막대에 .ext(바탕이 늘어나 있음),
    //   그 안에서 큰 제목(h2)이 늘어난 막대 뒤로 완전히 사라지면 그 묶음의 줄(.nh-bar.on)이 떠오름(.titled). 기타 프로젝트 절(#others)도 늘어난 상태.
    //   기능 소개가 머리 막대 아래에 붙어 고정되기 시작하면(휴대폰은 기능 소개 위 끝이 막대에 닿으면) 제목 오른쪽에 " · 기능 소개"(.in-core)
    // 머리 막대 메뉴 줄의 아래 끝(화면 위에서) — 숨었다 내려오는 움직임(transform)과 상관없이 배치로 잼(머리 막대는 늘 화면 위에 붙어 있음)
    const headBottom = (head) => { const row = head.firstElementChild; return row.offsetTop + row.offsetHeight; };

    // ── 첫 화면에서 머리 막대 숨김 ──
    //   맨 위 머리(#cover)가 절반 지나가면(아래 끝이 제 높이의 절반 위치까지 올라오면) .show(위에서 내려옴), 그보다 위로 돌아가면 다시 숨음.
    //   맨 위 머리가 없으면 소개 절의 위 끝이 머리 막대 아래 끝에 닿을 때
    //   화면 모드 · PDF 버튼(.top-tools)은 늘 보이고, 머리 막대에는 그 폭(--tools-w)만큼 빈자리
    function bindTopBar() {
      const head = document.querySelector('.site-head'), tools = document.querySelector('.top-tools-w > div');
      if (!head) return;
      const fit = () => tools && head.style.setProperty('--tools-w', `${tools.offsetWidth}px`);
      fit(); if (tools && 'ResizeObserver' in window) new ResizeObserver(fit).observe(tools);
      const cover = document.getElementById('cover'), gate = document.getElementById('intro') || cover?.nextElementSibling;
      let cur = null;
      const update = () => {
        const show = cover ? cover.getBoundingClientRect().bottom <= cover.offsetHeight / 2 : !gate || gate.getBoundingClientRect().top <= headBottom(head) + 1;
        if (show !== cur) { head.classList.toggle('show', show); cur = show; if (show) headSeen = true; }
      };
      head.classList.add('instant'); update();                            // 움직임은 읽던 위치·주소의 절로 옮긴 뒤 settleTopBar()가 다시 켬
      addEventListener('scroll', update, { passive: true });
      addEventListener('resize', update);
    }

    // 처음 그린 뒤 읽던 위치·주소의 절로 옮기고 나서 부름: 옮긴 자리의 머리 막대 상태(숨김·늘어남·프로젝트명 줄)를 바로 맞춘 뒤,
    //   그 상태가 움직임 없이 한 번 그려지고 나서야(두 프레임 뒤) 움직임을 켬 — 페이지 아래쪽(기타 프로젝트 등)에서 새로고침해도 막대가 펼쳐지는 모습이 보이지 않게
    //   프로젝트 링크 캡슐도 같은 동안(html.pf-settling)은 떠오르거나 가라앉는 연출 없이 옮긴 자리의 상태로(bindCaps)
    function settleTopBar() {
      const head = document.querySelector('.site-head');
      html.classList.add('pf-settling');
      dispatchEvent(new Event('scroll'));                                 // 스크롤 이벤트를 기다리지 않고 지금 자리로 상태 맞춤
      if (head) getComputedStyle(head).transform;                         // 움직임 없는 상태로 스타일 확정
      requestAnimationFrame(() => requestAnimationFrame(() => { head?.classList.remove('instant'); html.classList.remove('pf-settling'); }));
    }

    function bindHeads() {
      const head = document.querySelector('.site-head');
      if (!head) return;
      const bars = [...head.querySelectorAll('.nh-bar')];
      const groups = [...document.querySelectorAll('.pg[data-bar]')].map((g) => ({ g, i: +g.dataset.bar, h2: g.querySelector('.sec-head h2'), core: g.querySelector('.fe') || g.querySelector('.sec.core') }))
        .filter((x) => x.h2 && bars[x.i]);
      if (!groups.length) return;
      const others = document.getElementById('others');               // 기타 프로젝트 절도 프로젝트 묶음처럼 늘어난 상태(프로젝트명 줄은 없음, 바로 가기의 [기타 프로젝트]에 밑줄)
      let cur = -1, curExt = false, curCore = false;
      const update = () => {
        if (matchMedia('print').matches) return;
        const topH = headBottom(head), extB = topH + (parseFloat(getComputedStyle(head).getPropertyValue("--ext-bg")) || 37);
        // 늘어난 상태: 첫 프로젝트 묶음 위 끝부터 기타 프로젝트 절(없으면 마지막 묶음) 아래 끝까지 한 구간 — 묶음 사이의 바깥 여백에서도 줄어들지 않게
        const zTop = groups[0].g.getBoundingClientRect().top, zBottom = (others || groups[groups.length - 1].g).getBoundingClientRect().bottom;
        const ext = zTop <= extB + 1 && zBottom > extB;
        let act = -1, inCore = false;
        for (const x of groups) {
          const gr = x.g.getBoundingClientRect();
          if (gr.top <= extB + 1 && gr.bottom > extB) {
            if (x.h2.getBoundingClientRect().bottom <= extB) act = x.i;
            const ct = x.core ? x.core.getBoundingClientRect().top : Infinity;
            inCore = ct <= extB + 1;                                        // 기능 소개가 머리 막대 아래에 붙어 고정되기 시작할 때
            break;
          }
        }
        if (act !== cur) { bars.forEach((b, i) => b.classList.toggle('on', i === act)); head.classList.toggle('titled', act >= 0); cur = act; }
        if (ext !== curExt) { head.classList.toggle('ext', ext); curExt = ext; }
        if (inCore !== curCore) { head.classList.toggle('in-core', inCore); curCore = inCore; }
      };
      update();
      addEventListener('scroll', update, { passive: true });
      addEventListener('resize', update);
      document.fonts?.ready.then(update);
    }
    function SecHead({ en, title, right, big }) {
      return (
        <div className={'sec-head' + (big ? ' big' : '')}>
          <div><p className="eyebrow">{en}</p><h2>{title}</h2></div>
          {right && <p className="sec-r">{right}</p>}
        </div>
      );
    }

    // ── 주소로 절 바로 가기(예전 포트폴리오 덱 주소 #s=… 도 같은 절로) · 새로고침하거나 뒤로 돌아오면 읽던 위치로 ──
    const POS = `pf-portfolio-y:${location.pathname}`;
    try { history.scrollRestoration = 'manual'; } catch {}
    addEventListener('pagehide', () => { try { sessionStorage.setItem(POS, String(Math.round(scrollY))); } catch {} });
    function hashTarget(projects) {
      let h = location.hash.slice(1);
      try { h = decodeURIComponent(h); } catch {}
      if (!h) return '';
      const nth = (n) => info.sections[Math.max(1, Math.min(info.sections.length, n)) - 1] || '';
      if (/^-?\d+$/.test(h)) return nth(+h);
      const m = /^s=(.+)$/.exec(h);
      if (m) h = m[1].replace(/^(stack|glance)-\d+$/, '$1');
      const sn = /^s-(\d+)$/.exec(h);
      if (sn) return nth(+sn[1]);
      return { skills: 'stack', projects: projects[0] ? `p-${projects[0].id}` : '', summary: 'glance' }[h] ?? h;
    }
    function goHash(projects) {
      const want = hashTarget(projects), el = want && document.getElementById(want);
      if (!el) return '';
      el.scrollIntoView({ behavior: 'instant', block: 'start' });
      return want;
    }

    // 머리 막대 메뉴의 지금 절 표시: 머리 막대 바로 아래(화면 위 30%)에 걸친 절의 메뉴를 .on. 프로젝트 소개·기능 소개는 모두 [프로젝트], 맨 위 머리(cover)는 [소개], 맨 아래까지 내리면 마지막 절
    function bindNavSpy() {
      const links = [...document.querySelectorAll('.nav-a[data-nav]')];
      if (!links.length) return;
      const proj = links.find((a) => a.dataset.nav.startsWith('p-'));
      const secs = [...document.querySelectorAll('#cover, #intro, #stack, section.sec.proj, section.sec.core, #others, #glance, #contact')]
        .map((el) => [el, /^p-/.test(el.id) || el.id === 'others' ? proj : links.find((a) => a.dataset.nav === (el.id === 'cover' ? 'intro' : el.id))]).filter(([, a]) => a);
      let cur = null, raf = 0;
      const update = () => {
        raf = 0;
        const y = innerHeight * 0.3;
        let hit = null;
        for (const [el, a] of secs) if (el.getBoundingClientRect().top <= y) hit = a;
        if (secs.length && innerHeight + scrollY >= html.scrollHeight - 2) hit = secs[secs.length - 1][1];
        if (hit === cur) return;
        cur?.classList.remove('on'); cur?.removeAttribute('aria-current');
        cur = hit;
        cur?.classList.add('on'); cur?.setAttribute('aria-current', 'location');
        const nav = cur?.parentElement;                                  // 좁은 화면에서 메뉴가 넘치면 지금 절이 보이게(메뉴만 옆으로, 페이지 스크롤은 건드리지 않음)
        if (nav && nav.scrollWidth > nav.clientWidth) {
          const l = cur.offsetLeft - nav.offsetLeft, r = l + cur.offsetWidth;
          if (l < nav.scrollLeft) nav.scrollLeft = l - 8; else if (r > nav.scrollLeft + nav.clientWidth) nav.scrollLeft = r - nav.clientWidth + 8;
        }
      };
      addEventListener('scroll', () => { raf ||= requestAnimationFrame(update); }, { passive: true });
      addEventListener('resize', () => { raf ||= requestAnimationFrame(update); });
      update();
    }

    // 프로젝트 바로 가기(.nh-pm): 오른쪽 끝을 위 메뉴의 오른쪽 끝에 맞추고(--pm-r), 넓이(--pm-w)를 프로젝트명 줄에 알려 줌.
    //   마우스를 올릴 수 있는 화면에서 메뉴 [프로젝트]에 올리거나 키보드로 가면 .pm-open(머리 막대에서 벗어나면 닫힘). 지금 보고 있는 프로젝트(기타 프로젝트)는 .on
    function bindProjMenu() {
      const head = document.querySelector('.site-head'), list = head?.querySelector('.nh-pm-l');
      if (!list) return;
      const row = head.firstElementChild, nav = row.querySelector('nav'), opener = nav.querySelector('[data-pm-open]');
      const measure = () => {
        const rr = row.getBoundingClientRect(), pr = parseFloat(getComputedStyle(row).paddingRight) || 0;
        head.style.setProperty('--pm-r', `${Math.max(0, Math.round(rr.right - pr - nav.getBoundingClientRect().right))}px`);
        head.style.setProperty('--pm-w', `${Math.ceil(list.scrollWidth)}px`);
      };
      measure(); addEventListener('resize', measure); document.fonts?.ready.then(measure);
      const canHover = matchMedia('(hover: hover) and (pointer: fine)');
      let timer = 0;
      const open = () => { clearTimeout(timer); head.classList.add('pm-open'); };
      const close = (delay = 160) => { clearTimeout(timer); timer = setTimeout(() => head.classList.remove('pm-open'), delay); };
      opener?.addEventListener('mouseenter', () => { if (canHover.matches) open(); });
      list.addEventListener('mouseenter', () => { if (head.classList.contains('pm-open')) open(); });
      head.addEventListener('mouseleave', () => close());
      opener?.addEventListener('focus', () => { if (opener.matches(':focus-visible')) open(); });
      head.addEventListener('focusout', (e) => { if (!head.contains(e.relatedTarget)) close(0); });
      head.addEventListener('keydown', (e) => { if (e.key === 'Escape' && head.classList.contains('pm-open')) { close(0); opener?.focus(); } });
      // 지금 보고 있는 프로젝트: 늘어난 머리 막대의 아래 끝에 걸친 프로젝트 소개·기능 소개·기타 프로젝트(막대의 프로젝트명과 같은 기준)
      const links = [...list.querySelectorAll('a[data-pm]')];
      const secs = [...document.querySelectorAll('section.sec.proj, section.sec.core, #others, #glance, #contact')];
      let cur = null, raf = 0;
      const update = () => {
        raf = 0;
        const y = headBottom(head) + (parseFloat(getComputedStyle(head).getPropertyValue('--ext-bg')) || 37) + 1;
        let id = '';
        for (const el of secs) if (el.getBoundingClientRect().top <= y) id = el.id.replace(/-core$/, '');
        const hit = links.find((a) => a.dataset.pm === id) || null;
        if (hit === cur) return;
        cur?.classList.remove('on'); cur?.removeAttribute('aria-current');
        cur = hit;
        cur?.classList.add('on'); cur?.setAttribute('aria-current', 'location');
        if (cur && list.scrollWidth > list.clientWidth) {                // 휴대폰에서 넘치면 지금 프로젝트가 보이게(바로 가기만 옆으로)
          const l = cur.offsetLeft - list.offsetLeft, r = l + cur.offsetWidth;
          if (l < list.scrollLeft) list.scrollLeft = l - 8; else if (r > list.scrollLeft + list.clientWidth) list.scrollLeft = r - list.clientWidth + 8;
        }
      };
      addEventListener('scroll', () => { raf ||= requestAnimationFrame(update); }, { passive: true });
      addEventListener('resize', () => { raf ||= requestAnimationFrame(update); });
      update();
    }

    // ① 머리 막대(layout: nav sticky) + 화면 모드 · PDF
    function Nav({ prof, projects, others, hasSkills, bars, otherLabel }) {
      const items = [['intro', t('page.nav-intro'), prof.intro], ['stack', t('page.nav-stack'), hasSkills],
        [projects[0] ? `p-${projects[0].id}` : '', t('page.nav-projects'), projects.length],   // 기타 프로젝트는 [프로젝트] 아래 바로 가기(.nh-pm)에만
        ['glance', t('page.nav-glance'), projects.length], ['contact', t('page.nav-contact'), true]].filter((x) => x[0] && x[2]);
      return (<>
        <div className="top-tools no-print"><div className="wrap top-tools-w"><div><ModeButton /><PdfButton name={prof.name} /></div></div></div>
        <header className="site-head no-print sticky top-0 z-50">
          <div className="wrap relative flex h-14 items-center gap-4">
            <a href="#cover" className="font-semibold tracking-tight whitespace-nowrap">{prof.name || t('name.portfolio')}</a>
            <nav className="noscroll ml-auto flex min-w-0 gap-4 md:gap-6 overflow-x-auto text-[13px] text-[var(--muted)]" aria-label="절 이동">
              {items.map(([id, label]) => <a key={id} href={`#${id}`} data-nav={id} data-t={label} className="nav-a whitespace-nowrap hover:text-[var(--ink)]" {...(id.startsWith('p-') ? { 'data-pm-open': '' } : {})}>{label}</a>)}
            </nav>
            <div className="nh-tools-space" aria-hidden="true" />
          </div>
          <div className="nh-ext" aria-hidden="true"><div className="wrap nh-ext-w">
            {bars.map((b, i) => b && (
              <div key={i} className="nh-bar">
                <p className="eyebrow nh-eb">{b.eyebrow}</p>
                <p className="nh-title">{b.title}{b.sub && <span className="nh-sub"> · {b.sub}</span>}</p>
              </div>
            ))}
          </div></div>
          {projects.length > 0 && (
            <div className="nh-pm"><div className="wrap nh-pm-w">
              <nav className="nh-pm-l noscroll" aria-label="프로젝트 바로 가기">
                {projects.map((p) => <a key={p.id} href={`#p-${p.id}`} data-pm={`p-${p.id}`} data-t={p.title} className="nav-a whitespace-nowrap hover:text-[var(--ink)]">{p.title}</a>)}
                {others.length > 0 && <a href="#others" data-pm="others" data-t={otherLabel} className="nav-a whitespace-nowrap hover:text-[var(--ink)]">{otherLabel}</a>}
              </nav>
            </div></div>
          )}
        </header>
      </>);
    }

    // ② 머리(layout: stack · 가운데 · 화면 높이 0.95)
    // 첫 화면 대표 화면 줄: 프로젝트 대표 화면(cover)을 나란히 — 살짝 뒤로 눕힌 줄, 바깥 두 장은 조금 작고 흐리게, 뒤로 화면 색이 번짐.
    //   그림을 누르면 그 프로젝트 소개로. 화면에서만(인쇄·PDF는 빠짐)
    // 공용 규칙 그림 링크(.img-link)의 판: [자세히 보기 + 아이콘] — 아이콘은 링크 규칙대로(외부 주소면 상자, 아니면 ↗)
    const ImgMore = ({ href = '' }) => <span className="img-more" aria-hidden="true">자세히 보기<Icon name={/^https?:\/\//i.test(href) ? 'ext' : 'inner'} /></span>;
    // 번짐 세기 맞추기: 대표 화면마다 밝기가 크게 달라(밝은 초록 화면 하나만 번짐이 튀어 보임) 그림의 평균 밝기(상대 휘도)를 재서
    //   모두 같은 밝기(GLOW_LUM)로 번지게 brightness를 곱함 — 밝은 그림은 낮추고(최소 0.2배) 어두운 그림은 올림(최대 3배)
    const GLOW_LUM = 0.14;
    function balanceGlow(e) {
      const im = e.currentTarget;
      try {
        const c = document.createElement('canvas'); c.width = 32; c.height = 24;
        const x = c.getContext('2d', { willReadFrequently: true }); x.drawImage(im, 0, 0, 32, 24);
        const d = x.getImageData(0, 0, 32, 24).data, lin = (v) => { v /= 255; return v <= .04045 ? v / 12.92 : Math.pow((v + .055) / 1.055, 2.4); };
        let L = 0; for (let i = 0; i < d.length; i += 4) L += .2126 * lin(d[i]) + .7152 * lin(d[i + 1]) + .0722 * lin(d[i + 2]);
        L /= d.length / 4;
        im.style.setProperty('--gb', Math.min(3, Math.max(.2, GLOW_LUM / Math.max(L, .001))).toFixed(2));   // CSS의 filter가 brightness(var(--gb))로 씀(휴대폰은 흐림과 함께)
      } catch {}                                                         // 그림을 읽지 못하면(다른 주소 등) 그대로
    }
    // 휴대폰: 대표 화면을 한 장씩 자동으로 넘김(3.5초). 마지막 다음에는 왼쪽으로 쭉 되돌아가 첫 그림으로(.rewind).
    //   화면 밖이거나 탭이 숨겨졌거나 '움직임 줄이기'면 멈춤
    const CV_MOBILE = '(max-width: 759px)', CV_EVERY = 3500;
    function CoverScreens({ projects }) {
      const ps = projects.filter((p) => p.cover).slice(0, 4), n = ps.length;
      const [i, setI] = useState(0), [turn, setTurn] = useState(0);   // turn: 넘어간 횟수 — 짝수·홀수로 채움 키프레임(a·b)을 번갈아 처음부터 다시
      const box = useRef(null), back = useRef(false);
      const move = (k) => { setI(k); setTurn((t) => t + 1); };
      useEffect(() => {                                                 // 그림이 바뀔 때마다(점을 눌러 옮긴 때도) 3.5초를 새로 셈 — 점 막대가 차오르는 시간과 같게
        if (n < 2) return;
        const mq = matchMedia(CV_MOBILE), still = matchMedia('(prefers-reduced-motion: reduce)');
        let t = 0;
        const step = () => {
          const r = box.current?.getBoundingClientRect();
          if (!mq.matches || still.matches || document.hidden || !r || r.bottom < 0 || r.top > innerHeight) { t = setTimeout(step, 600); return; }   // 넘길 수 없을 때는 막대가 찬 채로 기다렸다가 보이면 바로 넘김
          back.current = i >= n - 1; move(back.current ? 0 : i + 1);
        };
        t = setTimeout(step, CV_EVERY);
        return () => clearTimeout(t);
      }, [i, n]);
      if (n < 2) return null;
      const go = (k) => { if (k === i) return; back.current = false; move(k); };
      return (
        <div ref={box} className="cv-screens no-print reveal" style={{ '--cv-n': n, '--cv-every': `${CV_EVERY}ms`, '--cv-fill': turn % 2 ? 'cv-fill-b' : 'cv-fill-a' }}>
          <div className="cv-glow" aria-hidden="true">{ps.map((p, k) => <img key={p.id} className={k === i ? 'on' : undefined} src={img(p, p.cover)} alt="" decoding="async" onLoad={balanceGlow} />)}</div>
          <ul className={'cv-row' + (back.current ? ' rewind' : '')} style={{ '--cv-i': i }}>
            {ps.map((p) => (
              <li key={p.id}><a href={`#p-${p.id}`} className="cv-shot img-link" aria-label={`${p.title} 프로젝트 소개로`}>
                <img src={img(p, p.cover)} alt={`${p.title} 대표 화면`} decoding="async" />
                <ImgMore href={`#p-${p.id}`} />
              </a></li>
            ))}
          </ul>
          <div className="cv-dots" role="group" aria-label="대표 화면 고르기">
            {ps.map((p, k) => <button key={p.id} type="button" className={k === i ? 'on' : undefined} aria-label={`${p.title} 화면 보기`} aria-current={k === i || undefined} onClick={() => go(k)}><i><b /></i></button>)}
          </div>
        </div>
      );
    }
    // 정해 둔 줄바꿈은 각 줄이 한 줄에 다 들어갈 때만 지킴 — 화면이 좁아 어느 줄이든 넘치면 줄바꿈 없이 이어 씀
    //   (억지로 나눈 줄 + 저절로 넘친 줄이 겹쳐 낱말 하나만 남는 줄이 생기지 않게). 첫 화면 한 줄 정체성 · 자기소개 문단에서 씀
    function FitLines({ lines, className }) {
      const box = useRef(null);
      const [keep, setKeep] = useState(false);
      const key = lines.join('\n');
      useLayoutEffect(() => {                                           // 화면에 그리기 전에 재서 정함 — 처음엔 이어 쓴 줄이 보였다가 나중에 줄이 바뀌지 않게
        const el = box.current;
        if (!el || lines.length < 2) return;
        const fits = () => {
          const probe = document.createElement('span');
          probe.style.cssText = 'position:absolute;visibility:hidden;white-space:nowrap;left:0;top:0';
          el.appendChild(probe);
          const w = el.clientWidth, ok = lines.every((t) => { probe.textContent = t.replace(/\*\*|`/g, ''); return probe.getBoundingClientRect().width <= w; });
          probe.remove();
          setKeep(ok);
        };
        fits();
        const ro = new ResizeObserver(fits); ro.observe(el);
        document.fonts?.ready.then(fits);
        return () => ro.disconnect();
      }, [key]);
      return (
        <p ref={box} className={'relative ' + className}>
          {keep ? lines.map((l, j) => <Fragment key={j}>{j ? <br /> : null}<Inline text={l} /></Fragment>) : <Inline text={lines.join(' ')} />}
        </p>
      );
    }
    // 한 줄 정체성(profile.md)은 이 낱말 뒤에서 두 줄로(두 줄 모두 한 줄에 들어갈 때만)
    const HEADLINE_BREAK_AFTER = '만드는';
    // 첫 화면 캡슐 바의 출발 높이(--cap-rise = 제자리 → 화면 아래 끝 밖). 새로고침·# 주소로 아래 절에서 열려 캡슐이 화면에 다 들어 있지 않으면
    //   올라오는 길이 다른 절 위를 지나가 보이므로 등장 연출 없이 제자리에 둠(.no-intro, 한 번 끄면 다시 켜지 않음)
    function heroRise(el) {
      if (!el || el.classList.contains('no-intro') || !innerHeight) return;   // 창 높이를 못 잴 때(숨은 창)는 판단하지 않음
      let top = 0; for (let n = el; n; n = n.offsetParent) top += n.offsetTop;   // 페이지 맨 위에서 제자리까지(움직이는 중의 위치 이동은 빼고)
      const y = top - scrollY;
      if (y < 0 || y + el.offsetHeight > innerHeight) { el.classList.add('no-intro'); return; }
      el.style.setProperty('--cap-rise', `${innerHeight - y + el.offsetHeight}px`);
      // 직접 추가: 화면 아래 끝이 ABOUT ME 머리말(#intro .eyebrow) 위쪽 끝을 넘으면 솟아오르기를 건너뜀(.no-rise — 올라오는 길이 ABOUT ME 위를 지나가 보이므로).
      //   애니메이션이 실제로 움직이기 시작한 뒤에는 바꾸지 않음(창 크기를 바꿔도 다시 재생되지 않게). 로딩 그레이박스가 덮는 동안은 멈춰 있어(0ms) 그때까지는 다시 판단
      const started = el.getAnimations?.().some((a) => (+a.currentTime || 0) > 0);
      const ab = document.querySelector('#intro .eyebrow');
      if (ab && !started) {
        let abTop = 0; for (let n = ab; n; n = n.offsetParent) abTop += n.offsetTop;
        el.classList.toggle('no-rise', abTop - scrollY < innerHeight);
      }
    }
    const headlineLines = (text) => { const i = text.indexOf(HEADLINE_BREAK_AFTER + ' '); return i < 0 ? [text] : [text.slice(0, i + HEADLINE_BREAK_AFTER.length), text.slice(i + HEADLINE_BREAK_AFTER.length + 1)]; };
    function Cover({ pf, prof, projects = [] }) {
      const links = (prof.links || []).filter((l) => isUrl(l.url));
      const screens = projects.filter((p) => p.cover).length >= 2;      // 대표 화면 줄이 있으면 넓은 화면에서 첫 화면을 창 높이에 맞춤(.cv-fit)
      // 첫 화면 캡슐 바: 프로젝트 캡슐처럼 펼치는 데 쓸 높이 · 펼친 폭 · 첫 버튼 폭을 잼 — 그리기 전에 한 번(펼침은 0.3초 뒤 시작),
      //   글꼴을 받은 뒤 · 화면 크기가 바뀔 때 다시(펼친 뒤에도 점이 첫 버튼 폭에 남아 있어서)
      const pill = useRef(null);
      useLayoutEffect(() => {
        const measure = () => {
          const el = pill.current, b1 = el?.querySelector('.cap-row .btn');
          if (!el) return;
          el.style.setProperty('--cap-h', `${el.offsetHeight}px`);
          el.style.setProperty('--cap-w', `${el.offsetWidth}px`);
          if (b1) el.style.setProperty('--b1', `${b1.offsetWidth}px`);
          heroRise(el);
        };
        measure();
        document.fonts?.ready.then(measure);
        addEventListener('resize', measure);
        const lift = () => heroRise(pill.current);                       // 직접 추가: 로딩 그레이박스가 걷히기 직전(읽던 위치로 옮긴 뒤) 다시 판단 — 아래 절·ABOUT ME가 보이는지
        addEventListener('pf-skel-lift', lift);
        return () => { removeEventListener('resize', measure); removeEventListener('pf-skel-lift', lift); };
      }, []);
      return (
        <section id="cover" className={'flex min-h-[95vh] items-center text-center' + (screens ? ' cv-fit' : '')}>
          <div className={'wrap w-full ' + (screens ? 'py-16 md:py-12' : 'py-24')}>
            <p className="eyebrow">{t('en.portfolio')}</p>
            <h1 className="mt-6 text-6xl md:text-8xl font-bold tracking-tight leading-none">{prof.name}</h1>
            {prof.nameEn && <p lang="en" className="mt-4 text-sm md:text-base tracking-[.3em] text-[var(--sub)]">{prof.nameEn}</p>}
            {prof.headline && <FitLines lines={headlineLines(prof.headline)} className="mx-auto mt-10 max-w-[760px] text-2xl md:text-4xl font-semibold leading-snug tracking-tight" />}
            {screens && <div className="cv-stage"><CoverScreens projects={projects} /></div>}
            {(() => {                                                    // 캡슐 바: GitHub → 기타 링크(YouTube 등) → Email 순서, 첫 버튼만 강조색
              const items = [isUrl(prof.github) && ['GitHub', prof.github, true], ...links.map((l) => [l.label, l.url, true]),
                prof.email && ['Email', `mailto:${prof.email}`, false]].filter(Boolean);
              return items.length > 0 && (
                <div className={(screens ? '' : 'mt-16 md:mt-20 ') + 'flex justify-center'}>
                  <nav ref={pill} className="hero-pill" aria-label="연락처 링크">
                    <span className="cap-body" aria-hidden="true"><span className="cb-full" /><span className="cb-ring cb-ring-l" /><span className="cb-ring cb-ring-r" /></span>
                    <span className="cap-dot" aria-hidden="true" />
                    <div className="cap-row noscroll">
                    {items.map(([k, href, ext], i) => ext
                      ? <Ext key={href} className={'btn' + (i ? '' : ' btn-solid')} href={href}>{k}</Ext>
                      : <a key={href} className={'btn' + (i ? '' : ' btn-solid')} href={href} title={href.slice(7)}>{k}</a>)}
                  </div></nav>
                </div>
              );
            })()}
            <div className="mx-auto inline-block text-left">
              <PrintUrls rows={[isUrl(prof.github) && ['GitHub', prof.github], ...links.map((l) => [l.label, l.url]),
                prof.email && [t('page.print-email'), `mailto:${prof.email}`], [t('page.print-web'), PAGE_URL]]} />
            </div>
          </div>
        </section>
      );
    }

    // ③ 자기소개(layout: stack · 가운데)
    //   profile.md 자기소개에 빈 줄이 있으면 빈 줄 = 문단 나눔, 문단 안의 줄바꿈 = 그 자리에서 줄바꿈(<br>).
    //   빈 줄이 없으면 예전처럼 한 줄 = 한 문단. 첫 문단은 크게, 나머지는 작게.
    function introParas(intro) {
      const raw = String(intro || '').trim();
      const paras = /\n[ \t]*\n/.test(raw) ? raw.split(/\n[ \t]*\n+/) : raw.split(/\n+/);
      return paras.map((p) => p.split('\n').map((l) => l.trim()).filter(Boolean)).filter((p) => p.length);
    }
    function Intro({ prof }) {
      if (!prof.intro) return null;
      return (
        <section id="intro" className="pb-24 md:pb-36 pt-[calc(6rem_-_5mm)] md:pt-[calc(9rem_-_5mm)]">
          <div className="wrap reveal text-center">
            <p className="eyebrow">{t('en.about')}</p>
            <h2 className="sr-only">{t('page.intro')}</h2>
            <div className="mx-auto mt-8 max-w-[880px] space-y-5">
              {introParas(prof.intro).map((para, i) =>
                <FitLines key={i} lines={para} className={i ? 'text-lg md:text-xl leading-relaxed text-[var(--muted)]' : 'text-2xl md:text-4xl font-semibold leading-snug tracking-tight'} />)}
            </div>
            {/* 자기소개서 전문(letter.html — 자기소개서.md를 프로젝트 문서와 같은 모양으로) 글자 링크. 화면에서만(인쇄·PDF는 빠짐) */}
            <p className="no-print mt-10 text-base md:text-lg"><Ext className="tlink text-[var(--muted)]" href="letter.html">자기소개서 전문</Ext></p>
          </div>
        </section>
      );
    }

    // ④ 기술 스택(3열 · 아이콘 + 기술 이름 + 근거 줄 · tinted) — 머리 막대 늘어남
    // ── 프로젝트 소개는 화면 모드와 상관없이 정해진 테마 색 ──
    //   기본은 어두운 테마. INTRO_THEME에 적은 프로젝트(폴더 이름)는 그 테마로. 그 모드의 색 값을 읽어 절에 고정(화면 모드를 바꿔도 이 절은 그대로).
    //   인쇄는 CSS가 흰 종이 색으로 덮음
    const INTRO_THEME = {};                                            // 예: { '4-SichuanSung': 'light' } — 그 프로젝트 소개만 밝은 테마로
    const INTRO_LIFT = ['4-SichuanSung'];                              // 공용 규칙 .text-lift(글자 띄우기)를 붙일 프로젝트 소개 — 대표 이미지가 밝아 글자가 묻히는 곳만
    function pinIntroDark() {
      const keys = ['--bg', '--band', '--card', '--line', '--ink', '--muted', '--sub', '--accent', '--accent-ink', '--divider', '--meta-label'];
      const read = (mode) => {
        const cur = html.dataset.pfMode;
        if (mode === 'light') html.dataset.pfMode = 'light'; else delete html.dataset.pfMode;
        const cs = getComputedStyle(html), v = keys.map((k) => [k, cs.getPropertyValue(k).trim()]);
        if (cur) html.dataset.pfMode = cur; else delete html.dataset.pfMode;
        return v;
      };
      const vals = { dark: read('dark'), light: read('light') };
      document.querySelectorAll('.sec.proj').forEach((sec) => {
        const mode = INTRO_THEME[sec.id.replace(/^p-/, '')] === 'light' ? 'light' : 'dark';
        vals[mode].forEach(([k, v]) => v && sec.style.setProperty(k, v));
        sec.style.colorScheme = mode; sec.style.color = 'var(--ink)';
        sec.dataset.introTheme = mode;
        sec.classList.toggle('text-lift', INTRO_LIFT.includes(sec.id.replace(/^p-/, '')));
      });
    }

    // ── 흐린 배경의 중심을 대표 이미지 카드 중심에 맞춤 ──
    //   카드 중심을 기준으로, 그 점에서 절의 가장 먼 끝보다 260px 더 덮을 만큼 그림을 키워 놓음(흐림 가장자리가 절 안에 보이지 않게) → 카드 둘레에 그 그림 가장자리 색이 번짐
    function bindBackdrop() {
      const items = [...document.querySelectorAll('.sec.proj')].map((sec) => ({ sec, bg: sec.querySelector('.proj-backdrop img'), card: sec.querySelector('.cover-fade .shot') })).filter((x) => x.bg && x.card);
      if (!items.length) return;
      const place = ({ sec, bg, card }) => {
        const sr = sec.getBoundingClientRect(), cr = card.getBoundingClientRect();
        if (!sr.width || !cr.width) return;
        const rv = card.closest('.reveal'), ty = rv ? new DOMMatrix(getComputedStyle(rv).transform).m42 : 0;   // 떠오르기 전 밀린 만큼 빼고
        const cx = cr.left + cr.width / 2 - sr.left, cy = cr.top - ty + cr.height / 2 - sr.top;
        const ar = (bg.naturalWidth && bg.naturalHeight) ? bg.naturalWidth / bg.naturalHeight : 4 / 3;
        let w = 2 * (Math.max(cx, sr.width - cx) + 260), h = 2 * (Math.max(cy, sr.height - cy) + 260);   // 흐림(80px)이 그림 끝에서 투명해지는 폭보다 넉넉히 → 절 끝까지 꽉 채움
        if (w / h < ar) w = h * ar; h = w / ar;
        Object.assign(bg.style, { left: `${cx}px`, top: `${cy}px`, width: `${w}px`, height: `${h}px` });
      };
      const all = () => items.forEach(place);
      all();
      items.forEach((x) => { x.bg.addEventListener('load', () => place(x), { once: true }); x.card.closest('.reveal')?.addEventListener('animationend', () => place(x)); });
      let t = 0; addEventListener('resize', () => { clearTimeout(t); t = setTimeout(all, 120); });
      addEventListener('load', all); document.fonts?.ready.then(all); setTimeout(all, 900); setTimeout(all, 2500);
    }

    // ── 프로젝트 링크 캡슐 ──
    function LinkCapsule({ p, inline }) {
      const L = p.links || {};
      return (
        <div className={'cap' + (inline ? ' cap-inline' : '')}>
          <nav className="cap-pill" aria-label={`${p.title} 링크`} data-extra={(L.extra || []).some((l) => isUrl(l.url)) ? '' : undefined}>
            <span className="cap-body" aria-hidden="true"><span className="cb-full" /><span className="cb-ring cb-ring-l" /><span className="cb-ring cb-ring-r" /></span>
            <span className="cap-dot" aria-hidden="true" />
            <div className="cap-row noscroll">
            {/* 순서: 시연 영상 → 상세 문서 → 슬라이드 → GitHub(저장소) → 그 밖의 링크. 맨 앞 버튼만 강조색(점이 이 버튼으로 늘어남) */}
            {[isUrl(L.video) && [projectVideoName(p), L.video], [t('name.doc'), docHref(p)], [t('name.deck'), deckHref(p)], ...repoLinks(p), ...otherLinks(p)]
              .filter(Boolean).map(([k, u], i) => <Ext key={u} className={'btn' + (i === 0 ? ' btn-solid' : '')} href={u}>{k}</Ext>)}
          </div></nav>
        </div>
      );
    }
    //   앞 프로젝트의 캡슐이 화면에서 사라지면 .on(동그라미로 솟아올라 펼쳐짐), 위로 스크롤해 앞 캡슐이 다시 보이면 .out(접혀서 가라앉음)(첫 프로젝트는 같은 지점으로 계산).
    //   위로 스크롤하다 묶음이 다시 화면에 들어오면 펼침 없이 이미 제자리(.still — 다시 사라질 때까지 붙여 둠. 떼는 순간 펼침이 다시 시작되지 않게).
    function bindCaps() {
      const items = [...document.querySelectorAll('.pg')].map((g) => ({ g, cap: g.querySelector('.cap:not(.cap-inline)'), intro: g.querySelector('.sec.proj'), on: false })).filter((x) => x.cap);
      if (!items.length) return;
      // 고정 기능 소개 끝에 맞출 캡슐 높이(--cap-h) + 펼침에 쓸 펼친 폭(--cap-w) · 첫 버튼 폭(--b1). 펼치거나 접는 중에는 폭을 재지 않음(움직이는 중의 폭이 잡히지 않게)
      const measure = () => items.forEach(({ cap }) => {
        cap.style.setProperty('--cap-h', `${cap.offsetHeight}px`);
        if (cap.getAnimations?.({ subtree: true }).some((a) => a.playState === 'running')) return;
        const pill = cap.querySelector('.cap-pill'), b1 = pill?.querySelector('.cap-row .btn');
        if (pill) cap.style.setProperty('--cap-w', `${pill.getBoundingClientRect().width}px`);
        if (b1) cap.style.setProperty('--b1', `${b1.getBoundingClientRect().width}px`);   // 점이 늘어날 첫 버튼 폭
      });
      measure(); addEventListener('resize', measure); document.fonts?.ready.then(measure);
      const motion = () => matchMedia('(min-width: 760px)').matches && !matchMedia('(prefers-reduced-motion: reduce)').matches;
      const rows = [...document.querySelectorAll('.cap-row')];             // 버튼 줄이 넘치면 아직 남은 쪽 끝을 흐림(프로젝트 소개 안 캡슐 포함)
      const fade = (r) => {
        const max = r.scrollWidth - r.clientWidth, l = max > 1 && r.scrollLeft > 1, rt = max > 1 && r.scrollLeft < max - 1;
        r.classList.toggle('fl', l); r.classList.toggle('fr', rt);
        r.parentElement?.classList.toggle('al', l); r.parentElement?.classList.toggle('ar', rt);   // 캡슐에 화살표(휴대폰)
      };
      // 캡슐 최대 폭: 추가 링크가 없는 캡슐 중 가장 넓은 것의 폭(화면 폭에 따라 버튼 크기가 달라서 그때마다 다시 잼)
      const capMax = () => {
        html.style.removeProperty('--cap-max');
        const ws = [...document.querySelectorAll('.cap-pill:not([data-extra])')].map((p) => p.offsetWidth).filter(Boolean);
        if (ws.length) html.style.setProperty('--cap-max', `${Math.max(...ws)}px`);
        rows.forEach(fade);
      };
      rows.forEach((r) => r.addEventListener('scroll', () => fade(r), { passive: true }));
      capMax(); addEventListener('resize', capMax);
      document.fonts?.ready.then(capMax);
      let lastY = scrollY, booted = false;
      const update = () => {
        if (matchMedia('print').matches) return;
        const up = scrollY < lastY; lastY = scrollY;
        const settling = !booted || html.classList.contains('pf-settling');   // 처음 그릴 때 · 새로고침해 읽던 위치로 옮기는 동안: 연출 없이 바로 그 상태로
        items.forEach((x, j) => {
          const { g, cap, intro } = x;
          const r = g.getBoundingClientRect();
          // 앞 프로젝트의 캡슐이 화면 위로 완전히 사라지면 나타남. 첫 프로젝트(앞 캡슐 없음)는 같은 지점 = 소개 절 위 끝이 '캡슐 아래 여백'만큼 내려온 때
          const prev = items[j - 1]?.cap;
          const gate = prev ? prev.getBoundingClientRect().bottom <= 0 : (intro || g).getBoundingClientRect().top <= (parseFloat(getComputedStyle(cap).marginBottom) || 0);
          const on = r.bottom > 0 && gate;
          if (on && !x.on && (up || settling)) cap.classList.add('still');              // 위로 스크롤해 묶음 아래 끝이 다시 들어올 때: 펼침 없이 바로 제자리
          if (on) { clearTimeout(x.t); cap.classList.remove('out'); }
          else if (x.on) {                                               // 사라질 때: 접혀서 가라앉는 동안(.55초)만 .out
