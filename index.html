            </div>
            {p.intent?.text && (
              <div className="reveal mt-14 md:mt-20 max-w-[820px]">
                <p className="eyebrow">{t('en.intent')}</p>
                <p className="mt-4 text-lg md:text-xl leading-relaxed text-[var(--muted)]"><Inline text={p.intent.text} /></p>
              </div>
            )}
            {(p.highlights || []).length > 0 && <LinkCapsule p={p} inline />}{/* 휴대폰만: 프로젝트 소개 맨 아래 캡슐(기능 소개가 없으면 바로 뒤 캡슐 하나로) */}
            <PrintUrls rows={projectUrlRows(p)} />
          </div>
        </section>
      );
    }

    // ⑥ 기능 소개(목록 + 고정된 큰 그림) — 넓은 화면: 기능 소개 전체가 머리 막대 아래에 붙어 있고(.fe-pin), 스크롤한 만큼(진척도) 현재 기능이 바뀜.
    //   현재 기능은 [번호 · 제목 · 설명 · 슬라이드 버튼]을 펼치고, 나머지는 번호 · 제목만 흐리게. 오른쪽 큰 그림은 현재 기능 화면으로. 흐린 기능을 누르면 그 기능으로 스크롤.
    //   760px 미만·인쇄: 기능마다 [그림 → 글] 한 열, 모두 펼침
    function Features({ p, no }) {
      const hl = (p.highlights || []).slice(0, 5);   // 빌드는 2~4개를 고르고, 사용자가 직접 더한 다섯 번째까지 그림
      if (!hl.length) return null;
      const capOf = (h) => typeof h.image?.caption === 'string' ? h.image.caption : h.image?.caption?.text || '';
      return (
        <section id={`p-${p.id}-core`} className="sec core pt-[calc(6rem_-_5mm)] md:pt-[calc(8rem_-_5mm)]">
          <div className="wrap">
            <SecHead en={`${no} · ${t('page.features')}`} title={p.title} />
          </div>
          <div className="fe" style={{ '--fe-n': hl.length }}>
            <div className="fe-pin"><div className="wrap fe-grid">
              <ol className="fe-list">
                {hl.map((h, i) => {
                  const sid = deckSceneFor(p, h.section);
                  const cap = capOf(h);
                  return (
                    <li key={i} className={'fe-item' + (i === 0 ? ' on' : '')} data-fe={i}>
                      {h.image?.src && (
                        <figure className="fe-inline">
                          <div className="fe-img overflow-hidden rounded-2xl"><Shot src={img(p, h.image.src)} alt={cap || normTitle(h.title)} w={h.image.w} h={h.image.h} /></div>
                          {cap && <figcaption className="mt-3 text-xs text-[var(--sub)]"><Inline text={cap} /></figcaption>}
                        </figure>
                      )}
                      <button type="button" className="fe-head" data-fe-go={i} tabIndex={-1}>
                        <span className="eyebrow fe-no tabular-nums">{t('en.feature')} {pad2(i + 1)}</span>
                        <span className="fe-title"><Inline text={h.title} /></span>
                      </button>
                      <div className="fe-detail"><div className="fe-detail-in">
                        <p className="fe-what mt-3 text-[15px] leading-relaxed text-[var(--muted)]">{h.what && <Inline text={h.what} />}</p>
                        <div className="fe-links mt-3 flex flex-wrap gap-2">
                          <Ext className="btn btn-sm" href={deckHref(p, sid)} data-deck-scene={sid || 'start'}
                            aria-label={`${normTitle(h.title)} — ${t('page.see-in-deck')}`}>{t('page.see-in-deck')}</Ext>
                          <Ext className="btn btn-sm" href={docSecHref(p, i, h)}
                            aria-label={`${normTitle(h.title)} — ${t('page.see-in-doc')}`}>{t('page.see-in-doc')}</Ext>
                        </div>
                      </div></div>
                    </li>
                  );
                })}
              </ol>
              <div className="fe-pane" aria-hidden="true">
                <div className="fe-stage">
                  {hl.map((h, i) => h.image?.src && (
                    <figure key={i} className={'fe-shot m-0' + (i === 0 ? ' on' : i === 1 ? ' near' : '')} data-fe={i} style={{ '--d': i }}>
                      <div className="fe-img overflow-hidden rounded-3xl"><Shot src={img(p, h.image.src)} alt="" w={h.image.w} h={h.image.h} /></div>
                      {capOf(h) && <figcaption className="mt-3 text-xs text-[var(--sub)]"><Inline text={capOf(h)} /></figcaption>}
                    </figure>
                  ))}
                </div>
                <div className="fe-dots" style={{ '--fe-rows': hl.map((h, i) => (i === 0 ? '48px' : '8px')).join(' ') }}>
                  {hl.map((h, i) => <button key={i} type="button" tabIndex={-1} className={'fe-dot' + (i === 0 ? ' on' : '')} data-fe-go={i} title={`${t('en.feature')} ${pad2(i + 1)}`}><i /></button>)}
                </div>
              </div>
            </div></div>
          </div>
        </section>
      );
    }
    // ── 기능 제목+설명 높이 고정: 펼친 상태 제목 글꼴로 제목 줄 수를 재서, 설명 최소 높이 = 고정 영역(제목 1줄+설명 3줄, 2줄+2줄 중 큰 쪽) − 실제 제목 높이 ──
    function bindFeatureHeights() {
      const items = [...document.querySelectorAll('.fe-item')].map((it) => ({ title: it.querySelector('.fe-title'), what: it.querySelector('.fe-what') })).filter((x) => x.title && x.what);
      if (!items.length) return;
      const fit = () => items.forEach(({ title, what }) => {
        const wide = matchMedia('screen and (min-width: 760px)').matches;
        const fs = wide ? Math.min(24, Math.max(20, innerWidth * 0.02)) : Math.min(24, Math.max(20, innerWidth * 0.022));   // 펼친 상태 제목 크기(CSS clamp와 같게)
        const w = title.parentElement.getBoundingClientRect().width;
        const measure = (size) => {                                       // 그 글자 크기일 때 제목 높이·줄 높이
          const probe = title.cloneNode(true);
          Object.assign(probe.style, { position: 'absolute', visibility: 'hidden', left: '-9999px', top: '0', width: `${w}px`, fontSize: `${size}px`, height: 'auto', transition: 'none', display: 'block' });
          document.body.appendChild(probe);
          const r = { h: probe.getBoundingClientRect().height, lh: parseFloat(getComputedStyle(probe).lineHeight) || size * 1.35 }; probe.remove(); return r;
        };
        const on = measure(fs), tlh = on.lh, th = Math.ceil(on.h);    // 제목 칸 높이(--th-on)와 같은 올림 값으로 계산 → 항목마다 펼친 높이가 1px도 다르지 않게
        if (wide) { title.style.setProperty('--th-on', `${Math.ceil(on.h)}px`); title.style.setProperty('--th-off', `${Math.ceil(measure(17).h)}px`); }
        else { title.style.removeProperty('--th-on'); title.style.removeProperty('--th-off'); }
        const dlh = parseFloat(getComputedStyle(what).lineHeight) || 24.375;
        const area = Math.max(tlh + 3 * dlh, 2 * tlh + 2 * dlh);         // '제목 1줄+설명 3줄'과 '2줄+2줄' 중 큰 쪽 → 어느 경우든 같은 높이
        what.style.minHeight = `${Math.max(dlh, area - th)}px`;
      });
      // 목록 높이 고정: 기능을 하나씩 펼친 상태(애니메이션 없이)로 재서 가장 큰 높이를 목록 최소 높이로 → 펼침이 바뀌는 동안·여러 칸을 건너뛰어도 목록 전체 높이가 그대로
      const lists = [...document.querySelectorAll('.fe-list')];
      // 항목마다 접힘·펼침 높이를 재 두고(애니메이션 없이), 펼친 항목(k)에 따라 각 항목의 자리 = 앞 항목들 높이의 합
      const place = (list, k) => {
        const h = list._h; if (!h) return;
        let y = 0;
        [...list.children].forEach((it, i) => { it.style.setProperty('--top', `${Math.round(y)}px`); y += i === k ? h.open[i] : h.closed[i]; });   // 자리는 정수 px로(소수 px면 애니메이션이 끝나는 순간 글자가 픽셀 격자로 1px 스냅)
      };
      const reserve = () => {
        const wide = matchMedia('screen and (min-width: 760px)').matches;
        lists.forEach((list) => {
          list.classList.remove('fe-placed'); list.style.height = ''; list._h = null;
          [...list.children].forEach((it) => it.style.removeProperty('--top'));
          if (!wide) return;
          const its = [...list.querySelectorAll('.fe-item')], was = its.map((x) => x.classList.contains('on'));
          list.classList.add('fe-measure');
          const open = [], closed = [];
          its.forEach((it, i) => {
            its.forEach((x) => x.classList.toggle('on', x === it));
            open[i] = it.getBoundingClientRect().height;
            closed[(i + 1) % its.length] = its[(i + 1) % its.length].getBoundingClientRect().height;
          });
          its.forEach((x, i) => x.classList.toggle('on', was[i]));
          list._h = { open, closed };
          const max = Math.max(...its.map((_, k) => open[k] + closed.reduce((a, c, i) => a + (i === k ? 0 : c), 0)));
          list.style.height = `${Math.ceil(max)}px`;
          list.classList.add('fe-placed');
          place(list, Math.max(0, was.indexOf(true)));
          list.offsetHeight; list.classList.remove('fe-measure');
        });
      };
      window.__fePlace = place;                                          // bindFeatures가 항목을 바꿀 때 부름
      const both = () => { fit(); reserve(); };
      both();
      let t = 0; addEventListener('resize', () => { clearTimeout(t); t = setTimeout(both, 120); });
      document.fonts?.ready.then(both); setTimeout(both, 1200);
    }
    //   진척도: 기능 소개 트랙(.fe)이 머리 막대 아래에 닿은 뒤 스크롤한 거리 ÷ 기능 하나의 몫(트랙 높이 − 고정 높이) / 기능 수
    function bindFeatures() {
      const blocks = [...document.querySelectorAll('.fe')].map((fe) => ({ fe, pin: fe.querySelector('.fe-pin'), items: [...fe.querySelectorAll('.fe-item')], shots: [...fe.querySelectorAll('.fe-shot')], dots: [...fe.querySelectorAll('.fe-dot')], cur: 0 }));
      if (!blocks.length) return;
      const wide = () => matchMedia('screen and (min-width: 760px)').matches;
      const geo = (b) => {
        const top = b.fe.getBoundingClientRect().top + scrollY, pinTop = parseFloat(getComputedStyle(b.pin).top) || 0;
        const span = Math.max(1, b.fe.offsetHeight - b.pin.offsetHeight);
        return { start: top - pinTop, step: span / b.items.length };
      };
      const set = (b, k) => {
        if (k === b.cur) return;
        // 여러 칸을 빠르게 건너뛸 때: 마지막으로 다 펼쳐져 있던 항목(stable)만 접히는 애니메이션, 그 사이 잠깐 펼쳐지던 항목은 즉시 접음
        //   → 접히는 높이와 펼쳐지는 높이가 늘 한 쌍이라 목록에 빈 공간이 생기지 않음
        const now = performance.now();
        if (now - (b.lastSwitch || 0) > 550) b.stable = b.cur;
        b.lastSwitch = now;
        b.cur = k;
        b.items.forEach((it, i) => {
          if (i !== k && i !== b.stable && it.classList.contains('on')) { it.classList.add('fe-snap'); it.classList.remove('on'); it.offsetHeight; setTimeout(() => it.classList.remove('fe-snap'), 30); }
          else it.classList.toggle('on', i === k);
        });
        b.shots.forEach((s) => {
          const d = +s.dataset.fe - k;
          s.style.setProperty('--d', String(d));
          s.classList.toggle('on', d === 0);
          s.classList.toggle('near', Math.abs(d) === 1);
        });
        b.dots.forEach((d, i) => d.classList.toggle('on', i === k));
        b.dots[0]?.parentElement.style.setProperty('--fe-rows', b.dots.map((d, i) => (i === k ? '48px' : '8px')).join(' '));   // 줄 높이를 한꺼번에 — 전체 높이 고정
        const list = b.fe.querySelector('.fe-list'); if (list && window.__fePlace) window.__fePlace(list, k);
      };
      // 건너뛰는 중간 항목은 아예 열지 않음: 스크롤 위치가 가리키는 항목이 0.08초 그대로일 때만 바꿈(빠르게 지나간 항목은 열리지 않음).
      //   점·흐린 항목을 눌러 이동할 때는 바로 목표 항목을 열고, 스크롤이 그 항목에 닿을 때까지 지나가는 항목은 무시
      const WAIT = 80;
      const FILL = 0.8;                                                  // 한 기능 몫 중 게이지가 차는 부분 — 남은 0.2는 꽉 찬 채로 조금 더 스크롤해야 넘어가는 여유
      const update = () => {
        if (matchMedia('print').matches || !wide()) return;
        const now = performance.now();
        blocks.forEach((b) => {
          const { start, step } = geo(b);
          const n = b.items.length, pr = (scrollY - start) / step;           // 진척도(기능 단위) — 화면이 고정된 순간 0. 정수 부분 = 가리키는 기능, 나머지 = 그 기능 안에서 스크롤한 정도
          const k = Math.max(0, Math.min(n - 1, Math.floor(pr)));
          if (b.lock && now < b.lock.until && k !== b.lock.k) { /* 눌러서 이동 중 — 지나가는 항목 무시 */ }
          else {
            b.lock = null;
            if (k === b.cur) b.pending = null;
            else if (b.pending !== k) { b.pending = k; b.pendingAt = now; clearTimeout(b.timer); b.timer = setTimeout(update, WAIT + 10); }
            else if (now - b.pendingAt >= WAIT) { set(b, k); b.pending = null; }
            else { clearTimeout(b.timer); b.timer = setTimeout(update, WAIT - (now - b.pendingAt) + 10); }
          }
          b.dots[b.cur]?.style.setProperty('--fill', String(Math.max(0, Math.min(1, (pr - b.cur) / FILL))));   // 한 기능 몫의 앞 FILL만큼에서 게이지가 0 → 1로 차고, 나머지는 꽉 찬 채로 머문 뒤 다음 기능으로
        });
      };
      blocks.forEach((b) => b.fe.addEventListener('click', (e) => {
        const go = e.target.closest('[data-fe-go]');
        if (!go || !wide()) return;
        const k = +go.dataset.feGo, { start, step } = geo(b);
        if (k === b.cur && !b.lock) return;                              // 지금 보고 있는 항목을 다시 누르면 그대로(진척도를 처음으로 되돌리지 않음)
        b.lock = { k, until: performance.now() + 1500 }; b.pending = null;
        set(b, k);
        scrollTo({ top: Math.ceil(start + step * k) + 1, behavior: 'smooth' });   // 그 항목 스크롤 구간의 맨 위(1px 안쪽, 게이지 빈 상태)로
      }));
      update();
      addEventListener('scroll', update, { passive: true });
      addEventListener('resize', update);
    }

    // profile.md "## 기타 프로젝트 (링크만)" 절 → [{ title, intro, info, tech[], role, url, video }] (프로젝트 문서 없이 소개·링크만 있는 카드)
    function parseLinkCards(md) {
      const lines = md.replace(new RegExp('<' + '!--[\\s\\S]*?--' + '>', 'g'), '').split(/\r?\n/);
      const start = lines.findIndex((l) => /^##\s+기타 프로젝트\s*\(링크/.test(l.trim()));
      if (start < 0) return [];
      const cards = []; let cur = null;
      const KEYS = { '소개': 'intro', '정보': 'info', '기술': 'tech', '맡은 역할': 'role', '링크': 'url', '시연 영상': 'video', '이미지': 'image', '장르': 'genre' };
      for (const raw of lines.slice(start + 1)) {
        const l = raw.trim();
        if (/^##\s/.test(l)) break;
        const h = l.match(/^###\s+(.+)$/);
        if (h) { cur = { title: h[1].trim() }; cards.push(cur); continue; }
        const m = cur && l.match(/^-\s*([^:：]+)[:：]\s*(.*)$/);
        if (m && KEYS[m[1].trim()] && m[2].trim()) cur[KEYS[m[1].trim()]] = m[2].trim();
      }
      return cards.filter((c) => c.title).map((c) => ({ ...c, tech: (c.tech || '').split(',').map((x) => x.trim()).filter(Boolean), url: isUrl(c.url) ? c.url : '', video: isUrl(c.video) ? c.video : '' }));
    }
    // profile.md "## 써 본 도구 (태그만)" 절 → [{ label, tags[], line }] (기술 스택 카드 아래 태그 줄, 근거 문장 없음)
    //   한 줄에 ` | `로 묶음을 여럿 적으면 넓은 화면에서 그 묶음들을 한 줄에 나란히(line = 같은 줄 번호). 휴대폰에서는 묶음마다 한 줄
    function parseToolRows(md) {
      const lines = md.replace(new RegExp('<' + '!--[\\s\\S]*?--' + '>', 'g'), '').split(/\r?\n/);
      const start = lines.findIndex((l) => /^##\s+써 본 도구/.test(l.trim()));
      if (start < 0) return [];
      const rows = [];
      for (const raw of lines.slice(start + 1)) {
        const l = raw.trim();
        if (/^##\s/.test(l)) break;
        if (!/^-\s/.test(l)) continue;
        const line = rows.length ? rows[rows.length - 1].line + 1 : 0;
        for (const part of l.replace(/^-\s*/, '').split(/\s+\|\s+/)) {
          const m = part.match(/^([^:：]+)[:：]\s*(.*)$/);
          const tags = m ? m[2].split(',').map((x) => x.trim()).filter(Boolean) : [];
          if (m && m[1].trim() && tags.length) rows.push({ label: m[1].trim(), tags, line });
        }
      }
      return rows;
    }
    const linkHost = (u) => /github\.com/i.test(u) ? 'GitHub' : t('page.link-card-open');

    // 기타 프로젝트 카드 한 장(링크만 있는 카드와 data/의 기타 프로젝트가 같은 형식). c: { id?, title, info, intro, role, tech[], links: [[이름, 주소]] }
    function LinkCard({ c }) {
      return (
        <article id={c.id ? `p-${c.id}` : undefined} className="card-print reveal flex flex-col overflow-hidden rounded-3xl border border-[var(--line)] bg-[var(--card)] p-7">
          {c.image && <div className="lc-shot"><Shot src={c.image} alt={`${c.title} 대표 화면`} /></div>}   {/* 대표 이미지(4:3): data/의 cover · profile.md의 "- 이미지:" */}
          <h3 className="text-xl font-bold tracking-tight">{c.title}</h3>
          {c.info && <p className="mt-2 text-xs text-[var(--sub)]">{c.info}</p>}
          {c.intro && <p className="mt-4 text-[15px] leading-relaxed"><Inline text={c.intro} /></p>}
          {c.role && <p className="mt-3 text-sm leading-relaxed"><b className="font-semibold">{t('name.role-short')}</b> ― <Inline text={c.role} /></p>}
          {c.tech.length > 0 && <div className="mt-5 flex flex-wrap gap-2">{c.tech.map((g) => <span key={g} className="chip">{g}</span>)}</div>}
          {c.links.length > 0 && (
            <div className="mt-auto pt-6">
              <div className="flex flex-wrap gap-x-4 gap-y-1 text-sm">{c.links.map(([k, href]) =>   /* 프로젝트 요약과 같은 글자 링크(모두 본문색) */
                <Ext key={href} className="tlink text-[var(--muted)]" href={href}>{k}</Ext>)}</div>
              <PrintUrls rows={c.links} />
            </div>
          )}
        </article>
      );
    }
    // data/의 기타 프로젝트 → 카드 형식(정보 = 기간 · 인원 팀)
    // profile.md 페이지 설정 "- 발표 덱 빼기: 폴더, 폴더" → 그 기타 프로젝트 카드에서 슬라이드 링크를 뺌(슬라이드 페이지는 그대로 있음)
    let noDeck = new Set();
    function parseNoDeck(md) {
      const l = md.replace(new RegExp('<' + '!--[\\s\\S]*?--' + '>', 'g'), '').split(/\r?\n/).map((x) => x.trim()).find((x) => /^-\s*발표 덱 빼기\s*[:：]/.test(x));
      return new Set(l ? l.replace(/^-\s*발표 덱 빼기\s*[:：]/, '').split(',').map((x) => x.trim()).filter(Boolean) : []);
    }
    const otherCard = (p) => {
      const meta = Object.fromEntries((p.meta || []).map((m) => [m.label, m.value]));
      const who = meta['인원'] ? `${meta['인원']}${p.team?.type === 'team' ? ' 팀' : ''}` : teamLabel(p.team);
      return { id: p.id, title: p.title, genre: meta['장르'] || '', team: teamLabel(p.team), info: [meta['기간'], who].filter(Boolean).join(' · '), intro: p.tagline, role: p.team?.role, image: p.cover ? img(p, p.cover) : '',
        tech: p.tags || [], links: projectUrlRows(p).filter(Boolean).filter(([k]) => !(noDeck.has(p.id) && k === t('name.deck'))) };
    };

    // ⑦ 기타 프로젝트(layout.json에 없는 절) — data/의 기타 프로젝트 + profile.md의 링크만 있는 카드를 같은 형식으로, 넓은 화면에서 가로 3장
    // 기타 프로젝트 카드 목록(카드 절과 연락처 LINK가 같은 순서로 씀). data/ 쪽 카드는 p에 원래 프로젝트를 둠
    function otherCards(others, links = []) {
      return [...others.map((p) => ({ ...otherCard(p), p })), ...links.map((c) => ({ ...c, image: c.image ? encodePath(c.image) : '', links: [c.video && [videoName(c.genre), c.video], c.url && [linkHost(c.url), c.url]].filter(Boolean) }))]   // 캡슐 바와 같게 시연 영상('시연 영상', 문구 표 name.video)이 먼저, 그다음 링크
        // 순서 = data/의 기타 프로젝트(profile.md "기타 프로젝트" 순서) 다음에 링크만 있는 카드(적은 순서)
    }
    function Others({ cards }) {
      if (!cards.length) return null;
      return (
        <section id="others" className="sec pb-24 md:pb-32 pt-[calc(6rem_-_5mm)] md:pt-[calc(8rem_-_5mm)]">
          <div className="wrap">
            <SecHead en={t('en.others')} title={t('page.others')} />
            <div className="grid gap-5 md:grid-cols-2 lg:grid-cols-3">{cards.map((c) => <LinkCard key={c.id || c.title} c={c} />)}</div>
          </div>
        </section>
      );
    }

    // ⑧ 한눈에 보기(작은 대표 이미지 + 줄 목록 · tinted — layout.json의 grid 3열 대신 사용자 요청)
    //   제목 아래: "개인/팀 프로젝트 · 장르", 그 아래 환경(정보 표의 '환경'과 같은 순서, 쉼표 → ·). 환경이 없으면 태그 앞 4개
    function Glance({ projects, others = [] }) {
      if (!projects.length) return null;
      const metaOf = (p, label) => (p.meta || []).find((m) => m.label === label)?.value || '';
      const envItems = (p) => { const env = (metaOf(p, '개발 환경') || metaOf(p, '환경')); return env ? env.split(',').map((x) => x.trim()).filter(Boolean) : (p.tags || []).slice(0, 4); };
      // 한눈에 보기에서만 Unity 6 계열 버전을 줄여 씀(6000.3.15f1 → 6.3) — 휴대폰에서 개발 환경이 한 줄에 들어가게. 정확한 버전은 프로젝트 소개 표에 그대로
      const shortEnv = (x) => x.replace(/^Unity\s+6000\.(\d+)(?:\.\S+)?$/i, 'Unity 6.$1');
      const EnvLine = ({ p }) => envItems(p).map(shortEnv).map((x, i) => <Fragment key={x}>{i > 0 && ' · '}<span className="whitespace-nowrap">{x}</span></Fragment>);   // 항목 하나(ASP.NET Core 등)는 줄바꿈으로 끊지 않음
      return (
        <section id="glance" className="sec tinted pb-24 md:pb-32 pt-[calc(6rem_-_5mm)] md:pt-[calc(8rem_-_5mm)]">
          <div className="wrap">
            <SecHead en={t('en.glance')} title={t('page.glance')} />
            <ul className="gl">
              {projects.map((p, j) => (
                <li key={p.id} className="gl-row reveal">
                  {p.cover && <a href={`#p-${p.id}`} className="gl-thumb img-link" tabIndex={-1} aria-hidden="true"><Shot src={img(p, p.cover)} alt="" /><ImgMore href={`#p-${p.id}`} /></a>}
                  <div className="gl-info">
                    <p className="gl-no accent text-sm font-bold tabular-nums">{pad2(j + 1)}</p>
                    <a href={`#p-${p.id}`} className="gl-title mt-1 block text-2xl font-bold tracking-tight hover:underline">{p.title}</a>
                    <p className="gl-meta mt-1 text-xs text-[var(--sub)]">{[teamLabel(p.team), metaOf(p, '장르')].filter(Boolean).join(' · ')}</p>
                    {envItems(p).length > 0 && <p className="gl-env mt-3 text-xs leading-relaxed text-[var(--sub)]"><EnvLine p={p} /></p>}
                  </div>
                  <div className="gl-body">
                    {p.tagline && <p className="text-[15px] leading-relaxed"><Inline text={p.tagline} /></p>}
                    {p.team?.role && <p className="mt-3 text-sm leading-relaxed"><b className="font-semibold">{t('name.role-short')}</b> ― <Inline text={p.team.role} /></p>}
                    <div className="mt-4 flex flex-wrap gap-x-4 gap-y-1 text-sm">
                      <Ext className="tlink text-[var(--muted)]" href={deckHref(p)}>{t('name.deck')}</Ext>
                      <Ext className="tlink text-[var(--muted)]" href={docHref(p)}>{t('name.doc-short')}</Ext>
                      {repoLinks(p).map(([k, u]) => <Ext key={u} className="tlink text-[var(--muted)]" href={u}>{k}</Ext>)}
                      {isUrl(p.links?.video) && <Ext className="tlink text-[var(--muted)]" href={p.links.video}>{projectVideoName(p)}</Ext>}
                    </div>
                  </div>
                </li>
              ))}
            </ul>
            {others.length > 0 && <OtherList cards={others} />}
          </div>
        </section>
      );
    }
    // 프로젝트 요약 아래 기타 프로젝트: 대표 이미지 + 이름 + 그 아래 개인/팀 프로젝트 · 장르를 한 줄씩(두 줄)만. 누르면 기타 프로젝트 절의 그 카드로
    //   개인/팀: data/의 기타 프로젝트는 team, 링크만 있는 카드는 profile.md "- 정보:"에 '팀'·'개인'·'1인'이 있으면. 장르: data/는 정보 표의 장르, 링크 카드는 "- 장르:"
    const otherTeam = (c) => c.team || (/팀/.test(c.info || '') ? t('name.team') : /개인|1인/.test(c.info || '') ? t('name.solo') : '');
    function OtherList({ cards }) {
      return (
        <div className="gl-more reveal">
          <ul className="glo">
            {cards.map((c) => {
              const href = c.id ? `#p-${c.id}` : '#others';
              return (
                <li key={c.id || c.title} className="glo-item">
                  {c.image && <a href={href} className="glo-thumb img-link" tabIndex={-1} aria-hidden="true"><Shot src={c.image} alt="" /></a>}
                  <div>
                    <a href={href} className="glo-title hover:underline">{c.title}</a>
                    {otherTeam(c) && <p className="glo-meta">{otherTeam(c)}</p>}
                    {c.genre && <p className="glo-meta">{c.genre}</p>}
                  </div>
                </li>
              );
            })}
          </ul>
        </div>
      );
    }

    // ⑨ 연락처(layout: columns 3단 42:23:35 · tinted)
    function Contact({ prof, all, projects = all, hasOthers = false, linkAll = all, updated }) {
      const links = (prof.links || []).filter((l) => isUrl(l.url));
      return (
        <footer id="contact" className="sec tinted border-t border-[var(--line)] pb-24 md:pb-28 pt-[calc(6rem_-_5mm)] md:pt-[calc(7rem_-_5mm)]">
          <div className="wrap cols3">
            <div>
              <p className="eyebrow">{t('en.contact')}</p>
              <p className="mt-4 text-3xl md:text-4xl font-bold tracking-tight">{prof.name}</p>
              {prof.email && <p className="mt-6 text-lg"><a className="tlink" href={`mailto:${prof.email}`}>{prof.email}</a><CopyButton text={prof.email} /></p>}
              {isUrl(prof.github) && <p className="mt-2"><Ext className="tlink text-[var(--muted)]" href={prof.github}>{shortUrl(prof.github)}</Ext></p>}
              {links.map((l) => <p key={l.url} className="mt-2"><Ext className="tlink text-[var(--muted)]" href={l.url}>{shortUrl(l.url)}</Ext></p>)}
              <p className="print-only mt-2 text-[var(--sub)]">{visibleUrl(PAGE_URL)}</p>
            </div>
            <div>
              <p className="eyebrow">{t('en.project')}</p>
              <ul className="mt-4 space-y-2 text-sm">
                {projects.map((p) => <li key={p.id}><a className="tlink text-[var(--muted)]" href={`#p-${p.id}`}>{p.title}</a></li>)}
                {hasOthers && <li><a className="tlink text-[var(--muted)]" href="#others">{t('page.others')}</a></li>}   {/* 기타 프로젝트는 하나로, 그 절로 */}
              </ul>
            </div>
            <div>
              <p className="eyebrow">{t('en.link')}</p>
              <ul className="mt-4 space-y-3 text-sm">
                {linkAll.map((x) => {                                                       // 페이지에 나오는 순서(주력 프로젝트 → 기타 프로젝트 카드 순서)
                  const p = x.p || x;
                  if (!p.id) {                                                              // profile.md의 링크만 있는 기타 프로젝트
                    const ls = [p.url && [linkHost(p.url), p.url], p.video && ['YouTube', p.video]].filter(Boolean);   // 주력 프로젝트처럼 시연 영상은 맨 끝에 YouTube로
                    if (!ls.length) return null;
                    return (
                      <li key={p.title}>
                        <b className="font-semibold">{p.title}</b>
                        <span className="mt-1 flex flex-wrap gap-x-3 gap-y-1">
                          {ls.map(([k, u]) => <Ext key={u} className="tlink text-[var(--muted)]" href={u}>{k}<span className="print-only"> {shortUrl(u)}</span></Ext>)}
                        </span>
                      </li>
                    );
                  }
                  const ls = [...repoLinks(p),          // GitHub(둘 이상이면 'GitHub(역할)') → 그 밖의 링크 → 시연 영상은 맨 끝에 YouTube로
                    ...otherLinks(p), isUrl(p.links?.video) && ['YouTube', p.links.video]].filter(Boolean);
                  if (!ls.length) return null;
                  return (
                    <li key={p.id}>
                      <b className="font-semibold">{p.title}</b>
                      <span className="mt-1 flex flex-wrap gap-x-3 gap-y-1">
                        {ls.map(([k, u]) => <Ext key={u} className="tlink text-[var(--muted)]" href={u}>{k}<span className="print-only"> {shortUrl(u)}</span></Ext>)}
                      </span>
                    </li>
                  );
                })}
              </ul>
            </div>
          </div>
          <div className="wrap mt-20 space-y-1 text-xs text-[var(--sub)]">
            {prof.name && <p className="m-0">© {prof.name}</p>}
            <p className="no-print m-0">{t('page.browser-note')}</p>
            {updated && <p className="m-0">{t('page.last-updated', { date: updated })}</p>}
          </div>
        </footer>
      );
    }

    function App() {
      const [state, setState] = useState({ status: 'loading' });
      useEffect(() => {
        (async () => {
          if (location.protocol === 'file:') { info.errors.push('file:// — 로컬 서버로 열어야 합니다'); setState({ status: 'file' }); return; }
          try {
            if (window.PFStr) await PFStr.load('theme/strings.tsv');
            try { const r = await fetch('theme/strings.tsv', { cache: 'no-cache' }); if (r.ok) STR = { ...FALLBACK, ...parseStrings(await r.text()) }; } catch { /* 기본 문구 */ }
            const res = await fetch('data/portfolio.json', { cache: 'no-cache' });
            if (!res.ok) throw new Error(`data/portfolio.json: ${res.status}`);
            const pf = await res.json();
            const load = (id) => fetch(`data/projects/${encodeURIComponent(id)}.json`, { cache: 'no-cache' }).then((r) => r.ok ? r.json() : null).catch(() => null);
            const [projects, others] = await Promise.all([Promise.all((pf.projects || []).map(load)), Promise.all((pf.others || []).map(load))]).then((a) => a.map((x) => x.filter(Boolean)));
            let links = [], tools = [];
            try { const r = await fetch('profile.md', { cache: 'no-cache' }); if (r.ok) { const md = await r.text(); links = parseLinkCards(md); tools = parseToolRows(md); noDeck = parseNoDeck(md); } } catch { /* 링크 카드·태그 줄 없음 */ }
            if (/^#[0-9a-fA-F]{6}$/.test(pf.settings?.accent || '')) html.style.setProperty('--accent-profile', pf.settings.accent);
            const name = pf.profile?.name;
            document.title = `${name ? name + ' · ' : ''}${t('name.portfolio')}`;
            document.querySelector('.skip-link').textContent = t('ui.skip');
            setState({ status: 'ok', pf, projects, others, links, tools });
          } catch (e) {
            info.errors.push(String(e && e.message || e));
            setState({ status: 'error', msg: String(e && e.message || e) });
          }
        })();
      }, []);

      // 그린 뒤: 떠오름 · 머리 막대 늘어남 · 주소의 절로 이동(또는 새로고침 전 위치) · 그림 준비 → ready
      useEffect(() => {
        if (state.status !== 'ok') { if (state.status !== 'loading') { html.dataset.pfReady = 'yes'; resolveReady(report()); } return; }
        info.sections = [...document.querySelectorAll('main section[id], footer[id]')].map((s) => s.id);
        info.projects = state.projects.length; info.others = state.others.length; info.linkCards = state.links.length;
        bindReveal();
        bindTopBar();
        bindHeads();
        bindCaps();
        bindFeatures();
        bindFeatureHeights();
        pinIntroDark();
        bindBackdrop();
        bindNavSpy();
        bindProjMenu();
        syncBarColor();
        if (PDF_BASE) { absolutizeLinks(); eager(); showAll(); }         // 미리 만드는 PDF: 링크는 배포 주소로, 그림은 모두 받고, 떠오름 없이
        let userMoved = false;
        ['wheel', 'touchstart', 'keydown', 'pointerdown'].forEach((ev) => addEventListener(ev, () => { userMoved = true; }, { once: true, passive: true }));
        let arrived = goHash(state.projects), restoreY = null;
        if (!arrived && !window.PFAnchor && ['reload', 'back_forward'].includes(performance.getEntriesByType?.('navigation')[0]?.type)) {   // 직접 고침: page-anchor.js가 있으면 그쪽이 보던 요소 기준으로 맞춤(둘이 부딪혀 떨리지 않도록)   // 새로고침 · 뒤로(프로젝트 상세 문서의 [← 포트폴리오] 포함)로 다시 열렸을 때 읽던 위치로
          try { restoreY = +sessionStorage.getItem(POS) || null; } catch {}
          if (restoreY) scrollTo({ top: restoreY, behavior: 'instant' });
        }
        heroRise(document.querySelector('#cover .hero-pill'));          // 읽던 위치·# 절로 옮긴 뒤 다시: 캡슐이 화면 밖이면 등장 연출 끔
        settleTopBar();
        // 주소의 # 이 바뀔 때: 페이지 안의 링크(메뉴 등)로 바뀐 것이면 브라우저가 이미 그 절로 부드럽게 스크롤하므로 손대지 않음
        //   (여기서 또 순간 이동하면 브라우저의 스크롤과 부딪혀 몇 px씩 어긋난 곳에 멈춤). 예전 주소(#s=…, 번호 등)처럼 그 id의 절이 없을 때만 옮겨 줌
        const onHash = () => {
          let h = location.hash.slice(1);
          try { h = decodeURIComponent(h); } catch {}
          if (h && document.getElementById(h)) return;
          goHash(state.projects);
        };
        addEventListener('hashchange', onHash);
        (async () => {
          const desk = matchMedia('(pointer: fine)').matches && !(navigator.connection && navigator.connection.saveData);
          if (desk) eager();                                             // 데스크톱이면 그림을 미리 받아 Ctrl+P도 빠짐없이
          await Promise.race([Promise.all([...document.querySelectorAll('img:not([loading="lazy"])')].map(loaded)), new Promise((r) => setTimeout(r, 20000))]);
          if (document.fonts) await Promise.race([document.fonts.ready, new Promise((r) => setTimeout(r, 3000))]);
          if (!userMoved && (arrived || restoreY)) {                     // 글꼴·그림이 늦게 와 밀린 만큼 다시 맞춤 — 이때도 머리 막대는 움직임 없이 옮긴 자리의 상태로
            document.querySelector('.site-head')?.classList.add('instant');
            const el = arrived && document.getElementById(arrived);
            if (el) el.scrollIntoView({ behavior: 'instant', block: 'start' });
            else scrollTo({ top: restoreY, behavior: 'instant' });
            settleTopBar();
          }
          html.dataset.pfReady = 'yes';
          resolveReady(report());
        })();
        return () => removeEventListener('hashchange', onHash);
      }, [state.status]);

      if (state.status === 'loading') return <p className="msg">불러오는 중…</p>;
      if (state.status === 'file') return <div className="msg"><p>이 페이지는 data/를 불러와 그리기 때문에 파일을 더블클릭해서는 열리지 않습니다. 레포 폴더에서 아래 명령을 실행한 뒤 http://localhost:4600/custom/ 으로 여세요.</p><pre>python3 -m http.server 4600</pre></div>;
      if (state.status === 'error') return <div className="msg"><p>아직 포트폴리오 데이터가 없거나 읽지 못했습니다. Claude Code에서 아래 명령을 실행하세요.</p><pre>/portfolio-build</pre><p>{state.msg}</p></div>;
      const { pf, projects, others, links, tools = [] } = state;
      const prof = pf.profile || {};
      const all = [...projects, ...others];
      const ocards = otherCards(others, links);
      const byId = Object.fromEntries(all.map((p) => [p.id, p]));
      const total = pad2(projects.length);
      const bars = [...projects.map((p, j) => ({ eyebrow: t('page.project-no', { no: pad2(j + 1), total }), title: p.title, sub: (p.highlights || []).length ? t('page.features') : '' }))];
      return (
        <>
          <Nav prof={prof} projects={projects} others={[...others, ...links]} hasSkills={(pf.skills || []).length > 0 || tools.length > 0} bars={bars} otherLabel={t('page.others')} />
          <main id="main">
            <Cover pf={pf} prof={prof} projects={projects} />
            <Intro prof={prof} />
            <Stack skills={pf.skills || []} byId={byId} tools={tools} />
            {projects.map((p, j) => {
              const no = t('page.project-no', { no: pad2(j + 1), total });
              const hasFe = (p.highlights || []).length > 0;
              return (
                <div key={p.id} className="pg" data-bar={j}>
                  <ProjectIntro p={p} no={no} />
                  <Features p={p} no={no} />
                  <LinkCapsule p={p} />
                </div>
              );
            })}
            <Others cards={ocards} />
            <Glance projects={projects} others={ocards} />
          </main>
          <Contact prof={prof} all={all} projects={projects} hasOthers={ocards.length > 0} linkAll={[...projects, ...ocards]} updated={pf.generatedAt} />
        </>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
